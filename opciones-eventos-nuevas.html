<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eventos: nuevas ideas de portada — Launch Studio</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Poppins:wght@300;400;500;600;800&display=swap">
<style>
/* Cinco ideas nuevas para la portada de Eventos corporativos. Todas avanzan al bajar y retroceden al subir. */
:root{--white:#F1F0E8;--paper:#FBF8F2;--ink:#0b0b0b;--red:#D93333;--deep:#B9251F;--grey:#5f5d56;--line:rgba(11,11,11,.14);--pad:clamp(20px,4vw,64px);--bh:48px;--font:"Poppins",system-ui,sans-serif;--mono:"DM Mono",ui-monospace,monospace}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--white);color:var(--ink);font-family:var(--font);font-weight:300;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}a{color:inherit;text-decoration:none}
.bar{position:fixed;inset:0 0 auto 0;z-index:80;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:9px var(--pad);background:rgba(11,11,11,.94);color:var(--white);font:400 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.bar b{font-weight:400;opacity:.55;margin-right:6px}
.bar a{border:1px solid rgba(241,240,232,.35);border-radius:999px;padding:5px 12px}
.bar a:hover{background:var(--red);border-color:var(--red)}
.bar a[aria-current]{background:var(--white);color:var(--ink);border-color:var(--white)}
.sc{height:550vh;margin-top:var(--bh)}
.pin{position:sticky;top:var(--bh);height:calc(100vh - var(--bh));overflow:hidden}
.k{font:400 10px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.crumb{position:absolute;left:var(--pad);top:clamp(20px,3vw,32px);z-index:9;font:400 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;opacity:.65}
.side{position:absolute;left:var(--pad);bottom:clamp(30px,6vh,60px);max-width:min(440px,80vw);z-index:9}
.side h1{font-weight:300;font-size:clamp(28px,3vw,50px);letter-spacing:-.04em;line-height:1.04}
.side h1 b{font-weight:800;letter-spacing:-.06em}
.side p{margin-top:14px;color:var(--grey);font-size:16px;line-height:1.55}
.note{padding:40px var(--pad) 80px;max-width:860px;font-size:16px;line-height:1.7;color:var(--grey)}
.note b{color:var(--ink);font-weight:600}
.lg{display:block;height:26px;width:auto}
.sh{box-shadow:0 24px 50px rgba(60,30,20,.2),0 3px 8px rgba(0,0,0,.08)}

/* 1 · La mesa de trabajo */
.n1 .pin{background:#D9CBB6;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 3px,transparent 3px 90px),repeating-linear-gradient(90deg,rgba(80,50,20,.05) 0 1px,transparent 1px 13px)}
.n1 .desk{position:absolute;left:58%;top:50%;width:1200px;height:760px;margin:-380px 0 0 -600px;transform-origin:50% 50%;transform:scale(var(--fs,1))}
.n1 .it{position:absolute;will-change:transform}
.n1 .plan{width:520px;height:360px;background:#F4F7FA;padding:20px}
.n1 .plan svg{width:100%;height:100%}
.n1 .inv{width:300px;height:200px;background:var(--red);border-radius:4px;display:grid;place-items:center}
.n1 .card{width:250px;height:340px;background:var(--paper);padding:22px;display:flex;flex-direction:column;justify-content:space-between}
.n1 .card h2{font-weight:800;font-size:30px;line-height:.9;letter-spacing:-.06em}.n1 .card h2 span{color:var(--red)}
.n1 .badge{width:170px;height:240px;background:#fff;border-radius:12px;padding:18px;display:flex;flex-direction:column;justify-content:space-between}
.n1 .badge h3{font-weight:800;font-size:22px;line-height:.92;letter-spacing:-.05em}
.n1 .sw{width:110px;height:110px;border-radius:50%}
.n1 .chips{display:flex;flex-direction:column;width:70px;background:#fff;padding:6px;gap:6px}.n1 .chips i{height:46px}
.n1 .pen{width:340px;height:12px;border-radius:6px;background:linear-gradient(90deg,#0b0b0b 0 82%,#c9c3b8 82% 94%,#0b0b0b 94%)}
.n1 .ttl{position:absolute;left:var(--pad);bottom:clamp(30px,6vh,60px);z-index:9;color:var(--ink)}

/* 2 · El libro desplegable */
.n2 .pin{background:#E7E1D6;perspective:1500px;display:grid;place-items:center}
.n2 .book{position:relative;width:min(760px,86vw);aspect-ratio:1.5;transform-style:preserve-3d;transform:translateY(8vh) rotateX(calc(18deg + var(--o,0)*34deg))}
.n2 .pg{position:absolute;top:0;bottom:0;width:50%;background:var(--paper);transform-style:preserve-3d}
.n2 .pg.l{left:0;transform-origin:100% 50%;transform:rotateY(calc((1 - var(--o,0))*-180deg));background:#F4EFE6}
.n2 .pg.r{right:0;background:#F7F2E9}
.n2 .cov{position:absolute;inset:0;background:var(--red);transform:rotateY(180deg) translateZ(1px);backface-visibility:hidden;display:grid;place-items:center;border-radius:4px}
.n2 .cov .lg{height:70px}
.n2 .cov p{position:absolute;bottom:18px;color:#fff}
.n2 .base{position:absolute;inset:0;transform-style:preserve-3d}
.n2 .ly{position:absolute;bottom:0;transform-origin:50% 100%;transform-style:preserve-3d}
.n2 .ly > div{position:absolute;inset:0;transform-origin:50% 100%}
.n2 .wall{left:6%;right:6%;height:70%;top:auto;bottom:62%}
.n2 .scr{position:absolute;left:14%;right:14%;top:12%;height:52%;background:#1b1a18;display:grid;place-items:center;color:#fff;font-weight:800;letter-spacing:-.06em}
.n2 .row{left:8%;right:8%;height:9%}
.n2 .seat{position:absolute;bottom:0;width:6%;height:100%;background:#4a4846;border-radius:4px 4px 0 0}
.n2 .roll{width:9%;height:44%;background:var(--red);display:grid;place-items:center}
.n2 .stg{left:16%;right:16%;height:6%;background:#2a2826}

/* 3 · Las letras */
.n3 .pin{background:var(--white);display:grid;place-items:center}
.n3 .word{font-weight:800;font-size:clamp(90px,21vw,360px);letter-spacing:-.07em;line-height:.8;white-space:nowrap;color:transparent;background:url(https://www.launchstudiogroup.com/25f3b694-0d3c-438c-be95-81e2b03044e5.JPG) center/cover,url(assets/img/nosotros/nosotros-gradas.jpg) center/cover;-webkit-background-clip:text;background-clip:text;transform:scale(var(--s,1));transform-origin:var(--ox,45%) 52%}
.n3 .full{position:absolute;inset:0;background:url(https://www.launchstudiogroup.com/25f3b694-0d3c-438c-be95-81e2b03044e5.JPG) center/cover,url(assets/img/nosotros/nosotros-gradas.jpg) center/cover;opacity:var(--f,0)}
.n3 .full::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.6))}
.n3 .cap{position:absolute;left:var(--pad);right:var(--pad);bottom:clamp(30px,6vh,60px);color:#fff;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;opacity:var(--c,0);z-index:4}
.n3 .cap h2{font-weight:800;font-size:clamp(36px,5vw,84px);line-height:.88;letter-spacing:-.065em}.n3 .cap h2 span{color:var(--red)}
.n3 .cap p{max-width:22em;font-size:16px;line-height:1.55}
.n3 .tag{position:absolute;left:var(--pad);top:22%;opacity:calc(1 - var(--f,0))}

/* 4 · El panel de salidas */
.n4 .pin{background:#E5DFD4;display:grid;place-items:center}
.n4 .board{background:#1d1c1b;border-radius:14px;padding:clamp(14px,2vw,26px);box-shadow:0 40px 80px rgba(40,25,15,.3);transform:translateY(calc((1 - var(--in,0))*30vh));opacity:var(--in,0)}
.n4 .hd{display:flex;justify-content:space-between;align-items:center;color:#E8E2D6;margin-bottom:14px;gap:20px}
.n4 .row{display:flex;gap:3px;margin-top:5px}
.n4 .row.h .c{background:none;color:#8f8a80;height:auto;font-size:clamp(7px,.75vw,10px);font-family:var(--mono)}
.n4 .c{position:relative;width:clamp(16px,2.05vw,30px);height:clamp(24px,3vw,44px);background:#2b2a28;border-radius:3px;color:#F1EDE4;display:grid;place-items:center;font:600 clamp(13px,1.6vw,24px) var(--mono);overflow:hidden}
.n4 .c::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.6)}
.n4 .c.r{color:#ff5a50}
.n4 .c.f{animation:none}

/* 5 · El abanico */
.n5 .pin{background:#ECE6DB;display:grid;place-items:center}
.n5 .fan{position:relative;width:min(260px,44vw);aspect-ratio:.68;margin-top:6vh}
.n5 .cd{position:absolute;inset:0;border-radius:14px;padding:clamp(14px,1.8vw,22px);display:flex;flex-direction:column;justify-content:space-between;transform-origin:50% 160%}
.n5 .cd h3{font-weight:800;font-size:clamp(20px,2.2vw,30px);line-height:.92;letter-spacing:-.055em}
.n5 .cd p{font-size:clamp(11px,.95vw,13px);line-height:1.45;opacity:.75}
.n5 .cd .n{font:400 10px var(--mono);letter-spacing:.1em}

@media (max-width:820px){.side p{display:none}.n1 .desk{transform:scale(calc(var(--fs,1)*.9))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<nav class="bar" aria-label="Ideas"><b>Eventos · nuevas ideas</b>
  <a href="?m=1">1 · La mesa de trabajo</a><a href="?m=2">2 · El libro desplegable</a><a href="?m=3">3 · Las letras</a><a href="?m=4">4 · El panel de salidas</a><a href="?m=5">5 · El abanico</a>
</nav>
<main id="app"></main>
<div class="note" id="note"></div>

<script>
(function(){
  var LOGO=function(f,d,h){return '<svg class="lg" viewBox="440 260 1110 1470" style="'+(h?'height:'+h:'')+'" aria-hidden="true"><path d="M462 283H935V1467A353 353 0 0 0 1027 1703H935A473 473 0 0 1 462 1230Z" fill="'+(f||'#0b0b0b')+'"/><circle cx="1288" cy="1467" r="237" fill="'+(d||f||'#0b0b0b')+'"/></svg>'};
  var cl=function(x){return Math.max(0,Math.min(1,x))},io=function(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},out=function(x){return 1-Math.pow(1-x,3)};
  var M=new URLSearchParams(location.search).get('m')||'1';
  document.querySelectorAll('.bar a').forEach(function(a){if(a.getAttribute('href')==='?m='+M)a.setAttribute('aria-current','page')});
  var crumb='<p class="crumb">Servicios / Eventos corporativos</p>';
  var side=function(h,p){return '<div class="side"><h1>'+h+'</h1>'+(p?'<p>'+p+'</p>':'')+'</div>'};
  var NOTES={
   1:'<b>1 · La mesa de trabajo.</b> Vista desde arriba de la mesa de un estudio. Al bajar van cayendo sobre la mesa las piezas de un evento, una a una: el plano de la sala, la invitación, la acreditación, el moodboard de colores, las muestras de tela y el lápiz. Recoge las piezas que te gustaron (invitación y acreditación) en una sola escena.',
   2:'<b>2 · El libro desplegable.</b> Un libro rojo de Launch se abre y, como un libro pop-up, se levanta en papel la sala del evento: la pared con la pantalla «Welcome», el escenario, las filas de butacas y los roll-ups.',
   3:'<b>3 · Las letras.</b> La palabra «EVENTOS» en gigante, con la foto de un evento dentro de las letras. Al bajar, la cámara entra por una letra hasta que la foto llena la pantalla.',
   4:'<b>4 · El panel de salidas.</b> Un panel de paletas como el de un aeropuerto. Al bajar las letras giran hasta mostrar la agenda del evento: presentación, keynote, cóctel y cena, con su hora, su sala y su estado.',
   5:'<b>5 · El abanico.</b> Un mazo de tarjetas apiladas que se abre en abanico al bajar. Cada tarjeta es un tipo de evento: presentación de producto, conferencia, aniversario, kick-off y cena de gala.'};
  document.getElementById('note').innerHTML=NOTES[M]+'<br><br>Los textos (horas, nombres, salas) son de ejemplo.';
  var app=document.getElementById('app'),tick=function(){};
  var prog=function(sec){var bh=document.querySelector('.bar').offsetHeight,r=sec.getBoundingClientRect(),h=r.height-(innerHeight-bh);return h>0?cl((bh-r.top)/h):0};
  var wrap=function(cls,inner){app.innerHTML='<div class="'+cls+'"><section class="sc" id="sc"><div class="pin" id="pin">'+crumb+inner+'</div></section></div>'};

  if(M==='1'){
    var plan='<svg viewBox="0 0 480 320"><g fill="none" stroke="#2d4a6b" stroke-width="1.5"><rect x="4" y="4" width="472" height="312"/><rect x="140" y="12" width="200" height="56" fill="rgba(45,74,107,.08)"/><rect x="170" y="8" width="140" height="6" fill="#2d4a6b"/>';
    for(var r=0;r<5;r++)for(var c=0;c<12;c++)plan+='<rect x="'+(108+c*22+(c>5?20:0))+'" y="'+(96+r*24)+'" width="15" height="14" rx="3"/>';
    [[60,250],[150,270],[330,270],[420,250]].forEach(function(t){plan+='<circle cx="'+t[0]+'" cy="'+t[1]+'" r="18"/>'});
    plan+='<rect x="14" y="80" width="26" height="140"/></g><g font-family="DM Mono" font-size="9" fill="#2d4a6b" letter-spacing="1"><text x="196" y="44">ESCENARIO</text><text x="200" y="232">96 PLAZAS</text><text x="190" y="300">ZONA CÓCTEL</text></g><g stroke="#D93333" stroke-width="1"><line x1="4" y1="-6" x2="476" y2="-6"/></g></svg>';
    var IT=[
     ['plan',560,140,-3,'<div class="it plan sh">'+plan+'</div>',[0,-900,-20]],
     ['inv',230,110,-8,'<div class="it inv sh">'+LOGO('#fff','#fff','64px')+'</div>',[-900,-200,-30]],
     ['card',250,330,6,'<div class="it card sh">'+LOGO('#0b0b0b','#D93333','24px')+'<div><p class="k" style="color:var(--red)">Estás invitado</p><h2 style="margin-top:8px">Product<br><span>Launch 2026</span></h2></div><p class="k" style="color:var(--grey)">14 · 05 · 19:00 · Barcelona</p></div>',[-900,400,30]],
     ['badge',880,430,10,'<div class="it badge sh">'+LOGO('#0b0b0b','#D93333','20px')+'<div><p class="k" style="color:var(--grey)">Speaker</p><h3 style="margin-top:6px">Laura<br>Martínez</h3></div><p class="k" style="background:var(--red);color:#fff;border-radius:99px;padding:5px 9px;align-self:flex-start">All areas</p></div>',[900,500,40]],
     ['sw1',600,560,0,'<div class="it sw sh" style="background:#7a2a24"></div>',[300,900,0]],
     ['sw2',700,600,0,'<div class="it sw sh" style="background:#C8A266;width:90px;height:90px"></div>',[400,900,0]],
     ['chips',1100,130,4,'<div class="it chips sh"><i style="background:#D93333"></i><i style="background:#0b0b0b"></i><i style="background:#E7DCC8"></i><i style="background:#C8A266"></i></div>',[900,-300,30]],
     ['pen',520,520,-24,'<div class="it pen sh"></div>',[-200,900,-60]]];
    wrap('n1','<div class="desk" id="desk">'+IT.map(function(t){return t[4].replace('class="it','data-k="'+t[0]+'" class="it')}).join('')+'</div>'+
      '<div class="ttl side"><h1>Cada evento empieza<br><b>sobre la mesa.</b></h1><p>Idea, plano, invitación, acreditaciones y materiales: diseñamos cada pieza para que todo encaje el día del evento.</p></div>');
    var sec=document.getElementById('sc'),desk=document.getElementById('desk'),els=desk.querySelectorAll('.it');
    tick=function(){var p=prog(sec),W=desk.parentNode.clientWidth,H=desk.parentNode.clientHeight;desk.style.setProperty('--fs',Math.min(W/1260,H/820).toFixed(3));
      els.forEach(function(e,i){var t=IT[i],k=out(cl((p-.04-i*.075)/.12)),x=t[1]+t[5][0]*(1-k),y=t[2]+t[5][1]*(1-k),r=t[3]+t[5][2]*(1-k);e.style.left=0;e.style.top=0;e.style.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px) rotate('+r.toFixed(2)+'deg) scale('+(1+.06*(1-k))+')';e.style.zIndex=i})};
  }
  if(M==='2'){
    var seats=function(n){var s='';for(var i=0;i<n;i++)s+='<span class="seat" style="left:'+(i*(100/n)+1)+'%"></span>';return s};
    var lay=function(cls,bot,inner,st){return '<div class="ly '+cls+'" style="bottom:'+bot+'%;'+(st||'')+'"><div>'+inner+'</div></div>'};
    wrap('n2','<div class="book" id="book"><div class="pg r"><div class="base" id="base">'+
      lay('wall',58,'<div style="position:absolute;inset:0;background:#E9E2D5;border-radius:3px"></div><div class="scr" style="font-size:clamp(16px,2.6vw,34px)">Welcome</div>','height:70%;left:6%;right:6%')+
      lay('stg',50,'<div style="position:absolute;inset:0;background:#2a2826"></div>','height:8%;left:14%;right:14%')+
      lay('roll',40,'<div style="position:absolute;inset:0;background:var(--red);display:grid;place-items:center">'+LOGO('#fff','#fff','26px')+'</div>','height:40%;left:5%;width:12%')+
      lay('roll',40,'<div style="position:absolute;inset:0;background:var(--red);display:grid;place-items:center">'+LOGO('#fff','#fff','26px')+'</div>','height:40%;right:5%;width:12%')+
      lay('row',32,seats(14),'height:10%;left:12%;right:12%')+lay('row',20,seats(14),'height:10%;left:10%;right:10%')+lay('row',8,seats(14),'height:10%;left:8%;right:8%')+
      '</div></div><div class="pg l"><div style="position:absolute;inset:8%;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;padding:6%"><p class="k" style="color:var(--red)">Product Launch 2026</p><h2 style="font-weight:800;font-size:clamp(22px,3vw,40px);line-height:.9;letter-spacing:-.06em">De la idea<br>al <span style="color:var(--red)">evento.</span></h2><p class="k" style="color:var(--grey)">Launch Studio · Barcelona</p></div><div class="cov">'+LOGO('#fff','#fff')+'<p class="k">Every detail matters</p></div></div></div>'+
      side('Un evento que<br><b>se despliega.</b>','Damos forma a cada espacio: escenario, pantalla, mobiliario y marca, para que todo encaje y la experiencia fluya.'));
    var sec=document.getElementById('sc'),book=document.getElementById('book'),lys=book.querySelectorAll('.ly > div');
    tick=function(){var p=prog(sec),o=io(cl((p-.05)/.3));book.style.setProperty('--o',o.toFixed(3));
      lys.forEach(function(l,i){var k=io(cl((p-.32-i*.06)/.16));l.style.transform='rotateX('+(k*-82).toFixed(1)+'deg)'})};
  }
  if(M==='3'){
    wrap('n3','<p class="k tag" style="color:var(--red)">Eventos corporativos</p><div class="word" id="w">EVENTOS</div><div class="full" id="full"></div><div class="cap" id="cap"><h2>Every detail<br><span>matters.</span></h2><p>Elegancia, precisión y diseño en eventos donde cada detalle cuenta.</p></div>');
    var sec=document.getElementById('sc'),pin=document.getElementById('pin'),w=document.getElementById('w');
    tick=function(){var p=prog(sec),z=io(cl((p-.15)/.6));w.style.setProperty('--s',(1+Math.pow(z,2.4)*40).toFixed(3));w.style.setProperty('--ox','4.5%');pin.style.setProperty('--f',cl((p-.62)/.12).toFixed(3));pin.style.setProperty('--c',cl((p-.78)/.1).toFixed(3))};
  }
  if(M==='4'){
    var ROWS=[['09:30','PRESENTACION','SALA A','EN HORA',0],['11:00','KEYNOTE','AUDITORIO','EMBARQUE',1],['13:30','NETWORKING','TERRAZA','EN HORA',0],['19:00','COCTEL','JARDIN','EN HORA',0],['21:00','CENA DE GALA','SALON','ULTIMA',1]];
    var COLS=[5,12,9,8],CH=' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:·';
    var pad=function(s,n){s=s.slice(0,n);while(s.length<n)s+=' ';return s};
    var cells=[],html='<div class="board" id="bd"><div class="hd">'+LOGO('#F1EDE4','#D93333','24px')+'<p class="k">Product Launch 2026 · Agenda</p><p class="k" style="color:#ff5a50">● En directo</p></div><div class="row h">'+['HORA','EVENTO','LUGAR','ESTADO'].map(function(h,i){return '<span class="c" style="width:calc('+COLS[i]+' * (clamp(16px,2.05vw,30px) + 3px) - 3px);place-items:center start">'+h+'</span>'}).join('<span style="width:clamp(8px,1vw,14px)"></span>')+'</div>';
    ROWS.forEach(function(r,ri){html+='<div class="row">';r.slice(0,4).forEach(function(v,ci){var s=pad(v,COLS[ci]);for(var j=0;j<s.length;j++){cells.push({t:s[j],ri:ri,red:ci===3&&r[4]});html+='<span class="c" data-c="'+(cells.length-1)+'"> </span>'}if(ci<3)html+='<span style="width:clamp(8px,1vw,14px)"></span>'});html+='</div>'});
    wrap('n4',html+'</div>'+side('Cada minuto,<br><b>coordinado.</b>','Planificamos y coordinamos cada momento del evento para que todo ocurra a su hora.'));
    var sec=document.getElementById('sc'),bd=document.getElementById('bd'),els=bd.querySelectorAll('[data-c]');
    tick=function(){var p=prog(sec);bd.style.setProperty('--in',out(cl(p/.15)).toFixed(3));
      els.forEach(function(e,i){var c=cells[i],t0=.15+c.ri*.12+(i%23)*.004,k=(p-t0)/.08,ch;
        if(k>=1)ch=c.t;else if(k<=0)ch=' ';else ch=CH[(Math.floor(p*900)+i*7)%CH.length];
