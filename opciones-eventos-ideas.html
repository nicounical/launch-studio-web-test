<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eventos: otras ideas de portada — Launch Studio</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Poppins:wght@300;400;500;600;800&display=swap">
<style>
/* Cinco ideas de portada para Eventos corporativos que no se parecen a la de Stands: nada de 3D, todo con scroll.
   Cada idea es una sección fija que avanza con el scroll y retrocede si subes. */
:root{--white:#F1F0E8;--ink:#0b0b0b;--red:#D93333;--grey:#5f5d56;--line:rgba(11,11,11,.14);--pad:clamp(20px,4vw,64px);--bh:48px;--font:"Poppins",system-ui,sans-serif;--mono:"DM Mono",ui-monospace,monospace}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--white);color:var(--ink);font-family:var(--font);font-weight:300;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:100%;object-fit:cover}
.bar{position:fixed;inset:0 0 auto 0;z-index:80;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:9px var(--pad);background:rgba(11,11,11,.94);color:var(--white);font:400 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.bar b{font-weight:400;opacity:.55;margin-right:6px}
.bar a{border:1px solid rgba(241,240,232,.35);border-radius:999px;padding:5px 12px}
.bar a:hover{background:var(--red);border-color:var(--red)}
.bar a[aria-current]{background:var(--white);color:var(--ink);border-color:var(--white)}
.sc{margin-top:var(--bh)}
.pin{position:sticky;top:var(--bh);height:calc(100vh - var(--bh));overflow:hidden}
.k{font:400 11px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.crumb{position:absolute;left:var(--pad);top:clamp(20px,3vw,32px);z-index:9;font:400 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;opacity:.65}
.note{padding:40px var(--pad) 80px;max-width:860px;font-size:16px;line-height:1.7;color:var(--grey)}
.note b{color:var(--ink);font-weight:600}
.page{display:none}.page.on{display:block}

/* ── 1 · El día del evento: un reloj recorre el día y cada hora revela un momento ── */
.p1 .sc{height:700vh}
.p1 .pin{background:#F4F1EA;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
.p1 .left{position:relative;padding:clamp(70px,10vh,110px) var(--pad) var(--pad);display:flex;flex-direction:column;justify-content:space-between}
.p1 .clock{font-weight:800;font-size:clamp(90px,14vw,230px);line-height:.8;letter-spacing:-.07em;font-variant-numeric:tabular-nums}
.p1 .clock span{color:var(--red)}
.p1 .mom h2{font-weight:400;font-size:clamp(26px,2.6vw,44px);letter-spacing:-.035em;line-height:1.05;margin-top:16px}
.p1 .mom p{color:var(--grey);font-size:16px;line-height:1.6;max-width:24em;margin-top:12px}
.p1 .mom .sw{animation:sw .6s cubic-bezier(.2,.7,.2,1) both}
.p1 .day{position:relative;height:2px;background:var(--line);margin-top:30px}
.p1 .day i{position:absolute;left:0;top:0;height:100%;background:var(--red);width:calc(var(--d,0)*100%)}
.p1 .day b{position:absolute;top:12px;font:400 10px var(--mono);letter-spacing:.06em;color:var(--grey);font-weight:400;transform:translateX(-50%)}
.p1 .right{position:relative;overflow:hidden;background:#1b1a18}
.p1 .shot{position:absolute;inset:0;opacity:0;transition:opacity .9s}
.p1 .shot.on{opacity:1}
.p1 .shot img{transform:scale(1.08);transition:transform 6s linear}.p1 .shot.on img{transform:scale(1)}
.p1 .shot figcaption{position:absolute;left:24px;bottom:22px;color:#fff;font:400 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;text-shadow:0 1px 10px rgba(0,0,0,.4)}
.p1 .shot::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 60%,rgba(0,0,0,.45))}

/* ── 2 · Se encienden las luces: la foto del evento a oscuras, focos que se encienden uno a uno ── */
.p2 .sc{height:600vh}
.p2 .pin{background:#000;color:#fff}
.p2 .ph{position:absolute;inset:0}
.p2 .ph.dark img{filter:brightness(.12) saturate(.4)}
.p2 .ph.lit{-webkit-mask:var(--m);mask:var(--m)}
.p2 .ph.lit img{filter:brightness(1.05)}
.p2 .ttl{position:absolute;left:var(--pad);bottom:clamp(40px,8vh,80px);z-index:5;max-width:min(640px,80vw)}
.p2 .ttl h1{font-weight:800;font-size:clamp(40px,6vw,104px);line-height:.88;letter-spacing:-.065em}
.p2 .ttl h1 span{color:var(--red)}
.p2 .ttl p{margin-top:18px;font-size:17px;line-height:1.55;opacity:.85}
.p2 .lab{position:absolute;z-index:6;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--ink);font:400 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;transform:translate(-50%,-50%);transition:opacity .5s}
.p2 .lab i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:7px;vertical-align:1px}

/* ── 3 · La invitación: un sobre que se abre y la invitación sale con los detalles del evento ── */
.p3 .sc{height:500vh}
.p3 .pin{background:#E7E1D6;display:grid;place-items:center;perspective:1600px}
.p3 .env{position:relative;width:min(560px,82vw);aspect-ratio:1.55;transform:translateY(calc(var(--e,0)*18vh)) rotateX(calc((1 - var(--a,0))*18deg));transform-style:preserve-3d}
.p3 .back{position:absolute;inset:0;background:#C9302C;border-radius:6px;box-shadow:0 40px 80px rgba(60,30,20,.25)}
.p3 .card{position:absolute;left:5%;right:5%;top:10%;height:86%;background:#FBF8F2;border-radius:4px;padding:clamp(18px,3vw,34px);transform:translateY(calc(var(--c,0)*-78%));box-shadow:0 10px 30px rgba(0,0,0,.12);display:flex;flex-direction:column;justify-content:space-between;z-index:2}
.p3 .card .lg{height:34px;width:auto}
.p3 .card h2{font-weight:800;font-size:clamp(26px,3.6vw,48px);line-height:.92;letter-spacing:-.06em}
.p3 .card h2 span{color:var(--red)}
.p3 .card .row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;border-top:1px solid var(--line);padding-top:12px}
.p3 .card .row div{font-size:13px}.p3 .card .row b{display:block;font:400 9px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--grey);font-weight:400;margin-bottom:3px}
.p3 .front{position:absolute;inset:0;z-index:3;border-radius:6px;overflow:hidden;pointer-events:none}
.p3 .front::before{content:"";position:absolute;left:0;right:0;bottom:0;height:62%;background:#D93a36;clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%)}
.p3 .flap{position:absolute;left:0;right:0;top:0;height:58%;z-index:4;transform-origin:50% 0;transform:rotateX(calc(var(--f,0)*180deg));transform-style:preserve-3d}
.p3 .flap::before{content:"";position:absolute;inset:0;background:#B9251F;clip-path:polygon(0 0,100% 0,50% 100%);backface-visibility:hidden}
.p3 .flap::after{content:"";position:absolute;inset:0;background:#A8211C;clip-path:polygon(0 0,100% 0,50% 100%);transform:rotateX(180deg);backface-visibility:hidden}
.p3 .seal{position:absolute;left:50%;top:58%;z-index:5;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#F4EEE2;display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.2);opacity:calc(1 - var(--f,0)*2);transform:scale(calc(1 - var(--f,0)*.4))}
.p3 .seal svg{height:28px;width:auto}
.p3 .side{position:absolute;left:var(--pad);bottom:clamp(30px,6vh,60px);max-width:min(420px,80vw)}
.p3 .side h1{font-weight:300;font-size:clamp(28px,3vw,50px);letter-spacing:-.04em;line-height:1.04}
.p3 .side h1 b{font-weight:800;letter-spacing:-.06em}
.p3 .side p{margin-top:14px;color:var(--grey);font-size:16px;line-height:1.55}

/* ── 4 · Los detalles: una rejilla de primeros planos que se cierra sobre la foto del evento ── */
.p4 .sc{height:500vh}
.p4 .pin{background:#F4F1EA}
.p4 .grid{position:absolute;inset:clamp(60px,9vh,90px) var(--pad) clamp(24px,4vh,44px);display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:calc((1 - var(--z,0))*14px)}
.p4 .cell{position:relative;overflow:hidden;border-radius:calc((1 - var(--z,0))*10px);background:#ddd}
.p4 .cell .in{position:absolute;inset:0;transform:scale(calc(1 + (1 - var(--z,0))*.0));}
.p4 .cell .det{position:absolute;inset:0;transition:opacity .6s}
.p4 .cell .det img{transform:scale(1.25)}
.p4 .cell .whole{position:absolute;opacity:var(--w,0)}
.p4 .cell .t{position:absolute;left:12px;bottom:10px;color:#fff;font:400 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;text-shadow:0 1px 8px rgba(0,0,0,.5);opacity:calc(1 - var(--w,0))}
.p4 .cap{position:absolute;left:var(--pad);right:var(--pad);bottom:clamp(40px,8vh,80px);z-index:5;color:#fff;opacity:var(--w,0);display:flex;justify-content:space-between;align-items:flex-end;gap:20px;pointer-events:none}
.p4 .cap h1{font-weight:800;font-size:clamp(38px,5.6vw,96px);line-height:.88;letter-spacing:-.065em;text-shadow:0 4px 40px rgba(0,0,0,.35)}
.p4 .cap p{max-width:22em;font-size:16px;line-height:1.55}
.p4 .hd{position:absolute;left:var(--pad);top:clamp(20px,3vw,32px);right:var(--pad);display:flex;justify-content:space-between;align-items:baseline;opacity:calc(1 - var(--w,0))}
.p4 .hd h1{font-weight:300;font-size:clamp(20px,2vw,30px);letter-spacing:-.03em}.p4 .hd h1 b{font-weight:800}

/* ── 5 · Entre bastidores: la cortina se abre y del backstage se pasa al evento ── */
.p5 .sc{height:500vh}
.p5 .pin{background:#111}
.p5 .bk{position:absolute;inset:0;padding:clamp(70px,10vh,100px) var(--pad) var(--pad);color:#F1F0E8;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(30px,5vw,80px);align-items:center}
.p5 .bk h1{font-weight:800;font-size:clamp(40px,5vw,86px);line-height:.88;letter-spacing:-.065em}
.p5 .bk h1 span{color:var(--red)}
.p5 .list{list-style:none;margin:0;padding:0;border-top:1px solid rgba(241,240,232,.16)}
.p5 .list li{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid rgba(241,240,232,.16);font-size:clamp(15px,1.3vw,19px);transition:color .4s,opacity .4s;opacity:.4}
.p5 .list li .n{font:400 11px var(--mono);color:var(--red)}
.p5 .list li .ok{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(241,240,232,.35);display:grid;place-items:center;font-size:12px;transition:background .3s,border-color .3s}
.p5 .list li.on{opacity:1}.p5 .list li.done .ok{background:var(--red);border-color:var(--red)}
.p5 .list li.done span:nth-child(2){text-decoration:line-through;text-decoration-color:rgba(241,240,232,.35)}
.p5 .stage{position:absolute;inset:0;z-index:3;pointer-events:none}
.p5 .stage .ph{position:absolute;inset:0;opacity:var(--o,0)}
.p5 .cur{position:absolute;top:0;bottom:0;width:51%;background:repeating-linear-gradient(90deg,#7a1a17 0 26px,#93221e 26px 46px,#6c1613 46px 64px);box-shadow:inset 0 -60px 80px rgba(0,0,0,.35)}
.p5 .cur.l{left:0;transform:translateX(calc(var(--cu,0)*-100%)) scaleX(calc(1 - var(--cu,0)*.4));transform-origin:0 50%}
.p5 .cur.r{right:0;transform:translateX(calc(var(--cu,0)*100%)) scaleX(calc(1 - var(--cu,0)*.4));transform-origin:100% 50%}
.p5 .stage .cap{position:absolute;left:var(--pad);bottom:clamp(40px,8vh,80px);color:#fff;opacity:var(--o2,0)}
.p5 .stage .cap h2{font-weight:800;font-size:clamp(38px,5.6vw,96px);line-height:.88;letter-spacing:-.065em;text-shadow:0 4px 40px rgba(0,0,0,.4)}
.p5 .stage .cap h2 span{color:var(--red)}
.p5 .stage::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(0,0,0,.55));opacity:var(--o,0)}

@keyframes sw{from{opacity:0;transform:translateY(10px)}}
@media (max-width:820px){
  .p1 .pin{grid-template-columns:1fr;grid-template-rows:auto 1fr}.p1 .left{padding-top:60px}.p1 .clock{font-size:80px}.p1 .mom p{display:none}
  .p4 .grid{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr)}.p4 .cell:nth-child(n+7){display:none}
  .p5 .bk{grid-template-columns:1fr;align-content:center;gap:24px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav class="bar" aria-label="Ideas"><b>Eventos · otras ideas</b>
  <a href="?m=1">1 · El día del evento</a><a href="?m=2">2 · Se encienden las luces</a><a href="?m=3">3 · La invitación</a><a href="?m=4">4 · Los detalles</a><a href="?m=5">5 · Entre bastidores</a>
</nav>
<main id="app"></main>
<div class="note" id="note"></div>

<script>
(function(){
  var R='https://www.launchstudiogroup.com/',NTT=R+'25f3b694-0d3c-438c-be95-81e2b03044e5.JPG',FB='assets/img/nosotros/nosotros-gradas.jpg';
  var I={ntt:NTT,base4:R+'project-2.jpg',market:R+'project-3.JPG',amona:R+'project-1.JPG',venca:R+'5e63e182-50b9-46a9-9ef0-f818a5e932c4.JPG',gradas:'assets/img/nosotros/nosotros-gradas.jpg',ped:'assets/img/contacto/contacto-pedestal.jpg',run:'assets/img/servicios/servicio-experiencias-cursa-base4.jpg',salon:'assets/img/servicios/servicio-renders-interiorismo.jpg',ceram:'assets/img/servicios/servicio-diseno-grafico-ceramica.jpg',stand:'assets/img/servicios/stand-launch.jpg'};
  var img=function(s,fb,st){return '<img src="'+s+'" alt="" onerror="this.onerror=null;this.src=\''+(fb||FB)+'\'"'+(st?' style="'+st+'"':'')+'>'};
  var LOGO=function(f){return '<svg class="lg" viewBox="440 260 1110 1470" aria-hidden="true"><path d="M462 283H935V1467A353 353 0 0 0 1027 1703H935A473 473 0 0 1 462 1230Z" fill="'+(f||'#0b0b0b')+'"/><circle cx="1288" cy="1467" r="237" fill="#D93333"/></svg>'};
  var cl=function(x){return Math.max(0,Math.min(1,x))},ez=function(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
  var crumb='<p class="crumb">Servicios / Eventos corporativos</p>';
  var M=new URLSearchParams(location.search).get('m')||'1';
  document.querySelectorAll('.bar a').forEach(function(a){if(a.getAttribute('href')==='?m='+M)a.setAttribute('aria-current','page')});

  var NOTES={
   1:'<b>1 · El día del evento.</b> Un reloj grande recorre el día del evento mientras bajas: de las 07:00 del montaje a las 23:00 de la despedida. Cada hora cambia la foto y el texto. Habla de lo que hacéis: estar en cada momento del día.',
   2:'<b>2 · Se encienden las luces.</b> La foto de un evento vuestro aparece a oscuras y, al bajar, se encienden los focos uno a uno sobre cada zona (escenario, pantalla, invitados…) hasta que la sala queda iluminada.',
   3:'<b>3 · La invitación.</b> Un sobre rojo de Launch con el sello del logo. Al bajar se abre la solapa y sale la invitación con los datos del evento. Muy distinto, elegante y nada técnico.',
   4:'<b>4 · Los detalles.</b> Doce primeros planos (la luz, las flores, la pantalla, el mobiliario…). Al bajar la rejilla se cierra y todas las piezas forman juntas la foto completa del evento: «cada detalle cuenta».',
   5:'<b>5 · Entre bastidores.</b> Empieza en el backstage: una lista de tareas que se van tachando mientras bajas. Al terminar, se abre el telón y aparece el evento.'};
  document.getElementById('note').innerHTML=NOTES[M]+'<br><br>Las fotos son de vuestra web antigua y las nuestras; si alguna no carga, sale otra. Con fotos vuestras de un evento quedaría mucho mejor.';

  var app=document.getElementById('app'),tick=function(){};
  var prog=function(sec){var bh=document.querySelector('.bar').offsetHeight,r=sec.getBoundingClientRect(),h=r.height-(innerHeight-bh);return h>0?cl((bh-r.top)/h):0};

  if(M==='1'){
    var D=[['07:00','El montaje','Llegamos los primeros: estructura, luz y sonido.',I.ped],['10:00','Los últimos detalles','Flores, mantelería, señalética y la marca en cada rincón.',I.ceram],['12:30','La prueba','Ensayamos cada entrada, cada vídeo y cada cambio de luz.',I.salon],['18:00','Llegan los invitados','Recepción, acreditaciones y la primera impresión.',I.ntt],['19:30','El momento','El escenario se ilumina y empieza todo.',I.gradas],['21:30','La celebración','Cóctel, música y conversaciones que duran.',I.base4],['23:00','Hasta la próxima','Y cuando se va el último invitado, lo recogemos todo.',I.run]];
    app.innerHTML='<div class="page on p1"><section class="sc" id="sc"><div class="pin"><div class="left">'+crumb+'<div><p class="k" style="color:var(--red)">Un día de evento</p><div class="clock" id="clk" style="margin-top:14px">07<span>:</span>00</div><div class="mom" id="mom"></div></div><div class="day" id="day"><i></i>'+D.map(function(d,i){return '<b style="left:'+(i/(D.length-1)*100)+'%">'+d[0]+'</b>'}).join('')+'</div></div>'+
      '<div class="right">'+D.map(function(d,i){return '<figure class="shot'+(i?'':' on')+'">'+img(d[3])+'<figcaption>'+d[0]+' · '+d[1]+'</figcaption></figure>'}).join('')+'</div></div></section></div>';
    var sec=document.getElementById('sc'),clk=document.getElementById('clk'),mom=document.getElementById('mom'),day=document.getElementById('day'),shots=app.querySelectorAll('.shot'),cur=-1;
    var mins=D.map(function(d){var a=d[0].split(':');return +a[0]*60+ +a[1]});
    tick=function(){var p=prog(sec),f=p*(D.length-1),k=Math.min(D.length-1,Math.floor(f+.0001)),t=k<D.length-1?mins[k]+(mins[k+1]-mins[k])*ez(cl((f-k-.55)/.45)):mins[k];
      t=Math.round(t/5)*5;clk.innerHTML=('0'+Math.floor(t/60)).slice(-2)+'<span>:</span>'+('0'+t%60).slice(-2);day.style.setProperty('--d',p.toFixed(3));
      var kk=Math.round(f-.05);kk=Math.max(0,Math.min(D.length-1,kk));if(kk!==cur){cur=kk;shots.forEach(function(s,i){s.classList.toggle('on',i===kk)});mom.innerHTML='<div class="sw"><h2>'+D[kk][1]+'</h2><p>'+D[kk][2]+'</p></div>'}};
  }
  if(M==='2'){
    var L=[[50,30,'Pantalla'],[50,62,'Escenario'],[22,58,'Invitados'],[80,56,'Invitados'],[16,24,'Luz de ambiente'],[86,24,'Luz de ambiente'],[50,86,'Recepción']];
    app.innerHTML='<div class="page on p2"><section class="sc" id="sc"><div class="pin" id="pin">'+crumb+'<div class="ph dark">'+img(I.ntt)+'</div><div class="ph lit" id="lit">'+img(I.ntt)+'</div>'+
      L.map(function(l){return '<span class="lab" style="left:'+l[0]+'%;top:'+l[1]+'%;opacity:0"><i></i>'+l[2]+'</span>'}).join('')+
      '<div class="ttl"><h1>Que se hagan<br><span>las luces.</span></h1><p>Elegancia, precisión y diseño en eventos donde cada detalle cuenta.</p></div></div></section></div>';
    var sec=document.getElementById('sc'),lit=document.getElementById('lit'),labs=app.querySelectorAll('.lab');
    tick=function(){var p=prog(sec),m=[];L.forEach(function(l,i){var k=ez(cl((p-.05-i*.1)/.12)),r=(4+k*30*(i<2?1.2:1));if(k>0)m.push('radial-gradient(circle at '+l[0]+'% '+l[1]+'%,#000 '+(r*.45).toFixed(1)+'vmax,transparent '+r.toFixed(1)+'vmax)');labs[i].style.opacity=(k>.15&&k<1&&p<.8)?1:0});
      var all=ez(cl((p-.78)/.18));if(all>0)m.push('linear-gradient(rgba(0,0,0,'+all.toFixed(3)+'),rgba(0,0,0,'+all.toFixed(3)+'))');
      var v=m.length?m.join(','):'linear-gradient(transparent,transparent)';lit.style.setProperty('--m',v)};
  }
  if(M==='3'){
    app.innerHTML='<div class="page on p3"><section class="sc" id="sc"><div class="pin" id="pin">'+crumb+
      '<div class="env" id="env"><div class="back"></div><div class="card">'+LOGO()+'<div><p class="k" style="color:var(--red)">Estás invitado</p><h2 style="margin-top:10px">Product<br><span>Launch 2026</span></h2></div><div class="row"><div><b>Cuándo</b>14 · 05 · 19:00</div><div><b>Dónde</b>Barcelona</div><div><b>Dress code</b>Black tie</div></div></div><div class="front"></div><div class="flap"></div><div class="seal">'+LOGO('#0b0b0b').replace('class="lg"','')+'</div></div>'+
      '<div class="side" id="side"><h1>Todo empieza<br>con una <b>invitación.</b></h1><p>Diseñamos el evento entero: desde la primera carta que llega a tus invitados hasta la última luz de la noche.</p></div></div></section></div>';
    var sec=document.getElementById('sc'),env=document.getElementById('env');
    tick=function(){var p=prog(sec);env.style.setProperty('--a',ez(cl(p/.2)).toFixed(3));env.style.setProperty('--f',ez(cl((p-.18)/.22)).toFixed(3));env.style.setProperty('--c',ez(cl((p-.4)/.3)).toFixed(3));env.style.setProperty('--e',ez(cl((p-.4)/.3)).toFixed(3));env.querySelector('.flap').style.zIndex=p>.3?1:4;env.querySelector('.card').style.zIndex=p>.3?2:2};
  }
  if(M==='4'){
    var T=['La luz','La pantalla','Las flores','La mesa','La bienvenida','El escenario','Las copas','La música','La marca','El mobiliario','Los invitados','El final'];
    var SRC=[I.gradas,I.salon,I.ceram,I.ped,I.base4,I.ntt,I.market,I.amona,I.stand,I.venca,I.run,I.gradas];
    app.innerHTML='<div class="page on p4"><section class="sc" id="sc"><div class="pin" id="pin"><div class="hd"><h1>Cada <b>detalle</b> cuenta.</h1><p class="k" style="color:var(--red)">Baja para verlos juntos ↓</p></div><div class="grid" id="grid">'+
      T.map(function(t,i){var c=i%4,r=Math.floor(i/4);return '<div class="cell"><div class="det">'+img(SRC[i],FB,'object-position:'+(30+((i*37)%40))+'% '+(30+((i*53)%40))+'%')+'</div><div class="whole" style="left:'+(-c*100)+'%;top:'+(-r*100)+'%;width:400%;height:300%">'+img(I.ntt)+'</div><span class="t">'+('0'+(i+1)).slice(-2)+' · '+t+'</span></div>'}).join('')+
      '</div><div class="cap"><h1>Every detail<br>matters.</h1><p>Elegancia, precisión y diseño en eventos donde cada detalle cuenta.</p></div></div></section></div>';
    var sec=document.getElementById('sc'),pin=document.getElementById('pin'),cells=app.querySelectorAll('.cell');
    tick=function(){var p=prog(sec),w=ez(cl((p-.35)/.3)),z=ez(cl((p-.6)/.25));pin.style.setProperty('--w',w.toFixed(3));pin.style.setProperty('--z',z.toFixed(3));
      cells.forEach(function(c,i){var k=cl((p-i*.022)/.1);c.style.opacity=k.toFixed(3);c.style.transform='translateY('+((1-ez(k))*30).toFixed(1)+'px)';c.querySelector('.det').style.opacity=(1-w).toFixed(3)})};
  }
  if(M==='5'){
    var T=['Diseñar el espacio','Coordinar proveedores','Montar escenario y luz','Probar sonido y pantallas','Vestir las mesas','Ensayar cada entrada','Abrir puertas'];
    app.innerHTML='<div class="page on p5"><section class="sc" id="sc"><div class="pin" id="pin">'+crumb.replace('crumb"','crumb" style="color:#F1F0E8"')+'<div class="bk"><div><p class="k" style="color:var(--red)">Backstage</p><h1 style="margin-top:14px">Lo que no se ve<br><span>también cuenta.</span></h1></div><ul class="list" id="list">'+
      T.map(function(t,i){return '<li><span class="n">'+('0'+(i+1)).slice(-2)+'</span><span>'+t+'</span><span class="ok">✓</span></li>'}).join('')+'</ul></div>'+
      '<div class="stage" id="stg"><div class="ph">'+img(I.ntt)+'</div><div class="cur l"></div><div class="cur r"></div><div class="cap"><h2>Y se abre<br><span>el telón.</span></h2></div></div></div></section></div>';
    var sec=document.getElementById('sc'),stg=document.getElementById('stg'),li=app.querySelectorAll('#list li');
    tick=function(){var p=prog(sec),cuIn=ez(cl((p-.52)/.08)),cu=ez(cl((p-.66)/.22));
      li.forEach(function(l,i){var t=.04+i*.065;l.classList.toggle('on',p>t-.04);l.classList.toggle('done',p>t)});
      stg.style.setProperty('--cu',cu.toFixed(3));stg.querySelectorAll('.cur').forEach(function(c){c.style.opacity=cuIn.toFixed(3)});
      stg.style.setProperty('--o',cl((p-.66)/.08).toFixed(3));stg.style.setProperty('--o2',cl((p-.84)/.08).toFixed(3))};
  }
  var raf=0;addEventListener('scroll',function(){if(!raf)raf=requestAnimationFrame(function(){raf=0;tick()})},{passive:true});addEventListener('resize',tick);tick();
})();
</script>
</body>
</html>
