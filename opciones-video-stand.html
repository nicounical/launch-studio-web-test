<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portada de Stands: opciones — Launch Studio</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Poppins:wght@300;400;500;600;800&display=swap">
<style>
/* Opciones de portada para la subpágina de Stands.
   Todas parten de la misma imagen final y de versiones sacadas de ella (líneas, maqueta blanca, materiales sin luz),
   así que cada fase encaja al píxel con el resultado. */
:root{--white:#F1F0E8;--paper:#F7F6F1;--ink:#0b0b0b;--red:#D93333;--grey:#5f5d56;--line:rgba(11,11,11,.14);--font:"Poppins",system-ui,sans-serif;--mono:"DM Mono",ui-monospace,Menlo,monospace;--pad:clamp(20px,4vw,64px);--ease:cubic-bezier(.7,0,.2,1);--bh:48px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--white);color:var(--ink);font-family:var(--font);font-weight:300;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.bar{position:fixed;inset:0 0 auto 0;z-index:80;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:9px var(--pad);background:rgba(11,11,11,.94);color:var(--white);font:400 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.bar b{font-weight:400;opacity:.55;margin-right:6px}
.bar button{border:1px solid rgba(241,240,232,.35);border-radius:999px;padding:5px 12px;color:var(--white);font:inherit;letter-spacing:inherit;text-transform:inherit}
.bar button:hover{background:var(--red);border-color:var(--red)}
.bar button[aria-pressed="true"]{background:var(--white);color:var(--ink);border-color:var(--white)}
#app{padding-top:var(--bh)}
.hero{position:relative;height:calc(100vh - var(--bh));min-height:560px;overflow:hidden;background:#fff}
.stage{position:absolute;inset:0}
.stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;z-index:8;transition:color .6s}
.ttl{left:var(--pad);top:clamp(22px,3vw,36px)}
.crumb{display:flex;gap:10px;align-items:center;font:400 11px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.crumb a{opacity:.55}
.ttl h1{font-weight:800;font-size:clamp(34px,4.4vw,76px);line-height:.88;letter-spacing:-.065em;margin-top:14px}
.ttl h1 span{color:var(--red)}
.stp{right:var(--pad);top:clamp(22px,3vw,36px);width:min(340px,38vw);text-align:right}
.stp .n{font:400 11px var(--mono);letter-spacing:.08em;color:var(--red)}
.stp h3{font-weight:300;font-size:clamp(22px,2.2vw,36px);line-height:1.04;letter-spacing:-.04em;margin-top:8px}
.stp p{font-size:14px;line-height:1.55;color:var(--grey);margin-top:10px;transition:color .6s}
.stp .sw{animation:sw .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes sw{from{opacity:0;transform:translateY(12px)}}
.chips{left:var(--pad);right:var(--pad);bottom:clamp(18px,2.4vw,30px);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips button{position:relative;overflow:hidden;padding:9px 16px;border-radius:999px;background:rgba(255,255,255,.9);box-shadow:0 0 0 1px var(--line);font-weight:500;font-size:13px;backdrop-filter:blur(6px)}
.chips button i{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--red);transform-origin:0 50%;transform:scaleX(var(--p,0))}
.chips button.on{background:var(--ink);color:#fff}
.chips .pp{width:42px;height:42px;padding:0;display:grid;place-items:center;background:var(--red);color:#fff;margin-left:auto;box-shadow:none;font-size:15px}
.hero.dark .ttl,.hero.dark .stp{color:#fff}.hero.dark .stp p{color:rgba(255,255,255,.8)}
.veil{position:absolute;inset:0 0 auto 0;height:30%;z-index:7;pointer-events:none;background:linear-gradient(rgba(0,0,0,.5),transparent);opacity:var(--vo,0)}
.note{padding:28px var(--pad) 60px;max-width:900px;font-size:15px;line-height:1.7;color:var(--grey)}
.note b{color:var(--ink);font-weight:500}

/* Plano 2D (HTML para poder inclinarlo en 3D) */
.planbox{position:absolute;inset:0;perspective:1600px;perspective-origin:50% 30%;pointer-events:none;z-index:2}
.planbox svg{position:absolute;left:50%;top:54%;width:min(70vw,calc((100vh - var(--bh))*1.05));transform:translate(-50%,-50%) rotateX(var(--px,0deg)) rotateZ(var(--pz,0deg)) scale(var(--ps,1));transform-origin:50% 50%;opacity:var(--po,1);overflow:visible}
.pln .ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:calc(1 - var(--d,0))}
.pln .wl{fill:url(#hatch);stroke:var(--ink);stroke-width:2.5;stroke-dasharray:1;stroke-dashoffset:calc(1 - var(--d,0))}
.pln .dm{fill:none;stroke:var(--red);stroke-width:1.3;stroke-dasharray:1;stroke-dashoffset:calc(1 - var(--d,0))}
.pln text{font:400 12px var(--mono);letter-spacing:.08em;fill:var(--grey);opacity:var(--t,0)}
.pln .rt{fill:var(--red);font-size:14px}
.pln .big{font:300 44px var(--font);letter-spacing:-.04em;fill:var(--ink)}
.gridbg{position:absolute;inset:0;background-image:linear-gradient(rgba(11,11,11,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(11,11,11,.06) 1px,transparent 1px);background-size:44px 44px;opacity:var(--go,1);z-index:1}

/* Barrido (opción A) */
.wipe{opacity:var(--wo,0)}
.wipe line{stroke:var(--red);stroke-width:3}
.wipe rect{fill:var(--red)}
.wipe text{font:400 15px var(--mono);letter-spacing:.1em;fill:#fff}
/* etiquetas (opción B) */
.lab{opacity:0;transition:opacity .4s}
.lab rect{fill:#fff;stroke:rgba(11,11,11,.15)}
.lab text{font:600 17px var(--font);fill:var(--ink)}
.lab .s{font:400 12px var(--mono);letter-spacing:.06em;fill:var(--grey)}
.lab circle{fill:#fff;stroke:var(--red);stroke-width:3}
.lab line{stroke:var(--ink);stroke-width:1.2}

@media (max-width:820px){
  .stp{left:var(--pad);right:var(--pad);top:auto;bottom:130px;width:auto;text-align:left}.stp p{display:none}
  .chips button{font-size:0;padding:0;width:34px;height:34px;display:grid;place-items:center}.chips button span{font-size:11px}
  .chips .pp{font-size:15px;width:38px;height:38px}
  .planbox svg{width:96vw}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
