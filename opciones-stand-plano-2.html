<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stands: del plano al stand, versión 2 — Launch Studio</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Poppins:wght@300;400;500;600;800&display=swap">
<style>
/* Versión 2: stand más detallado (tarima de madera, gráficas con foto, sombras, luces, mobiliario),
   anotaciones técnicas que señalan cada pieza y fotos de cada fase. */
:root{--white:#F1F0E8;--paper:#F7F6F1;--ink:#0b0b0b;--red:#D93333;--grey:#5f5d56;--line:rgba(11,11,11,.14);--font:"Poppins",system-ui,sans-serif;--mono:"DM Mono",ui-monospace,Menlo,monospace;--pad:clamp(20px,4vw,64px);--ease:cubic-bezier(.7,0,.2,1);--bh:48px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--white);color:var(--ink);font-family:var(--font);font-weight:300;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,figure{margin:0}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:100%;object-fit:cover}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.bar{position:fixed;inset:0 0 auto 0;z-index:80;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:9px var(--pad);background:rgba(11,11,11,.94);color:var(--white);font:400 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.bar b{font-weight:400;opacity:.55;margin-right:6px}
.bar button{border:1px solid rgba(241,240,232,.35);border-radius:999px;padding:5px 12px;color:var(--white);font:inherit;letter-spacing:inherit;text-transform:inherit}
.bar button:hover{background:var(--red);border-color:var(--red)}
.bar button[aria-pressed="true"]{background:var(--white);color:var(--ink);border-color:var(--white)}
#app{padding-top:var(--bh)}
.wrap{padding-inline:var(--pad);max-width:1440px;margin-inline:auto}
.k{font:400 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.crumb{display:flex;gap:10px;align-items:center;font:400 11px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.crumb a{opacity:.55}.crumb a:hover{opacity:1;color:var(--red)}
.pin{position:sticky;top:var(--bh);height:calc(100vh - var(--bh));overflow:hidden}

/* ───────── Maqueta 3D ───────── */
.sg{position:absolute;inset:0;perspective:2600px;perspective-origin:50% 30%;overflow:hidden}
.world{position:absolute;left:var(--wx,50%);top:var(--wy,52%);width:700px;height:490px;margin:-245px 0 0 -350px;transform-style:preserve-3d;will-change:transform}
.world *{transform-style:preserve-3d}
.gridp{position:absolute;left:-910px;top:-770px;width:2520px;height:2030px;background-image:linear-gradient(rgba(11,11,11,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(11,11,11,.07) 1px,transparent 1px),linear-gradient(rgba(11,11,11,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(11,11,11,.035) 1px,transparent 1px);background-size:70px 70px,70px 70px,14px 14px,14px 14px;-webkit-mask:radial-gradient(closest-side,#000 30%,transparent);mask:radial-gradient(closest-side,#000 30%,transparent);opacity:var(--grid,1)}
.floor{position:absolute;inset:0;outline:1px solid rgb(11 11 11 / calc(var(--bd,1)*.4))}
.floor::before{content:"";position:absolute;inset:0;opacity:var(--fill,0);background:linear-gradient(115deg,rgba(255,255,255,.35),transparent 55%),repeating-linear-gradient(90deg,#e6d8c0 0 34px,#dccbae 34px 35px),#e2d3b9}
.lines .floor::before{display:none}
.sh{position:absolute;background:rgba(40,30,20,.32);filter:blur(9px);opacity:var(--fill,0);border-radius:6px}
.pool{position:absolute;width:190px;height:190px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,244,214,.95),rgba(255,236,190,.35) 55%,transparent);opacity:var(--lit,0);mix-blend-mode:screen}
.plan{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.plan .ln{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:calc(1 - var(--d,0))}
.plan .ln.th{stroke-width:2.6}
.plan .dm{fill:none;stroke:var(--red);stroke-width:1.1;stroke-dasharray:1;stroke-dashoffset:calc(1 - var(--d,0))}
.plan .hat{fill:url(#hatch);opacity:calc(var(--dd,0) * (1 - var(--rise,0)))}
.plan text{font:400 13px var(--mono);letter-spacing:.06em;fill:var(--red);opacity:var(--t,0)}
.plan .big{font:300 40px var(--font);letter-spacing:-.04em;fill:var(--ink)}
.plan .lab{font:400 10px var(--mono);fill:var(--grey);letter-spacing:.08em}
.plan .hide{opacity:calc(1 - var(--rise,0))}
.bx{position:absolute;opacity:var(--bxo,0)}
.fw{position:absolute;width:0;height:0}
.f{position:absolute;left:0;bottom:0;transform-origin:50% 100%;transform:rotateX(-90deg) scaleY(var(--g,0));border:1px solid rgb(11 11 11 / var(--bd,1));background:rgb(var(--c,255 255 255) / var(--fill,0));overflow:hidden}
.f::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.07),transparent 40%,rgba(255,255,255,.25));opacity:var(--fill,0);pointer-events:none}
.f.sd{--c:232 231 223}.f.bk{--c:220 219 210}
.tp{position:absolute;left:0;top:0;transform:translateZ(calc(var(--h)*var(--g,0)*1px));border:1px solid rgb(11 11 11 / var(--bd,1));background:rgb(var(--tc,251 250 246) / var(--fill,0))}
.dk .f{--c:44 44 44}.dk .f.sd{--c:30 30 30}.dk .tp{--tc:56 56 56}
.rd .f{--c:217 51 51}.rd .f.sd{--c:190 40 40}.rd .tp{--tc:225 70 70}
.gn .f{--c:96 128 82}.gn .f.sd{--c:76 106 64}.gn .tp{--tc:112 146 96}
.wd .tp{--tc:196 160 116}
.gx{position:absolute;inset:0;opacity:var(--gfx,0)}
.gx .red{position:absolute;background:var(--red)}
.gx .pic{position:absolute;background-size:cover;background-position:center}
.gx .scr{position:absolute;background:#141414;box-shadow:inset 0 0 0 3px #2a2a2a}
.gx .scr::after{content:"";position:absolute;inset:10%;background:linear-gradient(120deg,rgba(217,51,51,.95),rgba(217,51,51,.2) 45%,rgba(241,240,232,.25));}
.gx .logo{position:absolute;font:800 24px var(--font);letter-spacing:-.05em;line-height:.9;color:#fff;white-space:nowrap}
.gx .logo small{display:block;font:400 8px var(--mono);letter-spacing:.14em;margin-top:6px;text-transform:uppercase}
.gx .txt{position:absolute;font:300 13px var(--font);letter-spacing:.02em;color:var(--ink);white-space:nowrap}
.gx .door{position:absolute;left:18%;bottom:0;width:30%;height:84%;border:1.5px solid rgba(11,11,11,.3);background:rgba(0,0,0,.03)}
.gx .door::after{content:"";position:absolute;right:10%;top:50%;width:5px;height:5px;border-radius:50%;background:rgba(11,11,11,.5)}
.gx .shelf{position:absolute;left:0;right:0;height:3px;background:#c9b48f}
.gx .prod{position:absolute;bottom:3px;width:10px;background:var(--red);border-radius:1px}
.gx .glow{position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.0),rgba(255,255,255,.25));mix-blend-mode:screen}
.banner .f .logo{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;opacity:var(--fill,0)}
.zt{transform:translateZ(calc(var(--z)*1px))}
.banner{transform:translateZ(calc(var(--bz,600)*1px))}
.an{position:absolute;width:2px;height:2px}
/* modo líneas */
.lines .f,.lines .tp{background:transparent!important}.lines .f::after{display:none}
.lines .gx{opacity:calc(var(--gfx,0)*.9)}
.lines .gx .red,.lines .gx .scr,.lines .gx .pic{background:transparent!important;box-shadow:none;border:1px dashed var(--red)}
.lines .gx .scr::after,.lines .gx .glow{display:none}
.lines .gx .logo{color:var(--red)}
.lines .sh,.lines .pool{display:none}

/* Anotaciones técnicas */
.callouts{position:absolute;inset:0;z-index:4;pointer-events:none}
.callouts svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.callouts line{stroke:var(--ink);stroke-width:1}
.callouts circle{fill:var(--white);stroke:var(--red);stroke-width:2}
.co{position:absolute;padding:9px 12px 10px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:6px;backdrop-filter:blur(6px);white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.co b{display:block;font-weight:600;font-size:13px;letter-spacing:-.01em}
.co span{display:block;font:400 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--grey);margin-top:3px}
.co,.callouts g{transition:opacity .35s}

/* Foto real */
.res{position:absolute;inset:0;z-index:6;clip-path:circle(calc(var(--r,0)*80%) at 50% 52%);pointer-events:none}
.res img{transform:scale(calc(1.15 - var(--r,0)*.15))}
.res::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6),transparent 50%)}
.res .cap{position:absolute;left:var(--pad);bottom:clamp(100px,11vw,140px);color:#fff;z-index:2;opacity:calc((var(--r,0) - .7)*3.3)}
.res .cap .k{color:#fff;opacity:.8}
.res .cap h3{font-weight:800;font-size:clamp(36px,4.8vw,82px);line-height:.88;letter-spacing:-.065em;margin-top:10px}
.res .cap p{max-width:26em;margin-top:14px;font-size:16px;line-height:1.55;opacity:.85}

/* Tarjeta de imagen por fase */
.card{position:relative;border-radius:8px;overflow:hidden;background:#e4e3da}
.card .im{position:absolute;inset:0;opacity:0;transform:scale(1.08);transition:opacity .7s,transform 1.4s cubic-bezier(.2,.7,.2,1)}
.card .im.on{opacity:1;transform:none}
.card .lb{position:absolute;left:10px;bottom:10px;z-index:2;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.92);font:400 10px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.mood{position:absolute;inset:0;display:grid;grid-template-columns:1.2fr 1fr;grid-template-rows:1fr 1fr auto;gap:5px;padding:5px;background:var(--paper)}
.mood .a{grid-row:span 2;border-radius:5px;overflow:hidden}.mood .b,.mood .c{border-radius:5px;overflow:hidden}
.mood .sw{grid-column:span 2;display:flex;gap:5px;height:26px}.mood .sw i{flex:1;border-radius:4px}

/* ───────── 1 · Lámina de presentación ───────── */
.o1 .pin{background:var(--paper);display:grid;grid-template-columns:minmax(240px,300px) minmax(0,1fr) minmax(240px,290px);grid-template-rows:minmax(0,1fr) auto;gap:0}
.o1 .colL,.o1 .colR{position:relative;z-index:5;padding:clamp(22px,2.6vw,36px) clamp(18px,2vw,30px);display:flex;flex-direction:column;justify-content:space-between;gap:20px}
.o1 .colL{border-right:1px solid var(--line)}.o1 .colR{border-left:1px solid var(--line)}
.o1 .stagebox{position:relative;min-width:0}
.o1 h1{font-weight:800;font-size:clamp(34px,3.4vw,58px);line-height:.9;letter-spacing:-.065em;margin-top:18px}
.o1 h1 span{color:var(--red)}
.o1 .lead{font-size:14px;line-height:1.6;color:var(--grey);margin-top:16px}
.o1 .sn{font-weight:800;font-size:clamp(64px,6vw,108px);line-height:.8;letter-spacing:-.07em;color:var(--red)}
.o1 .sh3{font-weight:500;font-size:19px;letter-spacing:-.02em;margin-top:16px}
.o1 .sp{font-size:14px;line-height:1.6;color:var(--grey);margin-top:8px}
.o1 .sw2{animation:sw .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes sw{from{opacity:0;transform:translateY(12px)}}
.spec{width:100%;border-collapse:collapse;font-size:13px}
.spec td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.spec td:first-child{font:400 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--grey);padding-top:11px;width:44%}
.spec td:last-child{font-weight:500;transition:opacity .5s,color .5s}
.spec tr.off td:last-child{opacity:.18}
.o1 .card{aspect-ratio:4/3;margin-top:16px}
.o1 .tl{grid-column:1/-1;position:relative;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--paper)}
.o1 .tl div{padding:14px clamp(14px,1.6vw,24px) 16px;border-right:1px solid var(--line);font-size:13px;color:var(--grey);position:relative}
.o1 .tl div:last-child{border-right:0}
.o1 .tl div b{display:block;font:400 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.o1 .tl div i{position:absolute;left:0;top:-1px;height:2px;width:100%;background:var(--red);transform-origin:0 50%;transform:scaleX(var(--p,0))}
.o1 .tl div.on{color:var(--ink)}.o1 .tl div.on b{color:var(--red)}
.o1 .res{grid-column:1/-1;grid-row:1/-1}

/* ───────── 2 · Cinemática ───────── */
.o2 .pin{background:radial-gradient(120% 90% at 50% 40%,#fbfaf6,#ecebe3)}
.o2 .ttl{position:absolute;left:var(--pad);top:clamp(22px,3vw,36px);z-index:5}
.o2 .ttl h1{font-weight:800;font-size:clamp(34px,4vw,70px);line-height:.88;letter-spacing:-.065em;margin-top:14px}
.o2 .ttl h1 span{color:var(--red)}
.o2 .stp{position:absolute;right:var(--pad);top:clamp(22px,3vw,36px);z-index:5;width:min(340px,40vw);text-align:right}
.o2 .stp .n{font:400 11px var(--mono);letter-spacing:.08em;color:var(--red)}
.o2 .stp h3{font-weight:300;font-size:clamp(24px,2.4vw,40px);line-height:1.02;letter-spacing:-.04em;margin-top:8px}
.o2 .stp p{font-size:14px;line-height:1.55;color:var(--grey);margin-top:10px}
.o2 .strip{position:absolute;left:var(--pad);right:var(--pad);bottom:clamp(18px,2.4vw,30px);z-index:5;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.o2 .strip .fc{position:relative;height:clamp(64px,8vh,90px);border-radius:6px;overflow:hidden;opacity:.45;filter:grayscale(1);transition:opacity .5s,filter .5s,transform .5s var(--ease);background:#ddd}
.o2 .strip .fc.on{opacity:1;filter:none;transform:translateY(-6px)}
.o2 .strip .fc span{position:absolute;left:8px;bottom:6px;z-index:2;font:400 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.o2 .strip .fc::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.5),transparent 60%)}
.o2 .strip .fc i{position:absolute;left:0;top:0;height:3px;width:100%;z-index:3;background:var(--red);transform-origin:0 50%;transform:scaleX(var(--p,0))}
.o2 .strip .fc .mood{padding:3px;gap:3px}.o2 .strip .fc .mood .sw{display:none}
.o2 .res .cap{bottom:clamp(130px,15vh,170px)}

/* ───────── 3 · Editorial ───────── */
.o3 .split{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr)}
.o3 .steps{padding:0 var(--pad)}
.o3 .hd{min-height:calc(78vh - var(--bh));display:flex;flex-direction:column;justify-content:center}
.o3 .hd h1{font-weight:800;font-size:clamp(40px,4.6vw,80px);line-height:.88;letter-spacing:-.065em;margin-top:18px}
.o3 .hd h1 span{color:var(--red)}
.o3 .hd p{color:var(--grey);margin-top:20px;max-width:26em;line-height:1.65}
.o3 .hd .kpis{display:flex;gap:28px;margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
.o3 .hd .kpis b{display:block;font-weight:800;font-size:30px;letter-spacing:-.05em}
.o3 .hd .kpis span{font:400 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--grey)}
.o3 .st{min-height:96vh;display:flex;flex-direction:column;justify-content:center;opacity:.28;transition:opacity .5s}
.o3 .st.on{opacity:1}
.o3 .st .top{display:flex;align-items:baseline;gap:14px}
.o3 .st .n{font-weight:800;font-size:56px;line-height:.8;letter-spacing:-.07em;color:var(--red)}
.o3 .st h2{font-weight:400;font-size:clamp(26px,2.4vw,40px);letter-spacing:-.035em;line-height:1.05}
.o3 .st p{color:var(--grey);font-size:16px;line-height:1.65;max-width:28em;margin-top:16px}
.o3 .st .card{aspect-ratio:16/10;margin-top:22px;max-width:460px}
.o3 .st .card .im{opacity:1;transform:none}
.o3 .st ul{list-style:none;margin:18px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;max-width:460px}
.o3 .st li{font-size:13px;padding-top:8px;border-top:1px solid var(--line)}
.o3 .st li b{display:block;font:400 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--grey);font-weight:400}
.o3 .side .pin{padding:clamp(14px,1.6vw,24px)}
.o3 .frame{position:relative;height:100%;border-radius:16px;background:var(--paper);box-shadow:0 30px 70px rgba(0,0,0,.08),0 0 0 1px var(--line);overflow:hidden}
.o3 .cart{position:absolute;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:auto auto;border-top:1px solid var(--line);border-left:1px solid var(--line);background:rgba(247,246,241,.95);font:400 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;border-top-left-radius:10px;overflow:hidden}
.o3 .cart span{padding:7px 11px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.o3 .cart b{font-weight:400;color:var(--red)}
.o3 .frame .tag{position:absolute;left:18px;top:16px;z-index:5;display:flex;gap:8px;align-items:center;font:400 10px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.o3 .frame .tag i{width:8px;height:8px;border-radius:50%;background:var(--red);animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.25}}
.o3 .frame .res{border-radius:16px}

/* Después de la animación */
.more{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(30px,6vw,110px);padding-block:clamp(60px,8vw,120px);border-top:1px solid var(--line)}
.more h2{font-weight:400;font-size:clamp(28px,3vw,50px);line-height:1.06;letter-spacing:-.035em;margin-top:12px}
.body p{font-size:clamp(16px,1.3vw,18px);line-height:1.75;color:var(--grey);max-width:36em}
.body p+p{margin-top:1.1em}
.body p.goal{margin-top:1.6em;padding-left:clamp(16px,2vw,26px);border-left:3px solid var(--red);font-weight:400;font-size:clamp(19px,1.6vw,24px);line-height:1.42;letter-spacing:-.015em;color:var(--ink)}
.body p.goal b{font-weight:600;color:var(--red)}
.end{background:var(--red);color:var(--white);padding:clamp(60px,8vw,110px) 0}
.end .wrap{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:30px}
.end p{font-weight:300;font-size:clamp(28px,3.8vw,62px);line-height:1.05;letter-spacing:-.035em}
.end a{display:inline-flex;padding:14px 26px;border:1.5px solid currentColor;border-radius:999px;font-weight:500;transition:background .3s,color .3s}
.end a:hover{background:var(--white);color:var(--red)}

@media (max-width:980px){
  .o1 .pin{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto}
  .o1 .colR{display:none}.o1 .colL{border:0;padding-bottom:0;flex-direction:row;align-items:flex-start;gap:14px}
  .o1 .colL .intro .lead{display:none}.o1 .colL .intro h1{font-size:30px;margin-top:10px}
  .o1 .colL .sbox{max-width:52%}.o1 .sn{font-size:40px}.o1 .sh3{font-size:15px;margin-top:8px}.o1 .sp{display:none}
  .o1 .tl div{font-size:0;padding:10px 6px}.o1 .tl div b{font-size:9px;margin:0}
  .o2 .stp{left:var(--pad);right:var(--pad);top:auto;bottom:calc(clamp(64px,8vh,90px) + 40px);width:auto;text-align:left}.o2 .stp p{display:none}
  .o2 .strip{gap:5px}.o2 .strip .fc span{font-size:0}
  .o3 .split{grid-template-columns:1fr}.o3 .side{order:-1;position:sticky;top:var(--bh);height:52vh;z-index:3;background:var(--white)}.o3 .side .pin{height:52vh;padding:10px}
  .o3 .st{min-height:80vh}.o3 .hd{min-height:auto;padding-block:40px}
  .o3 .cart{display:none}
  .co{padding:6px 8px}.co span{display:none}.co b{font-size:11px}
  .more{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav class="bar" id="bar" aria-label="Opciones"><b>Subpágina Stands · v2</b>

      var sbox=app.querySelector('.sbox'),rows=app.querySelectorAll('.spec tr'),ims=app.querySelectorAll('.colR .card .im'),lb=app.querySelector('.colR .card .lb'),tl=app.querySelectorAll('.tl div');
      tickF=function(){var P=scrollP(sec),k=stepOf(P),r=base(P);st.set(cl(P/BUILD),null,r>.3);
        rows.forEach(function(t){t.classList.toggle('off',+t.dataset.s>k)});
        tl.forEach(function(d,j){d.classList.toggle('on',j===k);d.querySelector('i').style.setProperty('--p',j<k?1:j===k?within(P,k).toFixed(3):0)});
        if(k!==cur){cur=k;var s=STEPS[k];sbox.innerHTML='<div class="sw2"><span class="sn">'+n2(k)+'</span><h3 class="sh3">'+s.h+'</h3><p class="sp">'+s.p+'</p></div>';ims.forEach(function(m,j){m.classList.toggle('on',j===k)});lb.textContent=s.lab}};
    }
    if(o==='2'){
      var stp=app.querySelector('.stp'),fc=app.querySelectorAll('.strip .fc');
      tickF=function(){var P=scrollP(sec),k=stepOf(P),r=base(P),bp=cl(P/BUILD);
        // cámara: se acerca a la pared gráfica durante la producción y se aleja para el montaje
        var z=Math.sin(Math.PI*cl((bp-.5)/.3));st.set(bp,{s:1+.22*z,x:3*z,y:8*z,b:6*z},r>.3);
        fc.forEach(function(d,j){d.classList.toggle('on',j===k);d.querySelector('i').style.setProperty('--p',j<k?1:j===k?within(P,k).toFixed(3):0)});
        if(k!==cur){cur=k;var s=STEPS[k];stp.innerHTML='<div class="sw2" style="animation:sw .55s both"><span class="n">'+n2(k)+' / 05 · '+s.w+'</span><h3>'+s.h+'</h3><p>'+s.p+'</p></div>'}
        stp.style.opacity=r>.4?0:1};
    }
    if(o==='3'){
      var arts=app.querySelectorAll('.o3 .st'),ph=app.querySelector('.frame .tag .ph');
      tickF=function(){var P=scrollP(sec),k=stepOf(P),r=base(P);st.set(cl(P/BUILD),null,r>.3);arts.forEach(function(a,j){a.classList.toggle('on',j===k)});ph.textContent='Fase '+n2(k)+' · '+STEPS[k].t};
    }
    tickF();
  }
  var rq=0;addEventListener('scroll',function(){if(tickF&&!rq)rq=requestAnimationFrame(function(){rq=0;tickF()})},{passive:true});
  addEventListener('resize',function(){setBh();tickF&&tickF()});
  function setBh(){document.documentElement.style.setProperty('--bh',document.getElementById('bar').offsetHeight+'px')}setBh();
  document.querySelectorAll('#bar [data-o]').forEach(function(b){b.addEventListener('click',function(){render(b.dataset.o)})});
  render('1');
})();
</script>
</body>
