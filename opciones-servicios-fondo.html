<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Servicios a pantalla completa: opciones — Launch Studio</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Poppins:wght@300;400;500;600;800&display=swap">
<style>
/* Página de Servicios en una sola pantalla: los cinco servicios a la vista y la foto de fondo cambia con el que señalas.
   Sin ratón (móvil) los servicios van pasando solos; tocar uno abre su página. */
:root{--white:#F1F0E8;--ink:#0b0b0b;--red:#D93333;--grey:#5f5d56;--font:"Poppins",system-ui,sans-serif;--mono:"DM Mono",ui-monospace,Menlo,monospace;--pad:clamp(20px,4vw,64px);--ease:cubic-bezier(.7,0,.2,1);--bh:44px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ink);color:#fff;font-family:var(--font);font-weight:300;-webkit-font-smoothing:antialiased}
h1,h2,p{margin:0}a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:100%;object-fit:cover}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.bar{position:fixed;inset:0 0 auto 0;z-index:80;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:9px var(--pad);background:#000;color:var(--white);font:400 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.bar b{font-weight:400;opacity:.55;margin-right:6px}
.bar button{border:1px solid rgba(241,240,232,.35);border-radius:999px;padding:5px 12px;font:inherit;letter-spacing:inherit;text-transform:inherit}
.bar button:hover{background:var(--red);border-color:var(--red)}
.bar button[aria-pressed="true"]{background:var(--white);color:var(--ink);border-color:var(--white)}
.scr{position:relative;margin-top:var(--bh);height:calc(100vh - var(--bh));min-height:580px;overflow:hidden;background:var(--ink)}
/* cabecera de la web, sobre la foto */
.nav{position:absolute;inset:0 0 auto 0;z-index:9;display:flex;justify-content:space-between;align-items:center;padding:18px var(--pad)}
.nav .lg{display:flex;align-items:center;gap:10px;font-weight:500;font-size:13px;letter-spacing:.2em}
.nav .lg svg{height:22px;width:auto}
.nav nav{display:flex;gap:28px;font-size:15px}.nav nav a{padding-bottom:4px;border-bottom:2px solid transparent}.nav nav a.on{border-color:currentColor}
.k{font:400 11px var(--mono);letter-spacing:.08em;text-transform:uppercase}
/* fondos */
.bg{position:absolute;inset:0;opacity:0;transform:scale(1.08);transition:opacity 1s,transform 2.4s cubic-bezier(.2,.7,.2,1)}
.bg.on{opacity:1;transform:none}
.bg img{filter:brightness(.45)}
.pill{display:inline-flex;align-items:center;gap:10px;padding:13px 24px;border-radius:999px;background:var(--white);color:var(--ink);font-weight:500;font-size:15px;transition:background .3s,color .3s;white-space:nowrap}
.pill:hover{background:var(--red);color:#fff}
.sw{animation:sw .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes sw{from{opacity:0;transform:translateY(12px)}}
.in{position:absolute;inset:0;z-index:5;padding:clamp(80px,10vh,110px) var(--pad) clamp(24px,4vh,44px)}

/* A · Centrado */
.A .in{display:grid;grid-template-rows:auto 1fr auto}
.A .lst{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.A .lst a{position:relative;font-weight:800;font-size:clamp(34px,min(6.4vw,9.4vh),112px);line-height:1.04;letter-spacing:-.06em;color:rgba(241,240,232,.28);transition:color .4s,transform .6s var(--ease)}
.A .lst a sup{position:absolute;left:100%;top:.55em;margin-left:12px;font:400 12px var(--mono);letter-spacing:.06em;color:var(--red);opacity:0;transition:opacity .4s}
.A .lst a.on{color:#fff;transform:scale(1.03)}.A .lst a.on sup{opacity:1}
.A .ft{display:flex;justify-content:space-between;align-items:flex-end;gap:30px}
.A .ft p{max-width:28em;font-size:17px;line-height:1.55;opacity:.88}
.A .ft .tg{display:block;color:var(--red);margin-bottom:8px}

/* B · Lista a la izquierda */
.B .in{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:clamp(30px,5vw,90px);align-items:end}
.B .lst{display:flex;flex-direction:column}
.B .lst a{display:grid;grid-template-columns:3em minmax(0,1fr);align-items:baseline;padding:clamp(6px,1.2vh,14px) 0;border-bottom:1px solid rgba(241,240,232,.18);color:rgba(241,240,232,.45);transition:color .4s}
.B .lst a:first-child{border-top:1px solid rgba(241,240,232,.18)}
.B .lst a .k{color:inherit}
.B .lst a .nm{font-weight:300;font-size:clamp(26px,min(3.8vw,6.2vh),64px);line-height:1.08;letter-spacing:-.045em;transition:transform .5s var(--ease)}
.B .lst a.on{color:#fff}.B .lst a.on .k{color:var(--red)}.B .lst a.on .nm{transform:translateX(14px)}
.B .side .big{font-weight:800;font-size:clamp(80px,12vw,200px);line-height:.8;letter-spacing:-.07em;color:var(--red)}
.B .side .tg{display:block;margin:18px 0 10px;opacity:.75}
.B .side p{font-size:17px;line-height:1.55;opacity:.88;margin-bottom:26px;max-width:24em}

/* C · Columnas */
.C .cols{position:absolute;inset:0;z-index:5;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.C .cols a{position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:0 clamp(14px,1.6vw,26px) clamp(28px,5vh,50px);border-left:1px solid rgba(241,240,232,.16);transition:background .5s}
.C .cols a:first-child{border-left:0}
.C .cols a::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--red);transform:scaleX(0);transform-origin:0 50%;transition:transform .6s var(--ease)}
.C .cols a.on::before{transform:scaleX(1)}
.C .cols a:not(.on){background:rgba(11,11,11,.32)}
.C .cols .n{font-weight:800;font-size:clamp(40px,4.6vw,80px);line-height:.8;letter-spacing:-.07em;color:transparent;-webkit-text-stroke:1.4px rgba(241,240,232,.6);transition:color .4s,-webkit-text-stroke-color .4s}
.C .cols a.on .n{color:var(--red);-webkit-text-stroke-color:var(--red)}
.C .cols .nm{font-weight:500;font-size:clamp(17px,1.6vw,26px);line-height:1.1;letter-spacing:-.03em;margin-top:18px}
.C .cols .tg{margin-top:8px;opacity:.6}
.C .cols .d{max-height:0;overflow:hidden;opacity:0;font-size:14px;line-height:1.5;transition:max-height .6s var(--ease),opacity .4s,margin .5s}
.C .cols a.on .d{max-height:120px;opacity:.85;margin-top:14px}
.C .cols .go{display:inline-flex;margin-top:16px;width:40px;aspect-ratio:1;border-radius:50%;background:var(--white);color:var(--ink);align-items:center;justify-content:center;opacity:0;transform:translateY(10px);transition:opacity .4s,transform .5s var(--ease),background .3s}
.C .cols a.on .go{opacity:1;transform:none}.C .cols a:hover .go{background:var(--red);color:#fff}
.C .hd{position:absolute;left:var(--pad);top:clamp(80px,10vh,110px);z-index:6;pointer-events:none}
.C .hd h1{font-weight:800;font-size:clamp(36px,4.4vw,74px);line-height:.9;letter-spacing:-.065em}
.C .hd h1 span{color:var(--red)}

/* D · Lente */
.D .bg img{filter:brightness(.55) blur(14px);transform:scale(1.06)}
.D .lens{position:absolute;inset:0;z-index:2;clip-path:circle(min(26vw,34vh) at var(--lx,50%) var(--ly,50%));transition:clip-path .15s linear}
.D .lens .bg img{filter:brightness(.8);transform:none}
.D .in{display:grid;grid-template-rows:1fr auto}
.D .lst{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:clamp(0px,.6vh,8px)}
.D .lst a{font-weight:300;font-size:clamp(30px,min(5.4vw,8vh),96px);line-height:1.05;letter-spacing:-.05em;color:rgba(241,240,232,.5);transition:color .4s,font-weight .1s}
.D .lst a.on{color:#fff;font-weight:600}
.D .lst a i{font-style:normal;font:400 12px var(--mono);vertical-align:super;margin-right:10px;color:var(--red)}
.D .ft{display:flex;justify-content:space-between;align-items:flex-end;gap:30px}
.D .ft p{max-width:30em;font-size:16px;line-height:1.55;opacity:.9}

/* E · Pestañas abajo */
.E .in{display:grid;grid-template-rows:1fr auto;gap:clamp(20px,4vh,40px)}
.E .hero{align-self:center;max-width:min(760px,70vw)}
.E .hero .tg{color:var(--red)}
.E .hero h2{font-weight:800;font-size:clamp(46px,min(7.4vw,11vh),132px);line-height:.88;letter-spacing:-.065em;margin:16px 0 22px}
.E .hero p{font-size:clamp(16px,1.3vw,19px);line-height:1.55;opacity:.88;max-width:28em;margin-bottom:28px}
.E .tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(8px,1.4vw,20px)}
.E .tabs a{position:relative;padding-top:16px;color:rgba(241,240,232,.5);transition:color .4s}
.E .tabs a::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:rgba(241,240,232,.22)}
.E .tabs a i{position:absolute;left:0;top:0;height:2px;width:100%;background:var(--red);transform-origin:0 50%;transform:scaleX(var(--p,0))}
.E .tabs a b{display:block;font:400 11px var(--mono);letter-spacing:.08em}
.E .tabs a span{display:block;font-weight:500;font-size:clamp(14px,1.3vw,20px);letter-spacing:-.02em;margin-top:6px;line-height:1.15}
.E .tabs a.on{color:#fff}.E .tabs a.on b{color:var(--red)}

@media (max-width:820px){
  .nav nav{display:none}
  .A .lst a{font-size:clamp(24px,7.4vw,40px)}.D .lst a{font-size:clamp(22px,6.8vw,36px)}
  .A .lst a sup{display:none}.A .ft{flex-direction:column;align-items:flex-start;gap:16px}.A .ft p{font-size:15px}
  .B .in{grid-template-columns:1fr;align-content:end;gap:22px}.B .side{order:-1}.B .side .big{font-size:64px}.B .side p{font-size:15px;margin-bottom:14px}
  .C .cols{grid-template-columns:1fr;grid-template-rows:repeat(5,1fr);top:clamp(150px,22vh,190px)}
  .C .cols a{border-left:0;border-top:1px solid rgba(241,240,232,.16);padding:10px var(--pad);flex-direction:row;align-items:center;gap:14px;justify-content:flex-start}
  .C .cols .n{font-size:30px}.C .cols .nm{margin:0;font-size:17px}.C .cols .tg,.C .cols .d{display:none}.C .cols .go{margin:0 0 0 auto}
  .D .ft{flex-direction:column;align-items:flex-start;gap:14px}.D .ft p{font-size:15px}
  .E .hero{max-width:none}.E .hero p{font-size:15px}.E .tabs{gap:6px}.E .tabs a span{font-size:11px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav class="bar" id="bar" aria-label="Opciones"><b>Servicios · fondo</b>
  <button data-o="A">A · Centrado</button><button data-o="B">B · Lista</button><button data-o="C">C · Columnas</button><button data-o="D">D · Lente</button><button data-o="E">E · Pestañas</button>
</nav>
<section class="scr" id="scr"></section>

<script>
(function(){
  var R='https://www.launchstudiogroup.com/',I='assets/img/servicios/';
  var S=[
   {n:'Stands',tag:'Build to stand out',d:'Diseñamos espacios que captan miradas y hacen que las marcas destaquen.',i:I+'stand-launch.jpg',href:'servicios/stands.html'},
   {n:'Eventos corporativos',tag:'Every detail matters',d:'Elegancia, precisión y diseño en eventos donde cada detalle cuenta.',i:R+'25f3b694-0d3c-438c-be95-81e2b03044e5.JPG',fb:'assets/img/nosotros/nosotros-gradas.jpg',href:'opciones-subpaginas.html#eventos'},
   {n:'Experiencias de marca',tag:'Make it a feeling',d:'Experiencias que conectan con las personas y convierten las marcas en emociones.',i:I+'servicio-experiencias-cursa-base4.jpg',href:'opciones-subpaginas.html#experiencias'},
   {n:'Renders, interiorismo y planimetría',sn:'Renders e interiorismo',tag:'Vision into form',d:'De la idea al espacio. Precisión técnica y visión estética.',i:I+'render-casa.jpg',href:'opciones-subpaginas.html#renders'},
   {n:'Diseño gráfico',tag:'Identity in every detail',d:'Identidades visuales que transmiten personalidad, coherencia y carácter.',i:I+'servicio-diseno-grafico-ceramica.jpg',href:'opciones-subpaginas.html#grafico'}];
  var N=S.length,n2=function(i){return '0'+(i+1)},sn=function(s){return s.sn||s.n};
  var calm=matchMedia('(prefers-reduced-motion: reduce)').matches,hover=matchMedia('(hover:hover)').matches;
  var img=function(s){return '<img src="'+s.i+'" alt=""'+(s.fb?' onerror="this.onerror=null;this.src=\''+s.fb+'\'"':'')+'>'};
  var bgs=function(){return S.map(function(s,i){return '<div class="bg'+(i?'':' on')+'">'+img(s)+'</div>'}).join('')};
  var LOGO='<svg viewBox="440 260 1110 1470" aria-hidden="true"><path d="M462 283H935V1467A353 353 0 0 0 1027 1703H935A473 473 0 0 1 462 1230Z" fill="#fff"/><circle cx="1288" cy="1467" r="237" fill="#D93333"/></svg>';
  var nav='<header class="nav"><a class="lg" href="index.html">'+LOGO+'LAUNCH STUDIO</a><nav><a href="index.html">Inicio</a><a href="proyectos.html">Proyectos</a><a class="on" href="#">Servicios</a><a href="nosotros.html">Nosotros</a><a href="contacto.html">Contacto</a></nav></header>';
  var info=function(s){return '<div class="sw"><span class="k tg">'+s.tag+'</span><p>'+s.d+'</p></div>'};
  var go=function(s){return '<a class="pill" href="'+s.href+'">Ver '+s.n.toLowerCase()+' →</a>'};

  var O={
   A:{html:function(){return bgs()+'<div class="in"><span class="k" style="opacity:.7">Servicios · Lo que hacemos</span><nav class="lst">'+S.map(function(s,i){return '<a href="'+s.href+'" data-i="'+i+'">'+sn(s)+'<sup>'+n2(i)+'</sup></a>'}).join('')+'</nav><div class="ft"><div class="info"></div><span class="cta"></span></div></div>'},
      set:function(r,k){r.querySelector('.info').innerHTML=info(S[k]);r.querySelector('.cta').innerHTML=go(S[k])}},
   B:{html:function(){return bgs()+'<div class="in"><nav class="lst">'+S.map(function(s,i){return '<a href="'+s.href+'" data-i="'+i+'"><span class="k">'+n2(i)+'</span><span class="nm">'+sn(s)+'</span></a>'}).join('')+'</nav><div class="side"></div></div>'},
      set:function(r,k){var s=S[k];r.querySelector('.side').innerHTML='<div class="sw"><span class="big">'+n2(k)+'</span><span class="k tg">'+s.tag+'</span><p>'+s.d+'</p>'+go(s)+'</div>'}},
   C:{html:function(){return bgs()+'<div class="hd"><span class="k" style="opacity:.7">Servicios</span><h1 style="margin-top:12px">Lo que<br><span>hacemos.</span></h1></div><nav class="cols">'+S.map(function(s,i){return '<a href="'+s.href+'" data-i="'+i+'"><span class="n">'+n2(i)+'</span><span class="nm">'+s.n+'</span><span class="k tg">'+s.tag+'</span><span class="d">'+s.d+'</span><span class="go">→</span></a>'}).join('')+'</nav>'},set:function(){}},
   D:{html:function(){return bgs()+'<div class="lens">'+bgs()+'</div><div class="in"><nav class="lst">'+S.map(function(s,i){return '<a href="'+s.href+'" data-i="'+i+'"><i>'+n2(i)+'</i>'+sn(s)+'</a>'}).join('')+'</nav><div class="ft"><div class="info"></div><span class="cta"></span></div></div>'},
      set:function(r,k){r.querySelector('.info').innerHTML=info(S[k]);r.querySelector('.cta').innerHTML=go(S[k])}},
   E:{html:function(){return bgs()+'<div class="in"><div class="hero"></div><nav class="tabs">'+S.map(function(s,i){return '<a href="'+s.href+'" data-i="'+i+'"><i></i><b>'+n2(i)+'</b><span>'+sn(s)+'</span></a>'}).join('')+'</nav></div>'},
      set:function(r,k){var s=S[k];r.querySelector('.hero').innerHTML='<div class="sw"><span class="k tg">'+n2(k)+' · '+s.tag+'</span><h2>'+s.n+'</h2><p>'+s.d+'</p>'+go(s)+'</div>'}}
  };

  var scr=document.getElementById('scr'),timer=0,raf=0,cur=-1,t0=0,held=false,DUR=4200;
  function open(o){
    cancelAnimationFrame(raf);cur=-1;var d=O[o];scr.className='scr '+o;scr.innerHTML=nav+d.html();
    document.querySelectorAll('#bar [data-o]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.o===o)});
    var links=scr.querySelectorAll('[data-i]'),layers=[].slice.call(scr.querySelectorAll('.bg'));
    function act(k){if(k===cur)return;cur=k;t0=performance.now();
      layers.forEach(function(b,j){b.classList.toggle('on',j%N===k)});
      links.forEach(function(a){a.classList.toggle('on',+a.dataset.i===k)});d.set(scr,k)}
    links.forEach(function(a){var k=+a.dataset.i;
      a.addEventListener('mouseenter',function(){held=true;act(k)});a.addEventListener('focus',function(){held=true;act(k)});
      a.addEventListener('mouseleave',function(){held=false;t0=performance.now()})});
    // lente que sigue al cursor (opción D)
    var lens=scr.querySelector('.lens');
    if(lens){if(hover)scr.addEventListener('mousemove',function(e){var b=scr.getBoundingClientRect();lens.style.setProperty('--lx',(e.clientX-b.left)+'px');lens.style.setProperty('--ly',(e.clientY-b.top)+'px')})}
    act(0);
    // si nadie señala nada, los servicios pasan solos
    function loop(now){var p=Math.min(1,(now-t0)/DUR);
      if(o==='E')links.forEach(function(a){var j=+a.dataset.i;a.querySelector('i').style.setProperty('--p',j<cur?1:j===cur?(held?1:p).toFixed(3):0)});
      if(!held&&!calm&&p>=1)act((cur+1)%N);
      raf=requestAnimationFrame(loop)}
    raf=requestAnimationFrame(loop)}
  function setBh(){document.documentElement.style.setProperty('--bh',document.getElementById('bar').offsetHeight+'px')}addEventListener('resize',setBh);setBh();
  document.querySelectorAll('#bar [data-o]').forEach(function(b){b.addEventListener('click',function(){open(b.dataset.o)})});
  var h=location.hash.slice(1).toUpperCase();open(O[h]?h:'A');
})();
</script>
</body>
</html>
