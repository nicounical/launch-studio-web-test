<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Servicios con subpáginas — Launch Studio</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Poppins:wght@300;400;500;600;800&display=swap">
<style>
/* Página de Servicios con una subpágina por servicio.
   Barra superior: «Página» cambia el diseño del listado; «Subpágina» cambia el diseño de la página de cada servicio.
   Al pulsar un servicio se abre su subpágina (aquí simulada con #enlace; en la web real serán servicios/stands.html, etc.). */
:root{--white:#F1F0E8;--ink:#0b0b0b;--red:#D93333;--grey:#5f5d56;--line:rgba(11,11,11,.16);--font:"Poppins",system-ui,sans-serif;--mono:"DM Mono",ui-monospace,Menlo,monospace;--pad:clamp(20px,5vw,80px);--ease:cubic-bezier(.7,0,.2,1);--bh:48px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--white);color:var(--ink);font-family:var(--font);font-weight:300;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,figure{margin:0}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:100%;object-fit:cover}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.bar{position:fixed;inset:0 0 auto 0;z-index:80;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:9px var(--pad);background:rgba(11,11,11,.94);color:var(--white);font:400 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.bar b{font-weight:400;opacity:.55;margin:0 4px 0 10px}.bar b:first-child{margin-left:0}
.bar button{border:1px solid rgba(241,240,232,.35);border-radius:999px;padding:5px 12px;color:var(--white);font:inherit;letter-spacing:inherit;text-transform:inherit}
.bar button:hover{background:var(--red);border-color:var(--red)}
.bar button[aria-pressed="true"]{background:var(--white);color:var(--ink);border-color:var(--white)}
#app{padding-top:var(--bh)}
.wrap{padding-inline:var(--pad);max-width:1440px;margin-inline:auto}
.eyebrow{font-weight:600;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--red)}
.k{font:400 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
.top{padding-block:clamp(60px,8vw,110px) clamp(30px,4vw,56px);display:flex;justify-content:space-between;align-items:flex-end;gap:30px;flex-wrap:wrap}
.top h1{font-weight:300;font-size:clamp(44px,7vw,120px);line-height:.98;letter-spacing:-.045em;margin-top:14px}
.top h1 em{font-style:normal;font-weight:600}
.top p{max-width:26em;color:var(--grey);font-size:16px;line-height:1.6}
.ph{position:relative;overflow:hidden;background:#dddbd0}
.ph.empty{background:repeating-linear-gradient(135deg,#e7e6dc 0 14px,#e1e0d5 14px 28px);outline:1.5px dashed rgba(11,11,11,.25);outline-offset:-1.5px}
.ph.empty::after{content:"+ Espacio para imagen";position:absolute;inset:0;display:grid;place-items:center;font:400 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--grey)}
.go{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:14px}
.go i{width:38px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--red);color:var(--white);font-style:normal;transition:transform .4s var(--ease)}
a:hover .go i{transform:rotate(-45deg)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border:1.5px solid currentColor;border-radius:999px;font-weight:500;font-size:15px;transition:background .3s,color .3s,border-color .3s}
.end{background:var(--red);color:var(--white);padding:clamp(60px,8vw,110px) 0}
.end .wrap{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:30px}
.end p{font-weight:300;font-size:clamp(28px,3.8vw,62px);line-height:1.05;letter-spacing:-.035em}
.end .btn:hover{background:var(--white);color:var(--red);border-color:var(--white)}
.body p{font-size:clamp(16px,1.3vw,18px);line-height:1.75;color:var(--grey);max-width:36em}
.body p+p{margin-top:1.1em}
.body p.goal{margin-top:1.6em;padding-left:clamp(16px,2vw,26px);border-left:3px solid var(--red);font-weight:400;font-size:clamp(19px,1.6vw,24px);line-height:1.42;letter-spacing:-.015em;color:var(--ink)}
.body p.goal b{font-weight:600;color:var(--red)}
.fade{animation:fade .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes fade{from{opacity:0;transform:translateY(16px)}}

/* ───────── LISTADO ───────── */
/* 1 · Lista grande con foto que sigue al cursor */
.o1 .list{border-top:1px solid var(--line);margin-bottom:clamp(60px,8vw,110px)}
.o1 .list a{display:grid;grid-template-columns:3.4em minmax(0,1fr) auto auto;align-items:center;gap:clamp(12px,2vw,30px);padding:clamp(22px,2.6vw,36px) 0;border-bottom:1px solid var(--line)}
.o1 .list .nm{font-weight:300;font-size:clamp(30px,5vw,84px);line-height:1;letter-spacing:-.045em;transition:transform .5s var(--ease),color .3s}
.o1 .list .tg{font:400 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--grey)}
.o1 .list a:hover .nm{transform:translateX(16px);color:var(--red)}
.o1 .float{position:fixed;left:0;top:0;width:280px;aspect-ratio:4/5;z-index:30;pointer-events:none;border-radius:4px;overflow:hidden;opacity:0;transform:translate(-50%,-50%) scale(.6);transition:opacity .3s,transform .4s var(--ease)}
.o1 .float.on{opacity:1}

/* 2 · Rejilla de tarjetas */
.o2 .grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(10px,1.4vw,20px);margin-bottom:clamp(60px,8vw,110px)}
.o2 .card{grid-column:span 2;position:relative;aspect-ratio:3/4;border-radius:6px;overflow:hidden;color:var(--white);display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(18px,2vw,28px)}
.o2 .card:nth-child(-n+2){grid-column:span 3;aspect-ratio:4/3}
.o2 .card .ph{position:absolute;inset:0}
.o2 .card .ph img{transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.o2 .card:hover .ph img{transform:scale(1.07)}
.o2 .card::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(to top,rgba(11,11,11,.8),rgba(11,11,11,0) 60%)}
.o2 .card>*:not(.ph){position:relative;z-index:2}
.o2 .card .k{color:var(--white);opacity:.8}
.o2 .card h2{font-weight:400;font-size:clamp(22px,2.3vw,36px);line-height:1.05;letter-spacing:-.03em;margin:8px 0 14px}
.o2 .card .go{color:var(--white)}

/* 3 · Paneles que se abren */
.o3 .pans{display:flex;gap:8px;height:min(78vh,720px);padding-inline:var(--pad);margin-bottom:clamp(60px,8vw,110px)}
.o3 .pn{position:relative;flex:1;min-width:0;border-radius:6px;overflow:hidden;color:var(--white);transition:flex 1s var(--ease)}
.o3 .pn.on{flex:5}
.o3 .pn .ph{position:absolute;inset:0}
.o3 .pn .ph img{filter:brightness(.55)}
.o3 .pn .v{position:absolute;left:50%;bottom:24px;transform:translateX(-50%) rotate(180deg);writing-mode:vertical-rl;white-space:nowrap;font-weight:400;font-size:clamp(18px,1.6vw,24px);letter-spacing:-.02em;transition:opacity .4s}
.o3 .pn .num{position:absolute;top:20px;left:50%;transform:translateX(-50%);font:400 12px var(--mono);transition:opacity .4s}
.o3 .pn .info{position:absolute;left:0;right:0;bottom:0;padding:clamp(22px,3vw,44px);opacity:0;transform:translateY(20px);transition:opacity .5s,transform .6s var(--ease)}
.o3 .pn.on .v,.o3 .pn.on .num{opacity:0}
.o3 .pn.on .info{opacity:1;transform:none;transition-delay:.35s}
.o3 .pn .info .k{color:var(--white);opacity:.8}
.o3 .pn .info h2{font-weight:400;font-size:clamp(30px,3.6vw,58px);line-height:1;letter-spacing:-.04em;margin:10px 0 12px}
.o3 .pn .info p{max-width:28em;font-size:16px;line-height:1.55;opacity:.85;margin-bottom:20px}

/* 4 · Pantalla dividida */
.o4 .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(30px,5vw,90px);align-items:center;padding-bottom:clamp(60px,8vw,110px)}
.o4 .names a{display:block;padding:18px 0;border-bottom:1px solid var(--line);color:rgba(11,11,11,.3);transition:color .3s}
.o4 .names a:first-child{border-top:1px solid var(--line)}
.o4 .names a .nm{display:block;font-weight:300;font-size:clamp(26px,3.2vw,52px);line-height:1.05;letter-spacing:-.04em}
.o4 .names a .tg{display:block;max-height:0;overflow:hidden;font:400 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--red);transition:max-height .5s var(--ease),margin .5s}
.o4 .names a.on{color:var(--ink)}
.o4 .names a.on .tg{max-height:40px;margin-top:8px}
.o4 .stage{position:relative;aspect-ratio:4/5;border-radius:6px;overflow:hidden;background:#dddbd0}
.o4 .stage .ph{position:absolute;inset:0;clip-path:circle(0% at 50% 50%);transition:clip-path 1s var(--ease)}
.o4 .stage .ph.on{clip-path:circle(75% at 50% 50%);z-index:2}
.o4 .stage .ph.was{clip-path:circle(75% at 50% 50%);z-index:1}
.o4 .stage .lab{position:absolute;z-index:3;left:20px;bottom:20px;right:20px;color:var(--white);font-weight:400;font-size:clamp(16px,1.3vw,19px);line-height:1.45;text-shadow:0 1px 14px rgba(0,0,0,.4)}

/* 5 · Círculos */
.o5 .circs{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(24px,4vw,64px) clamp(20px,3vw,50px);padding-bottom:clamp(70px,9vw,130px)}
.o5 .ci{width:clamp(150px,22vw,300px);text-align:center}
.o5 .ci .ph{aspect-ratio:1;border-radius:50%;transition:transform .6s var(--ease),box-shadow .4s}
.o5 .ci .ph img{transition:transform 1s var(--ease)}
.o5 .ci:hover .ph{transform:scale(1.05);box-shadow:0 0 0 6px var(--white),0 0 0 8px var(--red)}
.o5 .ci:hover .ph img{transform:scale(1.12)}
.o5 .ci .k{display:block;margin-top:20px}
.o5 .ci h2{font-weight:400;font-size:clamp(19px,1.7vw,26px);line-height:1.15;letter-spacing:-.025em;margin-top:6px}
.o5 .ci p{font-size:14px;color:var(--grey);margin-top:6px}

/* 6 · Carrusel horizontal */
.o6 .ctl{display:flex;gap:10px}
.o6 .ctl button{width:54px;aspect-ratio:1;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:20px;transition:background .3s,color .3s}
.o6 .ctl button:hover{background:var(--ink);color:var(--white)}
.o6 .track{display:flex;gap:clamp(14px,2vw,28px);overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 var(--pad) clamp(60px,8vw,110px);scroll-padding-inline:var(--pad)}
.o6 .track::-webkit-scrollbar{display:none}
.o6 .sl{flex:none;width:min(72vw,880px);scroll-snap-align:start}
.o6 .sl .ph{aspect-ratio:16/10;border-radius:6px}
.o6 .sl .ph img{transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.o6 .sl:hover .ph img{transform:scale(1.05)}
.o6 .sl .meta{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:start;padding-top:18px}
.o6 .sl .n{font-weight:800;font-size:clamp(36px,4vw,60px);line-height:.8;letter-spacing:-.05em;color:var(--red)}
.o6 .sl h2{font-weight:400;font-size:clamp(22px,2.2vw,34px);line-height:1.05;letter-spacing:-.03em}
.o6 .sl p{color:var(--grey);font-size:15px;margin-top:6px}

/* ───────── SUBPÁGINA ───────── */
.crumb{display:flex;gap:10px;align-items:center;font:400 12px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.crumb a{opacity:.7}.crumb a:hover{opacity:1;color:var(--red)}
.next{display:block;border-top:1px solid var(--line);padding-block:clamp(40px,6vw,80px)}
.next .k{color:var(--grey)}
.next .nm{display:flex;justify-content:space-between;align-items:center;gap:20px;font-weight:300;font-size:clamp(34px,5.4vw,92px);line-height:1;letter-spacing:-.045em;margin-top:10px;transition:color .3s}
.next:hover .nm{color:var(--red)}
.next .nm i{flex:none;width:clamp(54px,6vw,90px);aspect-ratio:1;border-radius:50%;background:var(--ink);color:var(--white);display:grid;place-items:center;font-style:normal;font-size:.4em;transition:background .3s,transform .5s var(--ease)}
.next:hover .nm i{background:var(--red);transform:rotate(-45deg)}

/* A · Clásica: foto grande, texto y galería */
.sa .hero{position:relative;height:min(82vh,760px);display:flex;flex-direction:column;justify-content:space-between;padding:clamp(24px,3vw,40px) var(--pad) clamp(34px,5vw,70px);color:var(--white);overflow:hidden}
.sa .hero>.ph{position:absolute;inset:0}
.sa .hero>.ph img{filter:brightness(.5);animation:zo 1.6s cubic-bezier(.2,.7,.2,1) both}
@keyframes zo{from{transform:scale(1.12)}}
.sa .hero>*:not(.ph){position:relative}
.sa .hero .k{color:var(--white);opacity:.85}
.sa .hero h1{font-weight:300;font-size:clamp(40px,6vw,104px);line-height:.98;letter-spacing:-.045em;max-width:12em;margin-top:12px}
.sa .intro{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(30px,6vw,110px);padding-block:clamp(60px,8vw,120px)}
.sa .intro .side{position:sticky;top:calc(var(--bh) + 30px);align-self:start}
.sa .intro .side h2{font-weight:400;font-size:clamp(26px,2.6vw,40px);line-height:1.1;letter-spacing:-.03em;margin:10px 0 16px}
.sa .intro .side p{color:var(--grey);font-size:16px;line-height:1.6;max-width:22em}
.sa .gal{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(10px,1.4vw,20px);padding-bottom:clamp(60px,8vw,110px)}
.sa .gal .ph{border-radius:4px;grid-column:span 6;aspect-ratio:4/3}
.sa .gal .ph:nth-child(3n+1){grid-column:span 12;aspect-ratio:21/9}
.sa .galh{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-block:24px}
.sa .galh h2{font-weight:300;font-size:clamp(28px,3vw,48px);letter-spacing:-.035em}

/* B · Texto fijo y galería que corre */
.sb .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(30px,5vw,90px);padding-block:clamp(40px,5vw,70px) clamp(60px,8vw,110px)}
.sb .txt{position:sticky;top:calc(var(--bh) + 30px);align-self:start}
.sb .txt h1{font-weight:300;font-size:clamp(36px,4.4vw,72px);line-height:1.04;letter-spacing:-.045em;margin:22px 0 18px}
.sb .txt .tg{font:400 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--red);margin-bottom:clamp(20px,2.4vw,34px)}
.sb .txt .body p{font-size:clamp(15px,1.1vw,17px)}
.sb .pics{display:flex;flex-direction:column;gap:clamp(10px,1.4vw,20px)}
.sb .pics .ph{border-radius:6px;aspect-ratio:4/5}
.sb .pics .ph:nth-child(even){aspect-ratio:4/3;width:82%;margin-left:auto}

/* C · Nombre gigante, círculo y galería en horizontal */
.sc .hd{padding-block:clamp(30px,4vw,60px) clamp(40px,5vw,70px)}
.sc .big{display:flex;align-items:center;gap:clamp(16px,3vw,50px);margin-top:clamp(30px,4vw,60px)}
.sc .big h1{font-weight:800;font-size:clamp(46px,9vw,170px);line-height:.88;letter-spacing:-.065em;min-width:0}
.sc .big .ph{flex:none;width:clamp(120px,20vw,320px);aspect-ratio:1;border-radius:50%;animation:pop 1.2s var(--ease) both}
@keyframes pop{from{clip-path:circle(0% at 50% 50%)}to{clip-path:circle(50% at 50% 50%)}}
.sc .row{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(30px,6vw,110px);padding-bottom:clamp(60px,8vw,110px);border-top:1px solid var(--line);padding-top:clamp(40px,5vw,70px)}
.sc .row h2{font-weight:400;font-size:clamp(26px,2.8vw,44px);line-height:1.08;letter-spacing:-.03em;margin-top:10px}
.sc .strip{background:var(--ink);color:var(--white);padding-block:clamp(50px,7vw,100px)}
.sc .strip .h{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:clamp(24px,3vw,40px)}
.sc .strip .h h2{font-weight:300;font-size:clamp(28px,3vw,48px);letter-spacing:-.035em}
.sc .strip .ctl{display:flex;gap:10px}
.sc .strip .ctl button{width:50px;aspect-ratio:1;border-radius:50%;border:1.5px solid var(--white);display:grid;place-items:center;font-size:18px;transition:background .3s,color .3s}
.sc .strip .ctl button:hover{background:var(--white);color:var(--ink)}
.sc .rail{display:flex;gap:clamp(12px,1.6vw,22px);overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-inline:var(--pad);scroll-padding-inline:var(--pad)}
.sc .rail::-webkit-scrollbar{display:none}
.sc .rail .ph{flex:none;height:min(62vh,560px);aspect-ratio:4/5;border-radius:6px;scroll-snap-align:start}
.sc .rail .ph:nth-child(even){aspect-ratio:4/3}
.sc .rail .ph.empty{background:repeating-linear-gradient(135deg,#1b1b1a 0 14px,#222220 14px 28px);outline-color:rgba(241,240,232,.25)}
.sc .rail .ph.empty::after{color:rgba(241,240,232,.6)}

@media (max-width:820px){
  .o1 .list a{grid-template-columns:2.4em minmax(0,1fr) auto}.o1 .list .tg{display:none}
  .o2 .card,.o2 .card:nth-child(-n+2){grid-column:span 6;aspect-ratio:4/3}
  .o3 .pans{flex-direction:column;height:auto}.o3 .pn{flex:none;height:90px;transition:height .8s var(--ease)}.o3 .pn.on{height:440px}
  .o3 .pn .v{writing-mode:horizontal-tb;transform:none;left:20px;bottom:auto;top:50%;translate:0 -50%}.o3 .pn .num{left:auto;right:20px;top:50%;transform:translateY(-50%)}
  .o4 .split{grid-template-columns:1fr}.o4 .stage{order:-1;aspect-ratio:4/3}
  .o6 .sl{width:84vw}
  .sa .intro,.sb .cols,.sc .row{grid-template-columns:1fr}.sa .intro .side,.sb .txt{position:static}
  .sa .gal .ph,.sa .gal .ph:nth-child(3n+1){grid-column:span 12;aspect-ratio:4/3}
  .sb .pics .ph:nth-child(even){width:100%}
  .sc .big{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav class="bar" id="bar" aria-label="Opciones">
  <b>Página</b><button data-o="1">1 · Lista</button><button data-o="2">2 · Tarjetas</button><button data-o="3">3 · Paneles</button><button data-o="4">4 · Dividida</button><button data-o="5">5 · Círculos</button><button data-o="6">6 · Carrusel</button>
  <b>Subpágina</b><button data-s="A">A · Clásica</button><button data-s="B">B · Galería al lado</button><button data-s="C">C · Nombre grande</button>
</nav>
<div id="app"></div>

<script>
(function(){
  var R='https://www.launchstudiogroup.com/';
  var S=[
   {id:'stands',n:'Stands',tag:'Build to stand out',d:'Diseñamos espacios que captan miradas y hacen que las marcas destaquen.',i:'assets/img/servicios/servicio-stands-truphone.jpg',
    g:['assets/img/servicios/servicio-stands-truphone.jpg',R+'c2a866e5-b2a5-486d-84e8-c9346805efe2.JPG',R+'JVM.jpeg',R+'BIOHORIZONS.JPG',R+'TRUPHONE.JPG',''],
    h:'Stands que hacen que tu marca destaque',
    p:['En Launch Studio diseñamos stands que llaman la atención, transmiten quién eres y hacen que la gente quiera acercarse. Creamos espacios con personalidad, pensados para que tu marca destaque, conecte con las personas y deje huella.',
       'Cada proyecto empieza por escucharte y entender qué quieres conseguir. Diseñamos tu stand a medida y nos encargamos de todo el proceso: desde los trámites con la feria y la aprobación de planos hasta la contratación de servicios y la coordinación del montaje.',
       '¿El objetivo? Que el día antes de la feria tengas tu stand terminado y listo para recibirte. Una entrega llave en mano, sin complicaciones ni sorpresas de última hora. Tú céntrate en tu marca. Nosotros nos encargamos del espacio.']},
   {id:'eventos',n:'Eventos corporativos',tag:'Every detail matters',d:'Elegancia, precisión y diseño en eventos donde cada detalle cuenta.',i:R+'25f3b694-0d3c-438c-be95-81e2b03044e5.JPG',

  window.fb=function(m){var p=m.parentNode;if(p)p.classList.add('empty');m.remove()};
  var app=document.getElementById('app'),n2=function(i){return '0'+(i+1)};
  var ph=function(src,alt,cls,pos){return '<figure class="ph'+(src?'':' empty')+(cls?' '+cls:'')+'">'+(src?'<img src="'+src+'" alt="'+(alt||'')+'" loading="lazy" onerror="fb(this)"'+(pos?' style="object-position:'+pos+'"':'')+'>':'')+'</figure>'};
  var cover=function(s,cls){return ph(s.i,s.n,cls,s.o)};
  var href=function(s){return '#'+s.id};
  var body=function(s){return '<div class="body">'+s.p.map(function(t){return t.indexOf('¿El objetivo?')===0?'<p class="goal"><b>¿El objetivo?</b>'+t.slice(13)+'</p>':'<p>'+t+'</p>'}).join('')+'</div>'};
  var top=function(){return '<div class="wrap top fade"><div><p class="eyebrow">Servicios</p><h1>Lo que <em>hacemos.</em></h1></div><p>Cinco formas de llevar tu marca al espacio. Pulsa un servicio para ver su página con fotos y todos los detalles.</p></div>'};
  var end='<section class="end"><div class="wrap"><p>¿Tienes un proyecto en mente?</p><a class="btn" href="contacto.html">Hablemos →</a></div></section>';
  var go='<span class="go">Ver servicio <i>→</i></span>';

  var O={
   1:function(){return '<div class="o1">'+top()+'<div class="wrap"><nav class="list">'+S.map(function(s,i){return '<a href="'+href(s)+'" data-i="'+i+'"><span class="k">'+n2(i)+'</span><span class="nm">'+s.n+'</span><span class="tg">'+s.tag+'</span><span class="go"><i>→</i></span></a>'}).join('')+'</nav></div><div class="float" aria-hidden="true">'+cover(S[0])+'</div></div>'},
   2:function(){return '<div class="o2">'+top()+'<div class="wrap grid">'+S.map(function(s,i){return '<a class="card" href="'+href(s)+'">'+cover(s)+'<span class="k">'+n2(i)+' · '+s.tag+'</span><h2>'+s.n+'</h2>'+go+'</a>'}).join('')+'</div></div>'},
   3:function(){return '<div class="o3">'+top()+'<div class="pans">'+S.map(function(s,i){return '<a class="pn'+(i?'':' on')+'" href="'+href(s)+'">'+cover(s)+'<span class="num">'+n2(i)+'</span><span class="v">'+s.n+'</span><div class="info"><span class="k">'+n2(i)+' · '+s.tag+'</span><h2>'+s.n+'</h2><p>'+s.d+'</p>'+go+'</div></a>'}).join('')+'</div></div>'},
   4:function(){return '<div class="o4">'+top()+'<div class="wrap split"><nav class="names">'+S.map(function(s,i){return '<a href="'+href(s)+'" data-i="'+i+'"'+(i?'':' class="on"')+'><span class="nm">'+s.n+'</span><span class="tg">'+s.tag+' →</span></a>'}).join('')+'</nav><div class="stage">'+S.map(function(s,i){return cover(s,i?'':'on')}).join('')+'<p class="lab">'+S[0].d+'</p></div></div></div>'},
   5:function(){return '<div class="o5">'+top()+'<div class="wrap circs">'+S.map(function(s,i){return '<a class="ci" href="'+href(s)+'">'+cover(s)+'<span class="k">'+n2(i)+'</span><h2>'+s.n+'</h2><p>'+s.tag+'</p></a>'}).join('')+'</div></div>'},
   6:function(){return '<div class="o6"><div class="wrap top fade"><div><p class="eyebrow">Servicios</p><h1>Lo que <em>hacemos.</em></h1></div><div class="ctl"><button data-d="-1" aria-label="Anterior">←</button><button data-d="1" aria-label="Siguiente">→</button></div></div><div class="track">'+S.map(function(s,i){return '<a class="sl" href="'+href(s)+'">'+cover(s)+'<div class="meta"><span class="n">'+n2(i)+'</span><div><h2>'+s.n+'</h2><p>'+s.d+'</p></div>'+go+'</div></a>'}).join('')+'</div></div>'}
  };

  function nextLink(i){var s=S[(i+1)%S.length];return '<a class="next wrap" href="'+href(s)+'"><span class="k">Siguiente servicio</span><span class="nm">'+s.n+'<i>→</i></span></a>'}
  var crumb=function(s){return '<nav class="crumb"><a href="#">← Servicios</a><span>/</span><span>'+s.n+'</span></nav>'};
  var SUB={
   A:function(s,i){return '<div class="sa"><header class="hero">'+cover(s)+crumb(s)+'<div><span class="k">'+n2(i)+' · '+s.n+'</span><h1>'+s.h+'</h1></div></header><div class="wrap intro"><div class="side"><span class="k">'+s.tag+'</span><h2>'+s.n+'</h2><p>'+s.d+'</p></div>'+body(s)+'</div><div class="wrap"><div class="galh"><h2>Proyectos de '+s.n.toLowerCase()+'</h2><span class="k">'+s.g.length+' imágenes</span></div><div class="gal">'+s.g.map(function(g){return ph(g,s.n)}).join('')+'</div></div>'+nextLink(i)+'</div>'},
   B:function(s,i){return '<div class="sb"><div class="wrap cols"><div class="txt fade">'+crumb(s)+'<h1>'+s.h+'</h1><p class="tg">'+n2(i)+' · '+s.n+' — '+s.tag+'</p>'+body(s)+'</div><div class="pics">'+s.g.map(function(g,k){return ph(g||'',s.n,'',k===0?s.o:'')}).join('')+'</div></div>'+nextLink(i)+'</div>'},
   C:function(s,i){return '<div class="sc"><div class="wrap hd">'+crumb(s)+'<div class="big"><h1>'+s.n+'</h1>'+cover(s)+'</div></div><div class="wrap row"><div><span class="k">'+n2(i)+' · '+s.tag+'</span><h2>'+s.h+'</h2></div>'+body(s)+'</div><section class="strip"><div class="wrap h"><h2>Galería</h2><div class="ctl"><button data-d="-1" aria-label="Anterior">←</button><button data-d="1" aria-label="Siguiente">→</button></div></div><div class="rail">'+s.g.map(function(g){return ph(g,s.n)}).join('')+'</div></section><div style="height:1px"></div>'+nextLink(i)+'</div>'}
  };

  var st={o:'1',s:'A'};
  function idx(){var id=location.hash.slice(1);for(var i=0;i<S.length;i++)if(S[i].id===id)return i;return -1}
  function render(){var i=idx();
    app.innerHTML=(i<0?O[st.o]():SUB[st.s](S[i],i))+end;
    document.querySelectorAll('#bar [data-o]').forEach(function(b){b.setAttribute('aria-pressed',i<0&&b.dataset.o===st.o)});
    document.querySelectorAll('#bar [data-s]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.s===st.s)});
    window.scrollTo(0,0);wire();}
  function wire(){
    var fl=app.querySelector('.o1 .float');
    if(fl&&matchMedia('(hover:hover)').matches){var fi=fl.querySelector('img');
      app.querySelectorAll('.o1 .list a').forEach(function(a){a.addEventListener('mouseenter',function(){var s=S[a.dataset.i];fl.innerHTML=cover(s);fl.classList.add('on')});a.addEventListener('mouseleave',function(){fl.classList.remove('on')})});
      app.querySelector('.o1 .list').addEventListener('mousemove',function(e){fl.style.transform='translate('+(e.clientX-140)+'px,'+(e.clientY-175)+'px) scale(1)'});}
    app.querySelectorAll('.o3 .pn').forEach(function(p,_,all){var on=function(){all.forEach(function(x){x.classList.toggle('on',x===p)})};p.addEventListener('mouseenter',on);p.addEventListener('focus',on);
      p.addEventListener('click',function(e){if(!p.classList.contains('on')){e.preventDefault();on()}})});
    var stg=app.querySelector('.o4 .stage');
    if(stg){var P=stg.querySelectorAll('.ph'),lab=stg.querySelector('.lab'),names=app.querySelectorAll('.o4 .names a');
      names.forEach(function(a){var f=function(){var k=+a.dataset.i;if(P[k].classList.contains('on'))return;P.forEach(function(x){x.classList.remove('was');if(x.classList.contains('on')){x.classList.remove('on');x.classList.add('was')}});P[k].classList.add('on');lab.textContent=S[k].d;names.forEach(function(n){n.classList.toggle('on',n===a)})};a.addEventListener('mouseenter',f);a.addEventListener('focus',f)});}
    app.querySelectorAll('.ctl [data-d]').forEach(function(b){b.addEventListener('click',function(){var t=app.querySelector('.track,.rail');t.scrollBy({left:+b.dataset.d*t.clientWidth*.7,behavior:'smooth'})})});
  }
  document.querySelectorAll('#bar [data-o]').forEach(function(b){b.addEventListener('click',function(){st.o=b.dataset.o;if(location.hash){history.pushState(null,'',location.pathname);}render()})});
  document.querySelectorAll('#bar [data-s]').forEach(function(b){b.addEventListener('click',function(){st.s=b.dataset.s;if(idx()<0){location.hash=S[0].id}else render()})});
  addEventListener('hashchange',render);addEventListener('popstate',render);
  var bar=document.getElementById('bar');function bh(){document.documentElement.style.setProperty('--bh',bar.offsetHeight+'px')}addEventListener('resize',bh);bh();
  render();
})();
</script>
