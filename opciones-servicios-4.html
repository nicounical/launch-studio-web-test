<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Más opciones página Servicios — Launch Studio</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Poppins:wght@300;400;500;600;800&display=swap">
<style>
/* Seis diseños nuevos para la página de Servicios, distintos de la tanda anterior.
   Mismos cinco servicios, lemas, textos y fotos que la portada. */
:root{--white:#F1F0E8;--ink:#0b0b0b;--red:#D93333;--grey:#5f5d56;--line:rgba(11,11,11,.16);--font:"Poppins",system-ui,sans-serif;--mono:"DM Mono",ui-monospace,Menlo,monospace;--pad:clamp(20px,5vw,80px);--ease:cubic-bezier(.7,0,.2,1)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--white);color:var(--ink);font-family:var(--font);font-weight:300;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
a{color:inherit}
img{display:block;width:100%;height:100%;object-fit:cover}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.bar{position:fixed;inset:0 0 auto 0;z-index:60;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px var(--pad);background:rgba(11,11,11,.92);color:var(--white);font:400 12px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.bar span{margin-right:auto}
.bar>button{border:1px solid rgba(241,240,232,.35);border-radius:999px;padding:6px 14px;color:var(--white);font:inherit;letter-spacing:inherit;text-transform:inherit}
.bar>button:hover{background:var(--red);border-color:var(--red)}
.bar>button[aria-pressed="true"]{background:var(--white);color:var(--ink);border-color:var(--white)}
.page{display:none;padding-top:44px}.page.on{display:block}
.wrap{padding-inline:var(--pad);max-width:1440px;margin-inline:auto}
.eyebrow{font-weight:600;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--red)}
.k{font:400 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
.top{padding-block:clamp(70px,9vw,130px) clamp(40px,5vw,70px)}
.top h1{font-weight:300;font-size:clamp(44px,7vw,120px);line-height:.98;letter-spacing:-.045em;margin-top:14px}
.top h1 em{font-style:normal;font-weight:600}
.tag{text-transform:uppercase;font-weight:600;line-height:1;letter-spacing:-.025em}
.desc{font-size:clamp(16px,1.4vw,19px);line-height:1.55;color:var(--grey);max-width:28em}
.ph{overflow:hidden;background:#dddbd0}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border:1.5px solid currentColor;border-radius:999px;font-weight:500;font-size:15px;text-decoration:none;transition:background .3s,color .3s,border-color .3s}
.end{background:var(--red);color:var(--white);padding:clamp(60px,8vw,110px) 0}
.end .wrap{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:30px}
.end p{font-weight:300;font-size:clamp(28px,3.8vw,62px);line-height:1.05;letter-spacing:-.035em}
.end .btn:hover{background:var(--white);color:var(--red);border-color:var(--white)}

/* 1 · Pantalla partida: lemas a la izquierda, foto a la derecha que cambia con un círculo */
.p1 .sc{height:calc(var(--n)*90vh + 10vh)}
.p1 .pin{position:sticky;top:44px;height:calc(100vh - 44px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.p1 .l{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:30px var(--pad)}
.p1 .l .it{transition:opacity .4s}
.p1 .l .tag{font-size:clamp(24px,3vw,48px);font-weight:800;letter-spacing:-.045em;color:transparent;-webkit-text-stroke:1.2px rgba(11,11,11,.35);transition:color .4s,-webkit-text-stroke-color .4s}
.p1 .l .it.on .tag{color:var(--ink);-webkit-text-stroke-color:var(--ink)}
.p1 .l .meta{display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s var(--ease)}
.p1 .l .it.on .meta{grid-template-rows:1fr}
.p1 .l .meta>div{overflow:hidden}
.p1 .l .meta p{padding:8px 0 16px}
.p1 .r{position:relative;overflow:hidden;background:#1d1c1a}
.p1 .r .ph{position:absolute;inset:0;clip-path:circle(0% at 50% 50%);transition:clip-path 1.1s var(--ease)}
.p1 .r .ph.on{clip-path:circle(75% at 50% 50%);z-index:2}
.p1 .r .ph.was{clip-path:circle(75% at 50% 50%);z-index:1}
.p1 .r .num{position:absolute;left:24px;bottom:18px;z-index:3;font-weight:800;font-size:clamp(70px,9vw,150px);line-height:1;letter-spacing:-.06em;color:transparent;-webkit-text-stroke:1.5px rgba(241,240,232,.85)}

/* 2 · Cinco redondas en fila: la que tocas crece y enseña el texto */
.p2 .circ{display:flex;justify-content:center;align-items:center;gap:clamp(8px,1.2vw,18px);padding-block:clamp(20px,3vw,40px) clamp(60px,8vw,110px)}
.p2 .c{position:relative;flex:1;max-width:340px;aspect-ratio:1;border-radius:50%;overflow:hidden;transition:flex .8s var(--ease);color:var(--white);background:#1d1c1a}
.p2 .c.on{flex:2.4;max-width:620px}
.p2 .c img{position:absolute;inset:0;filter:grayscale(1) brightness(.75);transition:filter .6s,transform 1.2s cubic-bezier(.2,.7,.2,1)}
.p2 .c.on img{filter:brightness(.42);transform:scale(1.04)}
.p2 .c .in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:14%;opacity:0;transition:opacity .4s}
.p2 .c.on .in{opacity:1;transition-delay:.35s}
.p2 .c .tag{font-size:clamp(20px,2.4vw,40px);margin:10px 0 12px}
.p2 .c .desc{color:rgba(241,240,232,.88);font-size:clamp(13px,1.1vw,16px)}
.p2 .c .k{color:var(--white);opacity:.85}
.p2 .c .lab{position:absolute;inset:auto 0 16%;text-align:center;font:400 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;transition:opacity .3s}
.p2 .c.on .lab{opacity:0}

/* 3 · Revista: cada servicio a doble página, alternando crema, negro y rojo */
.p3 .spread{position:relative;padding:clamp(70px,9vw,140px) var(--pad);overflow:hidden}
.p3 .spread:nth-child(3n+2){background:var(--ink);color:var(--white)}
.p3 .spread:nth-child(3n+3){background:var(--red);color:var(--white)}
.p3 .spread:nth-child(3n+2) .desc,.p3 .spread:nth-child(3n+3) .desc{color:rgba(241,240,232,.85)}
.p3 .spread:nth-child(3n+3) .k{color:var(--ink)}
.p3 .spread .tag{position:relative;z-index:2;font-size:clamp(54px,10vw,190px);font-weight:800;letter-spacing:-.055em;line-height:.88;max-width:9em}
.p3 .spread .ph{position:relative;z-index:1;width:min(42vw,560px);aspect-ratio:4/5;margin:calc(-1*clamp(30px,5vw,90px)) 0 0 auto;transform:translateY(var(--py,0))}
.p3 .spread:nth-child(even) .ph{margin:calc(-1*clamp(30px,5vw,90px)) auto 0 0}
.p3 .spread .foot{position:relative;z-index:2;display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-top:clamp(-120px,-8vw,-50px)}
.p3 .spread:nth-child(even) .foot{flex-direction:row-reverse;text-align:right}
.p3 .spread .foot .n{font:800 clamp(40px,5vw,80px)/1 var(--font);letter-spacing:-.05em}

/* 4 · El lema con la foto dentro de las letras, uno detrás de otro */
.p4 .blk{padding-block:clamp(50px,7vw,100px);border-top:1px solid var(--line)}
.p4 .ko{font-weight:800;font-size:clamp(56px,10.4vw,190px);line-height:.86;letter-spacing:-.06em;text-transform:uppercase;color:transparent;background-size:cover;background-position:50% var(--bp,50%);-webkit-background-clip:text;background-clip:text}
.p4 .row{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-top:clamp(18px,2vw,30px)}
.p4 .row .k{color:var(--grey)}

/* 5 · Pestañas con barra que avanza sola */
.p5 .tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(8px,1.4vw,22px);margin-bottom:clamp(20px,3vw,36px)}
.p5 .tab{display:flex;flex-direction:column;gap:10px;font-weight:400;font-size:clamp(13px,1.1vw,16px);line-height:1.25;color:rgba(11,11,11,.4);transition:color .3s}
.p5 .tab.on{color:var(--ink)}
.p5 .tab i{display:block;height:2px;background:var(--line);overflow:hidden}
.p5 .tab i::after{content:"";display:block;height:100%;background:var(--red);transform:scaleX(var(--p,0));transform-origin:0 50%}
.p5 .stage{position:relative;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(24px,4vw,60px);align-items:stretch;min-height:min(64vh,560px);margin-bottom:clamp(60px,8vw,110px)}
.p5 .pics{position:relative;overflow:hidden;background:#dddbd0}
.p5 .pics .ph{position:absolute;inset:0;transform:translateX(100%);transition:transform 1s var(--ease)}
.p5 .pics .ph.on{transform:none;z-index:2}
.p5 .pics .ph.was{transform:translateX(-30%);z-index:1;transition-duration:1.2s}
.p5 .txt{display:flex;flex-direction:column;justify-content:space-between;padding-block:8px}
.p5 .txt .n{font-weight:800;font-size:clamp(80px,10vw,170px);line-height:.8;letter-spacing:-.06em;color:var(--red)}
.p5 .txt .tag{font-size:clamp(32px,3.8vw,62px);margin:12px 0 16px}
.p5 .txt>div>*{animation:up .7s cubic-bezier(.2,.7,.2,1) both}
.p5 .txt>div>*:nth-child(2){animation-delay:.06s}.p5 .txt>div>*:nth-child(3){animation-delay:.12s}
@keyframes up{from{opacity:0;transform:translateY(22px)}}

/* 6 · Tarjetas en arco que pasan de lado */
.p6{background:var(--ink);color:var(--white)}
.p6 .sc{height:360vh}
.p6 .pin{position:sticky;top:44px;height:calc(100vh - 44px);overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:clamp(20px,3vw,40px)}
.p6 .pin .top{padding-block:0}
.p6 .track{display:flex;gap:clamp(20px,3vw,44px);padding-inline:var(--pad);will-change:transform}
.p6 .card{flex:none;width:clamp(260px,26vw,380px)}
.p6 .card .ph{aspect-ratio:4/5;border-radius:999px 999px 0 0;background:#1d1c1a}
.p6 .card .tag{font-size:clamp(22px,2.2vw,34px);margin:16px 0 10px}
.p6 .card .desc{color:rgba(241,240,232,.7);font-size:15px}
.p6 .rail{position:relative;margin:0 var(--pad);height:1px;background:rgba(241,240,232,.2)}
.p6 .rail i{position:absolute;top:-8px;left:calc(var(--p,0)*100%);width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--red)}

@media (max-width:820px){
  .p1 .sc{height:auto}.p1 .pin{position:static;height:auto;grid-template-columns:1fr}.p1 .r{height:50vh;order:-1}.p1 .l .meta{grid-template-rows:1fr}.p1 .l .tag{color:var(--ink);-webkit-text-stroke-color:var(--ink)}
  .p2 .circ{flex-direction:column}.p2 .c{flex:none;width:100%;max-width:320px}.p2 .c.on{max-width:340px}.p2 .c .in{opacity:1}.p2 .c img{filter:brightness(.42)}.p2 .c .lab{display:none}
  .p3 .spread .ph{width:80%;margin-top:20px!important}.p3 .spread .foot{margin-top:20px;flex-direction:column!important;text-align:left!important;align-items:flex-start}
  .p5 .tabs{gap:6px}.p5 .tab span{display:none}.p5 .stage{grid-template-columns:1fr}.p5 .pics{height:50vh}
  .p6 .sc{height:auto}.p6 .pin{position:static;height:auto;padding-block:40px}.p6 .track{flex-direction:column;transform:none!important}.p6 .card{width:auto}.p6 .rail{display:none}
  .bar span{display:none}.bar{justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav class="bar" aria-label="Opciones"><span>Página Servicios · seis opciones nuevas</span>
  <button data-p="1" aria-pressed="true">1 · Partida</button><button data-p="2" aria-pressed="false">2 · Redondas</button><button data-p="3" aria-pressed="false">3 · Revista</button><button data-p="4" aria-pressed="false">4 · Letras</button><button data-p="5" aria-pressed="false">5 · Pestañas</button><button data-p="6" aria-pressed="false">6 · Arcos</button></nav>

<main class="page p1 on" id="p1"><div data-top></div><section class="sc" id="p1sc" style="--n:5"><div class="pin"><div class="l" id="p1l"></div><div class="r" id="p1r"><span class="num" id="p1n">01</span></div></div></section><div data-end></div></main>
<main class="page p2" id="p2"><div data-top></div><div class="wrap"><div class="circ" id="p2c"></div></div><div data-end></div></main>
<main class="page p3" id="p3"><div data-top></div><div id="p3s"></div><div data-end></div></main>
<main class="page p4" id="p4"><div data-top></div><div class="wrap" id="p4l"></div><div data-end></div></main>
<main class="page p5" id="p5"><div data-top></div><div class="wrap"><div class="tabs" id="p5t"></div><div class="stage"><div class="pics" id="p5p"></div><div class="txt" id="p5x"></div></div></div><div data-end></div></main>
<main class="page p6" id="p6"><section class="sc" id="p6sc"><div class="pin"><div class="wrap top"><p class="eyebrow">Servicios</p><h1>Lo que <em>hacemos.</em></h1></div><div class="track" id="p6t"></div><div class="rail"><i id="p6b"></i></div></div></section><div data-end></div></main>

<script>
(function(){
  var OLD='https://www.launchstudiogroup.com/';
  var S=[
    {n:'Stands',t:'Build to stand out',d:'Diseñamos espacios que captan miradas y hacen que las marcas destaquen.',i:'assets/img/servicios/servicio-stands-truphone.jpg'},
    {n:'Eventos corporativos',t:'Every detail matters',d:'Elegancia, precisión y diseño en eventos donde cada detalle cuenta.',i:'assets/img/proyectos/04-evento-corporativo-ntt-data.jpg',o:'25f3b694-0d3c-438c-be95-81e2b03044e5.JPG'},
    {n:'Experiencias de marca',t:'Make it a feeling',d:'Experiencias que conectan con las personas y convierten las marcas en emociones.',i:'assets/img/servicios/servicio-experiencias-cursa-base4.jpg'},
    {n:'Renders, interiorismo y planimetría',t:'Vision into form',d:'De la idea al espacio. Precisión técnica y visión estética.',i:'assets/img/servicios/servicio-renders-interiorismo.jpg'},
    {n:'Diseño gráfico',t:'Identity in every detail',d:'Identidades visuales que transmiten personalidad, coherencia y carácter.',i:'assets/img/servicios/servicio-diseno-grafico-ceramica.jpg'}];
  var $=function(id){return document.getElementById(id)},each=function(l,f){[].forEach.call(l,f)},n2=function(i){return '0'+(i+1)},cl=function(x){return Math.max(0,Math.min(1,x))};
  var calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var img=function(s){return '<img src="'+s.i+'" alt="'+s.n+'" loading="lazy"'+(s.o?' onerror="this.onerror=null;this.src=\''+OLD+s.o+'\'"':'')+'>'};
  var bg=function(s){return "url('"+s.i+"')"+(s.o?",url('"+OLD+s.o+"')":'')+",linear-gradient(#0b0b0b,#0b0b0b)"};
  document.querySelectorAll('[data-top]').forEach(function(el){el.outerHTML='<div class="wrap top"><p class="eyebrow">Servicios</p><h1>Lo que <em>hacemos.</em></h1></div>'});
  document.querySelectorAll('[data-end]').forEach(function(el){el.outerHTML='<section class="end"><div class="wrap"><p>¿Tienes un proyecto en mente?</p><a class="btn" href="contacto.html">Hablemos →</a></div></section>'});

  // 1
  $('p1l').innerHTML=S.map(function(s,i){return '<div class="it'+(i?'':' on')+'"><span class="k">'+n2(i)+' · '+s.n+'</span><h2 class="tag">'+s.t+'</h2><div class="meta"><div><p class="desc">'+s.d+'</p></div></div></div>'}).join('');
  $('p1r').insertAdjacentHTML('afterbegin',S.map(function(s,i){return '<div class="ph'+(i?'':' on')+'">'+img(s)+'</div>'}).join(''));
  var c1=-1;function set1(i){if(i===c1)return;var ph=$('p1r').querySelectorAll('.ph');each(ph,function(p,k){p.classList.remove('was');if(k===c1)p.classList.add('was');p.classList.toggle('on',k===i)});each($('p1l').children,function(e,k){e.classList.toggle('on',k===i)});$('p1n').textContent=n2(i);c1=i}
  set1(0);
  // 2
  $('p2c').innerHTML=S.map(function(s,i){return '<article class="c'+(i?'':' on')+'" tabindex="0">'+img(s)+'<span class="lab">'+n2(i)+'</span><div class="in"><span class="k">'+n2(i)+' · '+s.n+'</span><h2 class="tag">'+s.t+'</h2><p class="desc">'+s.d+'</p></div></article>'}).join('');
  each($('p2c').children,function(c,i){var f=function(){each($('p2c').children,function(x,k){x.classList.toggle('on',k===i)})};c.addEventListener('pointerenter',f);c.addEventListener('focus',f);c.addEventListener('click',f)});
  // 3
  $('p3s').innerHTML=S.map(function(s,i){return '<section class="spread"><h2 class="tag">'+s.t+'</h2><div class="ph" data-par>'+img(s)+'</div><div class="foot"><span class="n">'+n2(i)+'</span><div><span class="k">'+s.n+'</span><p class="desc" style="margin-top:8px">'+s.d+'</p></div></div></section>'}).join('');
  // 4
  $('p4l').innerHTML=S.map(function(s,i){return '<article class="blk"><h2 class="ko" style="background-image:'+bg(s)+'">'+s.t+'</h2><div class="row"><span class="k">'+n2(i)+' · '+s.n+'</span><p class="desc">'+s.d+'</p></div></article>'}).join('');
  // 5
  $('p5t').innerHTML=S.map(function(s,i){return '<button class="tab" type="button"><i></i><span class="k" style="color:inherit">'+n2(i)+'</span><span>'+s.n+'</span></button>'}).join('');
  $('p5p').innerHTML=S.map(function(s){return '<div class="ph">'+img(s)+'</div>'}).join('');
  var c5=-1,t0=performance.now(),DUR=5000,hold=false;
  function set5(i){var ph=$('p5p').children;each(ph,function(p,k){p.classList.remove('was');if(k===c5)p.classList.add('was');p.classList.toggle('on',k===i)});
    each($('p5t').children,function(b,k){b.classList.toggle('on',k===i);b.style.setProperty('--p',k<i?1:0)});
    var s=S[i];$('p5x').innerHTML='<div><span class="n">'+n2(i)+'</span><h2 class="tag">'+s.t+'</h2><p class="desc">'+s.d+'</p></div><span class="k">'+s.n+'</span>';c5=i;t0=performance.now()}
  each($('p5t').children,function(b,i){b.addEventListener('click',function(){set5(i)})});
  $('p5p').parentNode.addEventListener('pointerenter',function(){hold=true});$('p5p').parentNode.addEventListener('pointerleave',function(){hold=false;t0=performance.now()});
  set5(0);
  (function loop(now){if(!calm&&!hold&&$('p5').classList.contains('on')){var q=(now-t0)/DUR;if(q>=1)set5((c5+1)%S.length);else $('p5t').children[c5].style.setProperty('--p',q.toFixed(4))}requestAnimationFrame(loop)})(performance.now());
  // 6
  $('p6t').innerHTML=S.map(function(s,i){return '<article class="card"><div class="ph">'+img(s)+'</div><span class="k" style="display:block;margin-top:16px">'+n2(i)+' · '+s.n+'</span><h2 class="tag">'+s.t+'</h2><p class="desc">'+s.d+'</p></article>'}).join('');

  var pages=document.querySelectorAll('.page'),btns=document.querySelectorAll('.bar>[data-p]');
  function show(n){pages.forEach(function(p){p.classList.toggle('on',p.id==='p'+n)});btns.forEach(function(b){b.setAttribute('aria-pressed',b.dataset.p===String(n))});scrollTo(0,0);onScroll()}
  btns.forEach(function(b){b.addEventListener('click',function(){show(b.dataset.p)})});
  function onScroll(){var vh=innerHeight,on=document.querySelector('.page.on').id;
    if(on==='p1'&&innerWidth>820){var r=$('p1sc').getBoundingClientRect(),p=cl(-r.top/(r.height-vh));set1(Math.min(S.length-1,Math.floor(p*S.length*.999)))}
    if(on==='p3'&&!calm)each(document.querySelectorAll('#p3s [data-par]'),function(e){var rr=e.parentNode.getBoundingClientRect();e.style.setProperty('--py',((rr.top+rr.height/2-vh/2)*-.1).toFixed(1)+'px')});
    if(on==='p4')each(document.querySelectorAll('#p4l .ko'),function(e){var rr=e.getBoundingClientRect();e.style.setProperty('--bp',(cl((vh-rr.top)/(vh+rr.height))*100).toFixed(1)+'%')});
    if(on==='p6'&&innerWidth>820){var r6=$('p6sc').getBoundingClientRect(),p6=cl(-r6.top/(r6.height-vh)),tr=$('p6t'),max=tr.scrollWidth-innerWidth;tr.style.transform='translateX('+(-p6*max).toFixed(1)+'px)';$('p6b').style.setProperty('--p',p6.toFixed(3))}
  }
  addEventListener('scroll',onScroll,{passive:true});addEventListener('resize',onScroll);onScroll();
})();
</script>
</body>
</html>
