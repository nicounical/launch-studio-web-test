<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Del plano al stand: cinco coreografías — Launch Studio</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Poppins:wght@300;400;500;600;800&display=swap">
<style>
/* Cinco coreografías de construcción para la sección «Del plano al stand».
   El scroll es la línea de tiempo: bajar construye, subir desmonta. Sin barras de progreso ni interfaz. */
:root{--white:#F1F0E8;--ink:#0b0b0b;--red:#D93333;--grey:#5f5d56;--pad:clamp(20px,4vw,64px);--bh:48px}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:#F4F3EE;color:var(--ink);font-family:"Poppins",system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
h1,h2,p{margin:0}a{color:inherit;text-decoration:none}
.bar{position:fixed;inset:0 0 auto 0;z-index:80;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:9px var(--pad);background:rgba(11,11,11,.94);color:var(--white);font:400 11px "DM Mono",monospace;letter-spacing:.06em;text-transform:uppercase}
.bar b{font-weight:400;opacity:.55;margin-right:6px}
.bar a{border:1px solid rgba(241,240,232,.35);border-radius:999px;padding:5px 12px}
.bar a:hover{background:var(--red);border-color:var(--red)}
.bar a[aria-current]{background:var(--white);color:var(--ink);border-color:var(--white)}
.sc{height:900vh;margin-top:var(--bh)}
.pin{position:sticky;top:var(--bh);height:calc(100vh - var(--bh));overflow:hidden;background:#F4F3EE}
.stage{position:absolute;inset:0}
.ov{position:absolute;z-index:5;transition:color 1.2s,opacity .8s}
.ttl{left:var(--pad);top:clamp(22px,3vw,36px)}
.ttl .k{font:400 11px "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
.ttl h1{font-weight:800;font-size:clamp(32px,4vw,68px);line-height:.88;letter-spacing:-.065em;margin-top:14px}
.ttl h1 span{color:var(--red)}
/* el pie de foto de la fase: discreto, cambia con la construcción */
.cap{left:var(--pad);bottom:clamp(22px,3vw,40px);display:flex;gap:16px;align-items:baseline;max-width:min(520px,80vw)}
.cap b{font:400 11px "DM Mono",monospace;letter-spacing:.08em;color:var(--red)}
.cap span{font-size:clamp(15px,1.3vw,19px);letter-spacing:-.01em}
.cap .sw{animation:sw .7s cubic-bezier(.2,.7,.2,1) both;display:flex;gap:16px;align-items:baseline}
@keyframes sw{from{opacity:0;transform:translateY(8px)}}
.fin{right:var(--pad);bottom:clamp(22px,3vw,40px);text-align:right;opacity:0}
.fin h2{font-weight:300;font-size:clamp(26px,2.8vw,46px);letter-spacing:-.04em;line-height:1.02}
.fin p{font:400 11px "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-top:10px}
.pin.eve .ov{color:#fff}.pin.eve .ttl .k{opacity:.75}
.hint{right:var(--pad);top:clamp(26px,3vw,40px);font:400 11px "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase;opacity:.55}
.note{padding:40px var(--pad) 80px;max-width:820px;font-size:16px;line-height:1.7;color:var(--grey)}
.note b{color:var(--ink);font-weight:600}
@media (prefers-reduced-motion:reduce){.cap .sw{animation:none}}
</style>
</head>
<body>
<nav class="bar" aria-label="Opciones"><b>Del plano al stand</b>
  <a href="?m=A">A · Montaje</a><a href="?m=B">B · Extrusión</a><a href="?m=C">C · Despiece</a><a href="?m=D">D · A pie de pasillo</a><a href="?m=E">E · Manual de montaje</a>
</nav>
<section class="sc" id="sc" aria-label="El stand se construye mientras bajas">
  <div class="pin" id="pin">
    <div class="stage" id="stage"></div>
    <div class="ov ttl"><p class="k">Servicios / Stands</p><h1>Del plano<br><span>al stand.</span></h1></div>
    <p class="ov hint" id="hint">Baja para construirlo ↓</p>
    <div class="ov cap" id="cap" aria-live="polite"></div>
    <div class="ov fin" id="fin"><h2>Listo para recibirte.</h2><p>El día antes de la feria · llave en mano</p></div>
  </div>
</section>
<div class="note" id="note"></div>

<script type="module">
import { createBuild } from './assets/js/stand-build.js?v=202611031600';
const M=new URLSearchParams(location.search).get('m')||'A';
const NOTES={
 A:'<b>A · Montaje.</b> Cada pieza tiene un origen y un destino: la cinta marca el suelo, la tarima se coloca por filas, las columnas y el techo bajan colgados de cables, los paneles encajan uno a uno, el mostrador entra deslizándose y las sillas se acercan a su mesa. Después se instala la gráfica como un vinilo y se encienden las luces. La cámara baja despacio hasta el encuadre final.',
 B:'<b>B · Extrusión.</b> La versión actual llevada más lejos: el plano visto desde arriba se inclina, cada pieza crece desde su huella en el suelo y el material sube como una pasada de escáner por encima de las aristas.',
 C:'<b>C · Despiece.</b> Axonometría técnica, sin perspectiva: las piezas llegan a su capa (suelo, mobiliario, paredes, techo) como en un dibujo despiezado, y luego bajan capa a capa hasta encajar.',
 D:'<b>D · A pie de pasillo.</b> La cámara está quieta, a la altura de los ojos, como un fotógrafo con trípode en el pasillo de la feria. El stand se monta delante de ti y el encuadre apenas se acerca.',
 E:'<b>E · Manual de montaje.</b> Antes de moverse, cada pieza dibuja en rojo su trayectoria de origen a destino, como unas instrucciones de montaje. Luego la recorre y la línea desaparece.'};
document.querySelectorAll('.bar a').forEach(a=>{if(a.getAttribute('href')==='?m='+M)a.setAttribute('aria-current','page')});
document.getElementById('note').innerHTML=NOTES[M]+' <br><br>Baja despacio para ver cada movimiento y sube para desmontarlo.';
const PH=[[0,'01','El espacio vacío'],[.10,'02','La estructura'],[.30,'03','La arquitectura'],[.48,'04','El mobiliario'],[.64,'05','La marca'],[.74,'06','La luz'],[.9,'','']];
const cl=x=>Math.max(0,Math.min(1,x));
const bar=document.querySelector('.bar'),sec=document.getElementById('sc'),pin=document.getElementById('pin'),cap=document.getElementById('cap'),fin=document.getElementById('fin'),hint=document.getElementById('hint');
document.documentElement.style.setProperty('--bh',bar.offsetHeight+'px');
const prog=()=>{const bh=bar.offsetHeight,r=sec.getBoundingClientRect(),h=r.height-(innerHeight-bh);return h>0?cl((bh-r.top)/h):0};
let st=null,cur=-1,tgt=0,now=0,raf=0;
// el scroll manda: suavizado mínimo para que el movimiento no dé tirones, sin separarse de la posición
function loop(){now+=(tgt-now)*.18;if(Math.abs(tgt-now)<.0004)now=tgt;draw(now);if(now!==tgt)raf=requestAnimationFrame(loop);else raf=0}
function draw(p){const eve=st?st.set(p):false;pin.classList.toggle('eve',!!eve);
  let k=0;PH.forEach((ph,i)=>{if(p>=ph[0])k=i});
  if(k!==cur){cur=k;const ph=PH[k];cap.innerHTML=ph[1]?'<div class="sw"><b>'+ph[1]+'</b><span>'+ph[2]+'</span></div>':''}
  fin.style.opacity=cl((p-.9)/.05);hint.style.opacity=1-cl(p/.03)}
function onScroll(){tgt=prog();if(!raf)raf=requestAnimationFrame(loop)}
addEventListener('scroll',onScroll,{passive:true});addEventListener('resize',()=>{if(st)st.resize();onScroll()});
const FIX=new URLSearchParams(location.search).get('p');
createBuild(document.getElementById('stage'),{mode:M,imgBase:'assets/img/'}).then(s=>{st=s;if(FIX!==null){removeEventListener('scroll',onScroll);draw(+FIX);return}tgt=now=prog();draw(now)}).catch(e=>console.error(e));
</script>
</body>
</html>
