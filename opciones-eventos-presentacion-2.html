<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eventos: presentación de producto (3) — Launch Studio</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Poppins:wght@300;400;500;600;800&display=swap">
<style>
/* Cinco portadas para Eventos corporativos. Bajar avanza, subir retrocede. ?m=1..5, ?p=0..1 fija el momento */
:root{--white:#F1F0E8;--paper:#FBF8F2;--sand:#E7E1D6;--ink:#0b0b0b;--red:#D93333;--grey:#5f5d56;--line:rgba(11,11,11,.14);--pad:clamp(20px,4vw,64px);--bh:48px;--font:"Poppins",system-ui,sans-serif;--mono:"DM Mono",ui-monospace,monospace}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--white);color:var(--ink);font-family:var(--font);font-weight:300;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
.bar{position:fixed;inset:0 0 auto 0;z-index:80;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:9px var(--pad);background:rgba(11,11,11,.94);color:var(--white);font:400 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.bar b{font-weight:400;opacity:.55;margin-right:6px}
.bar a{color:inherit;text-decoration:none;border:1px solid rgba(241,240,232,.35);border-radius:999px;padding:5px 12px}
.bar a:hover{background:var(--red);border-color:var(--red)}
.bar a[aria-current]{background:var(--white);color:var(--ink);border-color:var(--white)}
.sc{height:600vh;margin-top:var(--bh)}
.pin{position:sticky;top:var(--bh);height:calc(100vh - var(--bh));overflow:hidden;display:grid;place-items:center}
.k{font:400 10px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.crumb{position:absolute;left:var(--pad);top:clamp(20px,3vw,32px);z-index:9;font:400 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;opacity:.65}
.side{position:absolute;left:var(--pad);bottom:clamp(30px,6vh,60px);max-width:min(420px,80vw);z-index:9}
.side h1{font-weight:300;font-size:clamp(28px,3vw,50px);letter-spacing:-.04em;line-height:1.04}
.side h1 b{font-weight:800;letter-spacing:-.06em}
.side p{margin-top:14px;color:var(--grey);font-size:16px;line-height:1.55}
.note{padding:40px var(--pad) 80px;max-width:860px;font-size:16px;line-height:1.7;color:var(--grey)}
.note b{color:var(--ink);font-weight:600}
svg{overflow:visible}

/* 1 · Las puertas */
.e1 .pin{background:#E8E1D5;perspective:1400px}
.e1 .frame{position:relative;width:min(560px,70vw);height:min(600px,74vh);background:#2a2522;padding:14px 14px 0;box-shadow:0 40px 80px rgba(60,40,20,.25)}
.e1 .in{position:absolute;inset:14px 14px 0;overflow:hidden;background:#141210}
.e1 .in .scr{position:absolute;left:12%;right:12%;top:12%;height:34%;background:#0e0e0e;box-shadow:0 0 0 4px #2a2a2a;display:grid;place-items:center;color:#fff;text-align:center}
.e1 .in .scr h2{font-weight:800;font-size:clamp(20px,2.6vw,40px);letter-spacing:-.06em;line-height:.9}
.e1 .in .scr h2 span{color:var(--red)}
.e1 .in .glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(255,236,205,.35),transparent 60%)}
.e1 .in .stg{position:absolute;left:8%;right:8%;top:52%;height:8%;background:#3a332d}
.e1 .in .rows{position:absolute;left:0;right:0;bottom:0;height:36%}
.e1 .door{position:absolute;top:14px;bottom:0;width:calc(50% - 14px);background:linear-gradient(90deg,#9c7f62,#b8987a 50%,#94785c);z-index:3;box-shadow:inset 0 0 0 10px rgba(0,0,0,.08)}
.e1 .door.l{left:14px;transform-origin:0 50%}.e1 .door.r{right:14px;transform-origin:100% 50%}
.e1 .door i{position:absolute;top:48%;width:8px;height:70px;background:#d8c8a8;border-radius:4px}
.e1 .door.l i{right:14px}.e1 .door.r i{left:14px}
.e1 .door .pl{position:absolute;left:12%;right:12%;top:10%;height:30%;border:2px solid rgba(0,0,0,.12)}
.e1 .door .pl2{position:absolute;left:12%;right:12%;bottom:8%;height:36%;border:2px solid rgba(0,0,0,.12)}
.e1 .sign{position:absolute;left:50%;top:-56px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;white-space:nowrap}
.e1 .lightfloor{position:absolute;left:50%;bottom:-120px;width:0;height:120px;transform:translateX(-50%);background:linear-gradient(rgba(255,236,205,.55),transparent);clip-path:polygon(10% 0,90% 0,100% 100%,0 100%);pointer-events:none}

/* 2 · El plano de la presentación */
.e2 .pin{background:var(--white)}
.e2 .plan{width:min(860px,64vw);height:min(560px,62vh);margin:8vh 0 0 22vw}
.e2 .zone{transition:fill .4s}
.e2 .zl{position:absolute;right:var(--pad);top:clamp(20px,3vw,32px);text-align:right;z-index:9}
.e2 .zl b{display:block;font-weight:800;font-size:clamp(30px,3.6vw,58px);letter-spacing:-.06em;line-height:.95}
.e2 .zl span{display:block;color:var(--grey);font-size:15px;max-width:280px;margin:8px 0 0 auto;line-height:1.5}

/* 3 · El rig de luces */
.e3 .pin{background:#1c1a18;color:var(--white)}
.e3 .crumb{color:var(--white)}
.e3 .truss{position:absolute;left:6%;right:6%;top:9%;height:22px;background:repeating-linear-gradient(60deg,#555 0 2px,transparent 2px 14px),repeating-linear-gradient(-60deg,#555 0 2px,transparent 2px 14px);border-top:3px solid #666;border-bottom:3px solid #666}
.e3 .fx{position:absolute;top:calc(9% + 22px);width:28px;margin-left:-14px}
.e3 .fx .hd{width:28px;height:30px;background:#2e2e2e;border-radius:6px 6px 12px 12px;position:relative}
.e3 .fx .hd::after{content:"";position:absolute;left:6px;right:6px;bottom:4px;height:6px;border-radius:50%;background:#444}
.e3 .fx.on .hd::after{background:#fff4dc;box-shadow:0 0 14px #fff4dc}
.e3 .bm{position:absolute;top:calc(9% + 48px);width:0;height:0;pointer-events:none}
.e3 .bm i{position:absolute;left:-60px;top:0;width:120px;height:120vh;transform-origin:50% 0;background:linear-gradient(rgba(255,240,215,.55),rgba(255,240,215,0) 75%);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);mix-blend-mode:screen;opacity:0}
.e3 .haze{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 100%,rgba(217,51,51,.25),transparent 60%);opacity:0}
.e3 .tx{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center}
.e3 .tx h2{font-weight:800;font-size:clamp(60px,11vw,190px);letter-spacing:-.075em;line-height:.85;opacity:0}
.e3 .tx h2 span{color:var(--red)}
.e3 .floor{position:absolute;left:0;right:0;bottom:0;height:16%;background:linear-gradient(#2a2622,#151311)}
.e3 .side h1{color:var(--white)}.e3 .side p{color:rgba(241,240,232,.6)}

/* 4 · Confeti */
.e4 .pin{background:var(--white)}
.e4 canvas{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.e4 .tx{position:relative;text-align:center;z-index:2}
.e4 .tx .k{display:block;color:var(--grey);margin-bottom:20px}
.e4 .tx h2{font-weight:800;font-size:clamp(56px,10vw,170px);letter-spacing:-.075em;line-height:.85}
.e4 .tx h2 span{color:var(--red)}
.e4 .cnt{font-weight:800;font-size:clamp(100px,22vw,360px);letter-spacing:-.08em;line-height:.8;font-variant-numeric:tabular-nums;position:absolute;inset:0;display:grid;place-items:center}
.e4 .cnt span{color:var(--red)}

/* 5 · La llegada de invitados */
.e5 .pin{background:#EDE7DC}
.e5 .map{width:min(980px,68vw);height:min(560px,64vh);margin:4vh 0 0 22vw}
.e5 .cn{position:absolute;right:var(--pad);top:clamp(20px,3vw,32px);text-align:right;z-index:9}
.e5 .cn b{display:block;font-weight:800;font-size:clamp(46px,6vw,96px);letter-spacing:-.06em;line-height:.9;font-variant-numeric:tabular-nums}
@media (max-width:820px){.side p{display:none}.e2 .zl span{display:none}.e2 .plan,.e5 .map{width:94vw;margin:0}.e5 .cn{top:auto;bottom:clamp(30px,6vh,60px)}}
</style>
</head>
<body>
<nav class="bar" aria-label="Opciones"><b>Eventos · presentación de producto</b>
  <a href="?m=1">1 · Las puertas</a><a href="?m=2">2 · El plano</a><a href="?m=3">3 · Las luces</a><a href="?m=4">4 · Confeti</a><a href="?m=5">5 · La llegada</a></nav>
<main id="app"></main>
<div class="note" id="note"></div>

<script>
(function(){
  var cl=function(x){return Math.max(0,Math.min(1,x))},io=function(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},out=function(x){return 1-Math.pow(1-x,3)},seg=function(p,a,b){return cl((p-a)/(b-a))};
  var LOGO=function(f,h){return '<svg viewBox="440 260 1110 1470" style="height:'+h+';width:auto;display:block" aria-hidden="true"><path d="M462 283H935V1467A353 353 0 0 0 1027 1703H935A473 473 0 0 1 462 1230Z" fill="'+f+'"/><circle cx="1288" cy="1467" r="237" fill="'+f+'"/></svg>'};
  var M=new URLSearchParams(location.search).get('m')||'1';
  document.querySelectorAll('.bar a').forEach(function(a){if(a.getAttribute('href')==='?m='+M)a.setAttribute('aria-current','page')});
  var crumb='<p class="crumb">Servicios / Eventos corporativos</p>';
  var side=function(h,p){return '<div class="side"><h1>'+h+'</h1><p>'+p+'</p></div>'};
  var NOTES={
    1:'<b>1 · Las puertas.</b> Dos puertas de madera cerradas con el cartel «Presentación · Sala principal». Al bajar se abren hacia ti y dejan ver la sala preparada: pantalla encendida, escenario y luz cálida que sale por la puerta.',
    2:'<b>2 · El plano.</b> El plano de una presentación de producto visto desde arriba. Al bajar se van marcando en rojo las zonas, una a una, con su explicación: acreditaciones, photocall, sala, escenario, zona de demo, prensa y cóctel.',
    3:'<b>3 · Las luces.</b> La estructura de luces sobre el escenario. Al bajar se encienden los focos uno a uno, los haces se mueven y, cuando están todos, aparece «Showtime».',
    4:'<b>4 · Confeti.</b> Cuenta atrás 3, 2, 1… y en el momento del reveal estalla el confeti (rojo, negro y crema) con «Ya está aquí.». El confeti va con el scroll: si subes, vuelve atrás.',
    5:'<b>5 · La llegada.</b> Vista desde arriba: los invitados (puntos) llegan por la alfombra, pasan por acreditaciones y van ocupando la sala mientras sube el contador. Al final se enciende el escenario.'};
  document.getElementById('note').innerHTML=NOTES[M]+'<br><br>Sin producto concreto: todo gira alrededor del evento. Textos, nombres y cifras son de ejemplo.';
  var app=document.getElementById('app'),tick=function(){};
  var bar=document.querySelector('.bar');
  var prog=function(sec){var bh=bar.offsetHeight,r=sec.getBoundingClientRect(),h=r.height-(innerHeight-bh);return h>0?cl((bh-r.top)/h):0};
  var wrap=function(cls,inner){app.innerHTML='<div class="'+cls+'"><section class="sc" id="sc"><div class="pin" id="pin">'+crumb+inner+'</div></section></div>'};

  if(M==='1'){
    var rows='<svg class="rows" viewBox="0 0 100 40" preserveAspectRatio="none">';for(var r=0;r<5;r++)for(var c=0;c<14;c++)rows+='<rect x="'+(4+c*6.6+(c>6?2:0))+'" y="'+(4+r*7.4)+'" width="4.6" height="4" rx="1" fill="#7a2420" opacity="'+(.5+r*.1)+'"/>';rows+='</svg>';
    wrap('e1','<div class="frame"><span class="sign k">Presentación · Sala principal</span><div class="in"><div class="glow"></div><div class="scr"><div><p class="k" style="opacity:.6;margin-bottom:8px">Hoy · 12:00</p><h2>Bienvenidos<span>.</span></h2></div></div><div class="stg"></div>'+rows+'</div><div class="door l" id="dl"><div class="pl"></div><div class="pl2"></div><i></i></div><div class="door r" id="dr"><div class="pl"></div><div class="pl2"></div><i></i></div><div class="lightfloor" id="lf"></div></div>'+
      side('Pasen,<br><b>la sala está lista.</b>','Preparamos cada espacio para que, al abrir las puertas, todo esté exactamente donde tiene que estar.'));
    var sec=document.getElementById('sc'),dl=document.getElementById('dl'),dr=document.getElementById('dr'),lf=document.getElementById('lf'),fr=document.querySelector('.e1 .frame');
    tick=function(){var p=prog(sec),o=io(seg(p,.1,.6)),z=io(seg(p,.6,.95));dl.style.transform='rotateY('+(-o*100)+'deg)';dr.style.transform='rotateY('+(o*100)+'deg)';
      lf.style.width=(o*100)+'%';lf.style.opacity=o;fr.style.transform='scale('+(1+z*.28)+')';fr.style.transformOrigin='50% 40%'};
  }
  if(M==='2'){
    var Z=[['acr','Acreditaciones','Recepción, listas e identificación de cada invitado.',60,470,170,110],['pho','Photocall','La primera foto con la marca, nada más entrar.',60,300,170,130],['sal','Sala','Aforo, butacas y visibilidad perfecta desde cada sitio.',270,230,460,330],['stg','Escenario','Pantalla LED, luz y sonido para el gran momento.',330,60,340,120],['demo','Zona de demo','Puestos para tocar, probar y descubrir.',770,300,190,180],['pre','Prensa','Espacio reservado, conexión y entrevistas.',60,60,220,200],['coc','Cóctel','El cierre: conversación y networking.',770,500,190,110]];
    var svg='<svg class="plan" viewBox="0 0 1000 640"><rect x="20" y="20" width="960" height="600" fill="none" stroke="#0b0b0b" stroke-width="2.5"/><rect x="430" y="612" width="140" height="16" fill="#F1F0E8"/><text x="500" y="606" text-anchor="middle" font-family="DM Mono" font-size="11" letter-spacing="3" fill="#5f5d56">ENTRADA</text>'+
      Z.map(function(z,i){return '<g><rect class="zone" id="z'+i+'" x="'+z[3]+'" y="'+z[4]+'" width="'+z[5]+'" height="'+z[6]+'" fill="#F1F0E8" stroke="#0b0b0b" stroke-width="1.4"/><text x="'+(z[3]+12)+'" y="'+(z[4]+22)+'" font-family="DM Mono" font-size="11" letter-spacing="2" fill="#0b0b0b" id="zt'+i+'">'+('0'+(i+1))+' · '+z[1].toUpperCase()+'</text></g>'}).join('');
    for(var r=0;r<7;r++)for(var c=0;c<16;c++)svg+='<circle cx="'+(300+c*26+(c>7?14:0))+'" cy="'+(300+r*34)+'" r="6" fill="none" stroke="#0b0b0b" stroke-opacity=".35"/>';
    svg+='<rect x="380" y="78" width="240" height="12" fill="#0b0b0b"/><path d="M500 610 L500 560" stroke="#D93333" stroke-width="2" stroke-dasharray="4 5"/></svg>';
    wrap('e2',svg+'<div class="zl"><span class="k" id="zn" style="color:var(--red);display:block">01 / 07</span><b id="zb">Acreditaciones</b><span id="zs">'+Z[0][2]+'</span></div>'+side('Cada metro,<br><b>pensado.</b>','Diseñamos el recorrido completo de la presentación, de la puerta al último brindis.'));
    var sec=document.getElementById('sc');
    tick=function(){var p=prog(sec),i=Math.min(Z.length-1,Math.floor(seg(p,.03,.92)*Z.length));
      Z.forEach(function(z,k){document.getElementById('z'+k).setAttribute('fill',k===i?'#D93333':k<i?'#E7E1D6':'#F1F0E8');document.getElementById('zt'+k).setAttribute('fill',k===i?'#fff':'#0b0b0b')});
      document.getElementById('zn').textContent=('0'+(i+1))+' / 07';document.getElementById('zb').textContent=Z[i][1];document.getElementById('zs').textContent=Z[i][2]};
  }
  if(M==='3'){
    var N=9,fx='',bm='';for(var i=0;i<N;i++){var x=10+i*(80/(N-1));fx+='<div class="fx" style="left:'+x+'%"><div class="hd"></div></div>';bm+='<div class="bm" style="left:'+x+'%"><i></i></div>'}
    wrap('e3','<div class="haze" id="hz"></div><div class="floor"></div><div class="truss"></div>'+fx+bm+'<div class="tx"><h2 id="sh">Showtime<span>.</span></h2></div>'+side('Luz, sonido<br><b>y el momento exacto.</b>','Diseño de iluminación y producción técnica para presentaciones que se recuerdan.'));
    var sec=document.getElementById('sc'),fxs=[].slice.call(document.querySelectorAll('.e3 .fx')),bms=[].slice.call(document.querySelectorAll('.e3 .bm i')),sh=document.getElementById('sh'),hz=document.getElementById('hz');
    tick=function(){var p=prog(sec),n=seg(p,.05,.6)*N;
      bms.forEach(function(b,i){var on=cl(n-i),sw=Math.sin(p*14+i*.9)*28*(1-seg(p,.75,.9)),aim=(i-(N-1)/2)*-4*seg(p,.75,.9);b.style.opacity=on*.9;b.style.transform='rotate('+(sw+aim)+'deg)';fxs[i].classList.toggle('on',on>.5);fxs[i].style.transform='rotate('+((sw+aim)*.5)+'deg)'});
      var t=out(seg(p,.72,.86));sh.style.opacity=t;sh.style.transform='scale('+(1.15-.15*t)+')';hz.style.opacity=seg(p,.6,.8)};
  }
  if(M==='4'){
    wrap('e4','<div class="cnt" id="cnt">3</div><div class="tx" id="tx" style="opacity:0"><span class="k">Presentación 2026</span><h2>Ya está<br>aquí<span>.</span></h2></div><canvas id="cv"></canvas>'+side('El momento<br><b>que todos esperan.</b>','Preparamos el gran momento de tu presentación para que se viva como una celebración.'));
    var sec=document.getElementById('sc'),cv=document.getElementById('cv'),cx=cv.getContext('2d'),cnt=document.getElementById('cnt'),tx=document.getElementById('tx'),P=[],COL=['#D93333','#0b0b0b','#E7E1D6','#D93333','#c8b79e'];
    for(var i=0;i<260;i++){var a=-Math.PI/2+(Math.random()-.5)*2.2,v=.6+Math.random()*1.1,side_=i%2?1:-1;P.push({x0:.5+side_*.42,vx:Math.cos(a)*v*.55*(-side_)+(Math.random()-.5)*.2,vy:Math.sin(a)*v,r:Math.random()*6.3,vr:(Math.random()-.5)*14,w:6+Math.random()*8,h:3+Math.random()*5,c:COL[i%5]})}
    var size=function(){var r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio,2);cv.width=r.width*d;cv.height=r.height*d};size();addEventListener('resize',size);
    tick=function(){var p=prog(sec),c=seg(p,.05,.45),n=3-Math.min(2,Math.floor(c*3));cnt.innerHTML='<div>'+n+'<span>.</span></div>';cnt.style.opacity=p<.47?1:0;cnt.style.transform='scale('+(1+(c*3%1)*.08)+')';
      var t=seg(p,.48,1);tx.style.opacity=out(seg(p,.48,.56));tx.style.transform='scale('+(.9+.1*out(seg(p,.48,.56)))+')';
      var W=cv.width,H=cv.height,d=Math.min(devicePixelRatio,2);cx.clearRect(0,0,W,H);if(t<=0)return;
      P.forEach(function(q){var tt=t*2.6,x=(q.x0+q.vx*tt)*W,y=H*(1.02+q.vy*tt+.9*tt*tt);if(y>H+40)return;
        cx.save();cx.translate(x,y);cx.rotate(q.r+q.vr*tt);cx.scale(1,Math.cos(q.vr*tt*1.3));cx.fillStyle=q.c;cx.fillRect(-q.w*d/2,-q.h*d/2,q.w*d,q.h*d);cx.restore()})};
  }
  if(M==='5'){
    // ruta: alfombra desde abajo-izquierda → acreditación → sala (cuadrícula de asientos)
    var seats=[];for(var r=0;r<9;r++)for(var c=0;c<18;c++)seats.push([520+c*28+(c>8?16:0),150+r*34]);
    var svg='<svg class="map" viewBox="0 0 1100 600"><rect x="470" y="40" width="580" height="520" fill="#F7F3EC" stroke="#0b0b0b" stroke-width="2"/><rect x="560" y="60" width="400" height="60" fill="#E7E1D6" stroke="#0b0b0b"/><rect id="led" x="620" y="68" width="280" height="10" fill="#0b0b0b"/><text x="760" y="108" text-anchor="middle" font-family="DM Mono" font-size="11" letter-spacing="3" fill="#5f5d56">ESCENARIO</text>'+
      '<path d="M40 560 L40 470 L300 470 L300 330 L470 330" fill="none" stroke="#D93333" stroke-opacity=".18" stroke-width="40" stroke-linejoin="round"/><rect x="260" y="420" width="80" height="26" fill="#0b0b0b"/><text x="300" y="437" text-anchor="middle" font-family="DM Mono" font-size="9" letter-spacing="1.5" fill="#F1F0E8">ACREDIT.</text><text x="40" y="590" font-family="DM Mono" font-size="11" letter-spacing="2" fill="#5f5d56">LLEGADA</text>'+
      seats.map(function(s){return '<circle cx="'+s[0]+'" cy="'+s[1]+'" r="7" fill="none" stroke="#0b0b0b" stroke-opacity=".3"/>'}).join('')+'<g id="ppl"></g></svg>';
    wrap('e5',svg+'<div class="cn"><b id="cn">000</b><span class="k">Invitados dentro</span></div>'+side('Cada invitado,<br><b>en su sitio.</b>','Gestión de accesos, acreditaciones y aforo para que la llegada fluya sin esperas.'));
    var sec=document.getElementById('sc'),g=document.getElementById('ppl'),cn=document.getElementById('cn'),led=document.getElementById('led'),cs=[].slice.call(document.querySelectorAll('.e5 circle'));
    var path=[[40,560],[40,470],[300,470],[300,330],[470,330]],L=[];var tot=0;for(var i=1;i<path.length;i++){var d=Math.hypot(path[i][0]-path[i-1][0],path[i][1]-path[i-1][1]);L.push(d);tot+=d}
    var at=function(t){var dd=t*tot;for(var i=0;i<L.length;i++){if(dd<=L[i]){var k=dd/L[i];return [path[i][0]+(path[i+1][0]-path[i][0])*k,path[i][1]+(path[i+1][1]-path[i][1])*k]}dd-=L[i]}return path[path.length-1]};
    var NP=seats.length,ord=seats.map(function(_,i){return i}).sort(function(){return Math.random()-.5});
    var dots='';for(var i=0;i<NP;i++)dots+='<circle r="5" fill="#D93333" cx="-20" cy="-20"/>';g.innerHTML=dots;var ds=[].slice.call(g.children);
    tick=function(){var p=prog(sec),inside=0;
      ds.forEach(function(d,i){var st=.03+i/NP*.7,k=seg(p,st,st+.16);if(k<=0){d.setAttribute('r',0);return}d.setAttribute('r',5);
        var s=seats[ord[i]];if(k<.6){var q=at(k/.6);d.setAttribute('cx',q[0]+((i%3)-1)*8);d.setAttribute('cy',q[1]+((i%5)-2)*4)}else{var u=(k-.6)/.4,e=path[4];d.setAttribute('cx',e[0]+(s[0]-e[0])*u);d.setAttribute('cy',e[1]+(s[1]-e[1])*u)}
        if(k>=1)inside++});
      cn.textContent=('00'+inside).slice(-3);led.setAttribute('fill',p>.9?'#D93333':'#0b0b0b')};
  }
  var setBh=function(){document.documentElement.style.setProperty('--bh',bar.offsetHeight+'px')};setBh();
  var raf=0;addEventListener('scroll',function(){if(!raf)raf=requestAnimationFrame(function(){raf=0;tick()})},{passive:true});addEventListener('resize',function(){setBh();tick()});
  var FIX=new URLSearchParams(location.search).get('p');if(FIX!==null){prog=function(){return +FIX}}tick();
})();
</script>
