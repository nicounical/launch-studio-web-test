<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opciones página Servicios — Launch Studio</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Poppins:wght@300;400;500;600;800&display=swap">
<style>
/* Seis diseños para la página de Servicios con los mismos cinco servicios, lemas,
   textos y fotos que el bloque de la portada. Cada opción es la página entera. */
:root{--white:#F1F0E8;--ink:#0b0b0b;--red:#D93333;--grey:#5f5d56;--line:rgba(11,11,11,.16);--font:"Poppins",system-ui,sans-serif;--mono:"DM Mono",ui-monospace,Menlo,monospace;--pad:clamp(20px,5vw,80px);--ease:cubic-bezier(.7,0,.2,1)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--white);color:var(--ink);font-family:var(--font);font-weight:300;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
a{color:inherit}
img{display:block;width:100%;height:100%;object-fit:cover}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.bar{position:fixed;inset:0 0 auto 0;z-index:60;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px var(--pad);background:rgba(11,11,11,.92);color:var(--white);font:400 12px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.bar span{margin-right:auto}
.bar>button{border:1px solid rgba(241,240,232,.35);border-radius:999px;padding:6px 14px;color:var(--white);font:inherit;letter-spacing:inherit;text-transform:inherit}
.bar>button:hover{background:var(--red);border-color:var(--red)}
.bar>button[aria-pressed="true"]{background:var(--white);color:var(--ink);border-color:var(--white)}
.page{display:none;padding-top:44px}.page.on{display:block}
.wrap{padding-inline:var(--pad);max-width:1440px;margin-inline:auto}
.eyebrow{font-weight:600;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--red)}
.k{font:400 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
.top{padding-block:clamp(70px,9vw,130px) clamp(40px,5vw,70px)}
.top h1{font-weight:300;font-size:clamp(44px,7vw,120px);line-height:.98;letter-spacing:-.045em;margin-top:14px}
.top h1 em{font-style:normal;font-weight:600}
.top .lead{margin-top:clamp(20px,2.4vw,34px);font-size:clamp(17px,1.5vw,21px);line-height:1.5;color:var(--grey);max-width:34em}
.tag{text-transform:uppercase;font-weight:600;line-height:1;letter-spacing:-.025em}
.desc{font-size:clamp(16px,1.4vw,19px);line-height:1.55;color:var(--grey);max-width:28em}
.ph{overflow:hidden;background:#dddbd0}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border:1.5px solid currentColor;border-radius:999px;font-weight:500;font-size:15px;text-decoration:none;transition:background .3s,color .3s,border-color .3s}
.end{background:var(--red);color:var(--white);padding:clamp(60px,8vw,110px) 0}
.end .wrap{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:30px}
.end p{font-weight:300;font-size:clamp(28px,3.8vw,62px);line-height:1.05;letter-spacing:-.035em}
.end .btn:hover{background:var(--white);color:var(--red);border-color:var(--white)}
.js .rv{opacity:0;transform:translateY(30px);transition:opacity .8s,transform 1s cubic-bezier(.2,.7,.2,1)}
.js .rv.in{opacity:1;transform:none}

/* 1 · Filas alternas foto / texto */
.p1 .row{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(30px,6vw,110px);align-items:center;padding-block:clamp(40px,6vw,90px);border-top:1px solid var(--line)}
.p1 .row:nth-child(even) .ph{order:2}
.p1 .row .ph{aspect-ratio:5/4}
.p1 .row .ph img{transform:scale(1.12);transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.p1 .row.in .ph img{transform:none}
.p1 .row .n{font-weight:800;font-size:clamp(70px,8vw,140px);line-height:.8;letter-spacing:-.06em;color:transparent;-webkit-text-stroke:1.5px var(--red);display:block;margin-bottom:18px}
.p1 .tag{font-size:clamp(34px,4vw,66px);margin:10px 0 18px}

/* 2 · Pantallas completas que se suceden */
.p2 .sc{height:calc(var(--n)*100vh)}
.p2 .pin{position:sticky;top:44px;height:calc(100vh - 44px);overflow:hidden;color:var(--white)}
.p2 .slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(30px,5vw,80px) var(--pad);opacity:0;transition:opacity .8s}
.p2 .slide.on{opacity:1}
.p2 .slide .ph{position:absolute;inset:0;background:#1d1c1a}
.p2 .slide .ph img{filter:brightness(.5);transform:scale(1.08);transition:transform 6s linear}
.p2 .slide.on .ph img{transform:none}
.p2 .slide>*:not(.ph){position:relative}
.p2 .tag{font-size:clamp(46px,8vw,140px);margin:12px 0 18px;max-width:10em}
.p2 .desc{color:rgba(241,240,232,.85)}
.p2 .k{color:var(--white);opacity:.85}
.p2 .dots{position:absolute;right:var(--pad);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:2}
.p2 .dots i{display:block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--white);transition:background .3s,transform .3s}
.p2 .dots i.on{background:var(--red);border-color:var(--red);transform:scale(1.3)}

/* 3 · Acordeón: el lema grande y al abrir aparecen foto y texto */
.p3 .acc{border-top:1px solid var(--line);margin-bottom:clamp(60px,8vw,110px)}
.p3 .it{border-bottom:1px solid var(--line)}
.p3 .hd{width:100%;display:grid;grid-template-columns:3em minmax(0,1fr) auto auto;align-items:center;gap:clamp(12px,2vw,30px);padding:clamp(18px,2.4vw,30px) 0}
.p3 .hd .tag{font-size:clamp(28px,4.4vw,72px);transition:color .3s}
.p3 .hd:hover .tag,.p3 .it.open .tag{color:var(--red)}
.p3 .hd .k{color:var(--grey)}
.p3 .hd i{width:44px;aspect-ratio:1;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-style:normal;font-size:20px;transition:transform .5s var(--ease),background .3s,color .3s}
.p3 .it.open .hd i{transform:rotate(45deg);background:var(--ink);color:var(--white)}
.p3 .bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .7s var(--ease)}
.p3 .it.open .bd{grid-template-rows:1fr}
.p3 .bd>div{overflow:hidden}
.p3 .bd .in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:clamp(24px,4vw,60px);align-items:end;padding:0 0 clamp(24px,3vw,40px) calc(3em + clamp(12px,2vw,30px))}
.p3 .bd .ph{aspect-ratio:16/10}

/* 4 · Lista con la foto junto al cursor */
.p4{overflow:hidden}
.p4 .list{border-top:1px solid var(--line);margin-bottom:clamp(60px,8vw,110px);position:relative}
.p4 .li{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:center;padding:clamp(18px,2.4vw,32px) 0;border-bottom:1px solid var(--line);transition:opacity .35s}
.p4 .list.hot .li{opacity:.28}.p4 .list.hot .li.on{opacity:1}
.p4 .li .tag{font-size:clamp(30px,4.6vw,76px);transition:color .3s,transform .5s cubic-bezier(.2,.7,.2,1)}
.p4 .li.on .tag{color:var(--red);transform:translateX(clamp(8px,1.6vw,26px))}
.p4 .li .k{display:block;margin-bottom:8px;color:var(--grey)}
.p4 .float{position:fixed;left:0;top:0;z-index:50;width:clamp(220px,22vw,320px);aspect-ratio:4/5;overflow:hidden;pointer-events:none;background:#dddbd0;transform:translate(var(--x,-400px),var(--y,-400px)) translate(30px,-50%) rotate(var(--r,0deg)) scale(var(--s,0));transition:scale .35s cubic-bezier(.2,.7,.2,1)}
.p4 .float img{position:absolute;inset:0;opacity:0;transition:opacity .3s}.p4 .float img.on{opacity:1}

/* 5 · Mosaico: cinco piezas, al pasar el ratón se oscurece y aparece el texto */
.p5 .mos{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:clamp(220px,24vw,340px);gap:6px;margin-bottom:clamp(60px,8vw,110px)}
.p5 .tile{position:relative;overflow:hidden;color:var(--white);background:#1d1c1a}
.p5 .tile:nth-child(1){grid-column:span 4;grid-row:span 2}
.p5 .tile:nth-child(2){grid-column:span 2;grid-row:span 1}
.p5 .tile:nth-child(3){grid-column:span 2;grid-row:span 1}
.p5 .tile:nth-child(4){grid-column:span 3}
.p5 .tile:nth-child(5){grid-column:span 3}
.p5 .tile img{position:absolute;inset:0;transition:transform 1.2s cubic-bezier(.2,.7,.2,1),filter .6s}
.p5 .tile:hover img,.p5 .tile:focus-within img{transform:scale(1.06);filter:brightness(.38)}
.p5 .tile .in{position:absolute;left:0;right:0;bottom:0;padding:clamp(16px,2vw,30px);background:linear-gradient(transparent,rgba(0,0,0,.55))}
.p5 .tile .tag{font-size:clamp(20px,2.4vw,40px)}
.p5 .tile:nth-child(1) .tag{font-size:clamp(30px,4vw,64px)}
.p5 .tile .k{color:var(--white);opacity:.85;display:block;margin-bottom:8px}
.p5 .tile .desc{color:rgba(241,240,232,.88);max-height:0;opacity:0;overflow:hidden;transition:max-height .6s var(--ease),opacity .4s,margin .4s}
.p5 .tile:hover .desc,.p5 .tile:focus-within .desc{max-height:8em;opacity:1;margin-top:12px}

/* 6 · Negro: el lema en contorno se rellena al llegar y la foto entra en círculo */
.p6{background:var(--ink);color:var(--white)}
.p6 .top .lead{color:rgba(241,240,232,.7)}
.p6 .blk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(30px,6vw,110px);align-items:center;padding-block:clamp(50px,7vw,110px);border-top:1px solid rgba(241,240,232,.15)}
.p6 .blk .tag{position:relative;font-weight:800;font-size:clamp(40px,5.6vw,96px);letter-spacing:-.05em;color:transparent;-webkit-text-stroke:1.5px rgba(241,240,232,.75);margin:12px 0 20px}
.p6 .blk .tag::after{content:attr(data-t);position:absolute;inset:0;color:var(--white);-webkit-text-stroke:0;clip-path:inset(-20% 100% -20% 0);transition:clip-path 1.2s var(--ease) .2s}
.p6 .blk.in .tag::after{clip-path:inset(-20% 0 -20% 0)}
.p6 .blk:nth-child(even) .tag::after{color:var(--red)}
.p6 .blk .desc{color:rgba(241,240,232,.72)}
.p6 .blk .ph{aspect-ratio:1;border-radius:50%;clip-path:circle(22% at 50% 50%);transition:clip-path 1.4s var(--ease)}
.p6 .blk.in .ph{clip-path:circle(50% at 50% 50%)}
.p6 .blk:nth-child(even) .ph{order:-1}

@media (max-width:820px){
  .p1 .row{grid-template-columns:1fr}.p1 .row:nth-child(even) .ph{order:0}
  .p3 .hd{grid-template-columns:2.4em minmax(0,1fr) auto}.p3 .hd .k{display:none}.p3 .bd .in{grid-template-columns:1fr;padding-left:0}
  .p4 .li{grid-template-columns:1fr}.p4 .float{display:none}
  .p5 .mos{grid-template-columns:1fr 1fr;grid-auto-rows:220px}.p5 .tile:nth-child(n){grid-column:span 2;grid-row:span 1}.p5 .tile .desc{max-height:none;opacity:1;margin-top:10px}.p5 .tile img{filter:brightness(.45)}
  .p6 .blk{grid-template-columns:1fr}.p6 .blk:nth-child(even) .ph{order:0}.p6 .blk .ph{max-width:360px}
  .bar span{display:none}.bar{justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.js .rv{opacity:1;transform:none}}
</style>
</head>
<body>
<nav class="bar" aria-label="Opciones"><span>Página Servicios · seis opciones</span>
  <button data-p="1" aria-pressed="true">1 · Filas</button><button data-p="2" aria-pressed="false">2 · Pantallas</button><button data-p="3" aria-pressed="false">3 · Acordeón</button><button data-p="4" aria-pressed="false">4 · Lista</button><button data-p="5" aria-pressed="false">5 · Mosaico</button><button data-p="6" aria-pressed="false">6 · Negro</button></nav>

<main class="page p1 on" id="p1"><div data-top></div><div class="wrap" id="l1"></div><div data-end></div></main>
<main class="page p2" id="p2"><div data-top></div><section class="sc" id="p2sc" style="--n:5"><div class="pin" id="p2pin"><div class="dots" id="p2dots"></div></div></section><div data-end></div></main>
<main class="page p3" id="p3"><div data-top></div><div class="wrap"><div class="acc" id="l3"></div></div><div data-end></div></main>
<main class="page p4" id="p4"><div data-top></div><div class="wrap"><div class="list" id="l4"></div></div><div class="float" id="p4f" aria-hidden="true"></div><div data-end></div></main>
<main class="page p5" id="p5"><div data-top></div><div class="wrap"><div class="mos" id="l5"></div></div><div data-end></div></main>
<main class="page p6" id="p6"><div data-top></div><div class="wrap" id="l6"></div><div data-end></div></main>

<script>
(function(){
  var OLD='https://www.launchstudiogroup.com/';
  var S=[
    {n:'Stands',t:'Build to stand out',d:'Diseñamos espacios que captan miradas y hacen que las marcas destaquen.',i:'assets/img/servicios/servicio-stands-truphone.jpg'},
    {n:'Eventos corporativos',t:'Every detail matters',d:'Elegancia, precisión y diseño en eventos donde cada detalle cuenta.',i:'assets/img/proyectos/04-evento-corporativo-ntt-data.jpg',o:'25f3b694-0d3c-438c-be95-81e2b03044e5.JPG'},
    {n:'Experiencias de marca',t:'Make it a feeling',d:'Experiencias que conectan con las personas y convierten las marcas en emociones.',i:'assets/img/servicios/servicio-experiencias-cursa-base4.jpg'},
    {n:'Renders, interiorismo y planimetría',t:'Vision into form',d:'De la idea al espacio. Precisión técnica y visión estética.',i:'assets/img/servicios/servicio-renders-interiorismo.jpg'},
    {n:'Diseño gráfico',t:'Identity in every detail',d:'Identidades visuales que transmiten personalidad, coherencia y carácter.',i:'assets/img/servicios/servicio-diseno-grafico-ceramica.jpg'}];
  var $=function(id){return document.getElementById(id)},each=function(l,f){[].forEach.call(l,f)},n2=function(i){return '0'+(i+1)},cl=function(x){return Math.max(0,Math.min(1,x))};
  var calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var img=function(s){return '<img src="'+s.i+'" alt="'+s.n+'" loading="lazy"'+(s.o?' onerror="this.onerror=null;this.src=\''+OLD+s.o+'\'"':'')+'>'};
  document.querySelectorAll('[data-top]').forEach(function(el){el.outerHTML='<div class="wrap top"><p class="eyebrow">Servicios</p><h1>Lo que <em>hacemos.</em></h1><p class="lead">Stands, eventos corporativos, experiencias de marca, renders e interiorismo y diseño gráfico. Del concepto al montaje, en cualquier punto de Europa.</p></div>'});
  document.querySelectorAll('[data-end]').forEach(function(el){el.outerHTML='<section class="end"><div class="wrap"><p>¿Tienes un proyecto en mente?</p><a class="btn" href="contacto.html">Hablemos →</a></div></section>'});
  // 1
  $('l1').innerHTML=S.map(function(s,i){return '<article class="row rv"><div class="ph">'+img(s)+'</div><div><span class="n">'+n2(i)+'</span><span class="k">'+s.n+'</span><h2 class="tag">'+s.t+'</h2><p class="desc">'+s.d+'</p></div></article>'}).join('');
  // 2
  $('p2pin').insertAdjacentHTML('afterbegin',S.map(function(s,i){return '<article class="slide'+(i?'':' on')+'"><div class="ph">'+img(s)+'</div><span class="k">'+n2(i)+' · '+s.n+'</span><h2 class="tag">'+s.t+'</h2><p class="desc">'+s.d+'</p></article>'}).join(''));
  $('p2dots').innerHTML=S.map(function(s,i){return '<i'+(i?'':' class="on"')+'></i>'}).join('');
  // 3
  $('l3').innerHTML=S.map(function(s,i){return '<div class="it'+(i?'':' open')+'"><button class="hd" aria-expanded="'+(i===0)+'"><span class="k">'+n2(i)+'</span><span class="tag">'+s.t+'</span><span class="k">'+s.n+'</span><i aria-hidden="true">+</i></button><div class="bd"><div><div class="in"><div class="ph">'+img(s)+'</div><div><span class="k">'+s.n+'</span><p class="desc" style="margin-top:10px">'+s.d+'</p></div></div></div></div></div>'}).join('');
  each($('l3').children,function(it){it.querySelector('.hd').addEventListener('click',function(){var o=!it.classList.contains('open');each($('l3').children,function(x){x.classList.remove('open');x.querySelector('.hd').setAttribute('aria-expanded','false')});if(o){it.classList.add('open');it.querySelector('.hd').setAttribute('aria-expanded','true')}})});
  // 4
  $('l4').innerHTML=S.map(function(s,i){return '<div class="li" tabindex="0" data-i="'+i+'"><div><span class="k">'+n2(i)+' · '+s.n+'</span><h2 class="tag">'+s.t+'</h2></div><p class="desc">'+s.d+'</p></div>'}).join('');
  var fl=$('p4f');fl.innerHTML=S.map(img).join('');
  var L4=$('l4'),tx=-400,ty=-400,fx=-400,fy=-400,rot=0,cur=-1;
  function set4(i){cur=i;each(L4.children,function(r,k){r.classList.toggle('on',k===i)});L4.classList.toggle('hot',i>=0);fl.style.setProperty('--s',i>=0?1:0);if(i>=0)each(fl.children,function(m,k){m.classList.toggle('on',k===i)})}
  each(L4.children,function(r,i){r.addEventListener('pointerenter',function(){set4(i)});r.addEventListener('focus',function(){set4(i)})});
  L4.addEventListener('pointerleave',function(){set4(-1)});
  addEventListener('pointermove',function(e){tx=e.clientX;ty=e.clientY});
  (function loop(){var ox=fx;fx+=(tx-fx)*.14;fy+=(ty-fy)*.14;rot+=(((fx-ox)*.5)-rot)*.15;fl.style.setProperty('--x',fx.toFixed(1)+'px');fl.style.setProperty('--y',fy.toFixed(1)+'px');fl.style.setProperty('--r',Math.max(-12,Math.min(12,rot)).toFixed(2)+'deg');requestAnimationFrame(loop)})();
  // 5
  $('l5').innerHTML=S.map(function(s,i){return '<article class="tile" tabindex="0">'+img(s)+'<div class="in"><span class="k">'+n2(i)+' · '+s.n+'</span><h2 class="tag">'+s.t+'</h2><p class="desc">'+s.d+'</p></div></article>'}).join('');
  // 6
  $('l6').innerHTML=S.map(function(s,i){return '<article class="blk rv"><div><span class="k">'+n2(i)+' · '+s.n+'</span><h2 class="tag" data-t="'+s.t.toUpperCase()+'">'+s.t+'</h2><p class="desc">'+s.d+'</p></div><div class="ph">'+img(s)+'</div></article>'}).join('');

  var pages=document.querySelectorAll('.page'),btns=document.querySelectorAll('.bar>[data-p]');
  function show(n){pages.forEach(function(p){p.classList.toggle('on',p.id==='p'+n)});btns.forEach(function(b){b.setAttribute('aria-pressed',b.dataset.p===String(n))});scrollTo(0,0);set4(-1);reveal();onScroll()}
  btns.forEach(function(b){b.addEventListener('click',function(){show(b.dataset.p)})});
  var io;if(!calm&&'IntersectionObserver' in window){document.documentElement.classList.add('js');io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{rootMargin:'0px 0px -12% 0px'})}
  function reveal(){if(io)each(document.querySelectorAll('.page.on .rv:not(.in)'),function(el){io.observe(el)});else each(document.querySelectorAll('.rv'),function(el){el.classList.add('in')})}
  reveal();
  var sl=$('p2pin').querySelectorAll('.slide'),dots=$('p2dots').children;
  function onScroll(){if(!$('p2').classList.contains('on'))return;var r=$('p2sc').getBoundingClientRect(),p=cl(-r.top/(r.height-innerHeight)),i=Math.min(S.length-1,Math.floor(p*S.length*.999));
    each(sl,function(s,k){s.classList.toggle('on',k===i)});each(dots,function(d,k){d.classList.toggle('on',k===i)})}
  addEventListener('scroll',onScroll,{passive:true});onScroll();
})();
</script>
</body>
</html>
