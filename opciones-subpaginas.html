<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Subpáginas de servicios — Launch Studio</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Poppins:wght@300;400;500;600;800&display=swap">
<style>
/* Una subpágina por servicio: portada animada (se reproduce sola), descripción breve y fotos de ejemplo.
   Las animaciones están hechas con código, no son vídeos: cargan rápido y se ven nítidas en cualquier pantalla. */
:root{--white:#F1F0E8;--paper:#F7F6F1;--ink:#0b0b0b;--red:#D93333;--grey:#5f5d56;--line:rgba(11,11,11,.14);--font:"Poppins",system-ui,sans-serif;--mono:"DM Mono",ui-monospace,Menlo,monospace;--pad:clamp(20px,4vw,64px);--ease:cubic-bezier(.7,0,.2,1);--bh:48px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--white);color:var(--ink);font-family:var(--font);font-weight:300;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,figure{margin:0}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:100%;object-fit:cover}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.bar{position:fixed;inset:0 0 auto 0;z-index:80;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:9px var(--pad);background:rgba(11,11,11,.94);color:var(--white);font:400 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.bar b{font-weight:400;opacity:.55;margin-right:6px}
.bar button{border:1px solid rgba(241,240,232,.35);border-radius:999px;padding:5px 12px;color:var(--white);font:inherit;letter-spacing:inherit;text-transform:inherit}
.bar button:hover{background:var(--red);border-color:var(--red)}
.bar button[aria-pressed="true"]{background:var(--white);color:var(--ink);border-color:var(--white)}
#app{padding-top:var(--bh)}
.wrap{padding-inline:var(--pad);max-width:1440px;margin-inline:auto}
.k{font:400 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--red)}

/* ── Portada animada ── */
.hero{position:relative;height:calc(100vh - var(--bh));min-height:580px;overflow:hidden;background:var(--paper)}
.stage{position:absolute;inset:0;overflow:hidden}
.ov{position:absolute;z-index:8;transition:color .6s}
.ttl{left:var(--pad);top:clamp(22px,3vw,36px)}
.crumb{display:flex;gap:10px;align-items:center;font:400 11px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.crumb a{opacity:.55}.crumb a:hover{opacity:1;color:var(--red)}
.ttl h1{font-weight:800;font-size:clamp(34px,4.4vw,76px);line-height:.88;letter-spacing:-.065em;margin-top:14px}
.ttl h1 span{color:var(--red)}
.stp{right:var(--pad);top:clamp(22px,3vw,36px);width:min(340px,38vw);text-align:right}
.stp .n{font:400 11px var(--mono);letter-spacing:.08em;color:var(--red)}
.stp h3{font-weight:300;font-size:clamp(22px,2.2vw,36px);line-height:1.04;letter-spacing:-.04em;margin-top:8px}
.stp p{font-size:14px;line-height:1.55;color:var(--grey);margin-top:10px;transition:color .6s}
.stp .sw{animation:sw .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes sw{from{opacity:0;transform:translateY(12px)}}
.chips{left:var(--pad);right:var(--pad);bottom:clamp(18px,2.4vw,30px);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips button{position:relative;overflow:hidden;padding:9px 16px;border-radius:999px;background:rgba(255,255,255,.9);box-shadow:0 0 0 1px var(--line);font-weight:500;font-size:13px;backdrop-filter:blur(6px)}
.chips button i{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--red);transform-origin:0 50%;transform:scaleX(var(--p,0))}
.chips button.on{background:var(--ink);color:#fff}
.chips .pp{width:42px;height:42px;padding:0;display:grid;place-items:center;background:var(--red);color:#fff;margin-left:auto;box-shadow:none}
.hero.dark .ttl,.hero.dark .stp{color:#fff}.hero.dark .stp p{color:rgba(255,255,255,.8)}
.hero.dark .crumb a{opacity:.75}

/* ── Descripción + fotos ── */
.desc{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(30px,6vw,110px);padding-block:clamp(60px,8vw,120px)}
.desc h2{font-weight:400;font-size:clamp(30px,3.2vw,54px);line-height:1.04;letter-spacing:-.04em;margin-top:14px}
.desc .body p{font-size:clamp(16px,1.3vw,18px);line-height:1.75;color:var(--grey);max-width:36em}
.desc .body p.goal{margin-top:1.4em;padding-left:clamp(16px,2vw,26px);border-left:3px solid var(--red);font-weight:400;font-size:clamp(19px,1.6vw,24px);line-height:1.42;letter-spacing:-.015em;color:var(--ink)}
.desc .body p.goal b{font-weight:600;color:var(--red)}
.desc .cta{display:inline-flex;margin-top:30px;padding:13px 24px;border-radius:999px;background:var(--ink);color:#fff;font-weight:500;font-size:15px;transition:background .3s}
.desc .cta:hover{background:var(--red)}
.galh{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-block:24px}
.galh h2{font-weight:800;font-size:clamp(30px,3.4vw,56px);letter-spacing:-.06em}
.gal{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(10px,1.4vw,20px);padding-bottom:clamp(60px,8vw,110px)}
.gal .ph{position:relative;overflow:hidden;border-radius:8px;background:#dddbd0;grid-column:span 4;aspect-ratio:4/5}
.gal .ph:nth-child(1){grid-column:span 8;aspect-ratio:16/10}.gal .ph:nth-child(2){aspect-ratio:auto}
.gal .ph img{transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}.gal .ph:hover img{transform:scale(1.04)}
.gal .ph.empty{background:repeating-linear-gradient(135deg,#e7e6dc 0 14px,#e1e0d5 14px 28px);outline:1.5px dashed rgba(11,11,11,.25);outline-offset:-1.5px}
.gal .ph.empty::after{content:"+ Foto de ejemplo";position:absolute;inset:0;display:grid;place-items:center;font:400 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--grey)}
.end{background:var(--red);color:var(--white);padding:clamp(60px,8vw,110px) 0}
.end .wrap{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:30px}
.end p{font-weight:300;font-size:clamp(28px,3.8vw,62px);line-height:1.05;letter-spacing:-.035em}
.end a{display:inline-flex;padding:14px 26px;border:1.5px solid currentColor;border-radius:999px;font-weight:500;transition:background .3s,color .3s}
.end a:hover{background:var(--white);color:var(--red)}
.res{position:absolute;inset:0;z-index:6;clip-path:circle(calc(var(--r,0)*80%) at 50% 55%);pointer-events:none}
.res img{transform:scale(calc(1.12 - var(--r,0)*.12))}
.res::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.45),transparent 30%,transparent 70%,rgba(0,0,0,.45))}

/* ── STANDS: maqueta 3D ── */
.sg{position:absolute;inset:0;perspective:2600px;perspective-origin:50% 30%;overflow:hidden}
.world{position:absolute;left:var(--wx,50%);top:var(--wy,52%);width:700px;height:490px;margin:-245px 0 0 -350px;transform-style:preserve-3d;will-change:transform}
.world *{transform-style:preserve-3d}
.gridp{position:absolute;left:-910px;top:-770px;width:2520px;height:2030px;background-image:linear-gradient(rgba(11,11,11,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(11,11,11,.07) 1px,transparent 1px),linear-gradient(rgba(11,11,11,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(11,11,11,.035) 1px,transparent 1px);background-size:70px 70px,70px 70px,14px 14px,14px 14px;-webkit-mask:radial-gradient(closest-side,#000 30%,transparent);mask:radial-gradient(closest-side,#000 30%,transparent);opacity:var(--grid,1)}
.floor{position:absolute;inset:0;outline:1px solid rgb(11 11 11 / calc(var(--bd,1)*.4))}
.floor::before{content:"";position:absolute;inset:0;opacity:var(--fill,0);background:linear-gradient(115deg,rgba(255,255,255,.4),transparent 55%),repeating-linear-gradient(90deg,#ece3d4 0 34px,#e2d7c5 34px 35px),#e8dfcf}
.sh{position:absolute;background:rgba(40,30,20,.3);filter:blur(9px);opacity:var(--fill,0);border-radius:6px}
.pool{position:absolute;width:170px;height:170px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,236,196,.9),rgba(255,226,170,.3) 55%,transparent);opacity:var(--lit,0)}
.plan{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.plan .ln{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:calc(1 - var(--d,0))}
.plan .ln.th{stroke-width:2.6}
.plan .dm{fill:none;stroke:var(--red);stroke-width:1.1;stroke-dasharray:1;stroke-dashoffset:calc(1 - var(--d,0))}
.plan .hat{fill:url(#hatch);opacity:calc(var(--dd,0) * (1 - var(--rise,0)))}
.plan text{font:400 13px var(--mono);letter-spacing:.06em;fill:var(--red);opacity:var(--t,0)}
.plan .big{font:300 40px var(--font);letter-spacing:-.04em;fill:var(--ink)}
.plan .lab{font:400 10px var(--mono);fill:var(--grey);letter-spacing:.08em}
.plan .hide{opacity:calc(1 - var(--rise,0))}
.bx{position:absolute;opacity:var(--bxo,0)}
.fw{position:absolute;width:0;height:0}
.f{position:absolute;left:0;bottom:0;transform-origin:50% 100%;transform:rotateX(-90deg) scaleY(var(--g,0));border:1px solid rgb(11 11 11 / var(--bd,1));background:rgb(var(--c,255 255 255) / var(--fill,0));overflow:hidden}
.f::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.08),transparent 40%,rgba(255,255,255,.18));opacity:var(--fill,0);pointer-events:none}
.f.sd{--c:232 231 223}.f.bk{--c:220 219 210}
.tp{position:absolute;left:0;top:0;transform:translateZ(calc(var(--h)*var(--g,0)*1px));border:1px solid rgb(11 11 11 / var(--bd,1));background:rgb(var(--tc,251 250 246) / var(--fill,0))}
.dk .f{--c:46 44 41}.dk .f.sd{--c:36 34 32}.dk .f.bk{--c:30 29 27}.dk .tp{--tc:58 56 52}
.wd .f{--c:206 170 126}.wd .f.sd{--c:184 148 106}.wd .tp{--tc:218 186 146}
.bg .f{--c:226 218 204}.bg .f.sd{--c:208 199 184}.bg .tp{--tc:236 230 218}
.gn .f{--c:112 128 74}.gn .f.sd{--c:92 108 60}.gn .tp{--tc:128 146 86}
.gx{position:absolute;inset:0;opacity:var(--gfx,0)}
.gx .scr{position:absolute;background:#16140f;box-shadow:inset 0 0 0 3px #2a2a2a;overflow:hidden}
.gx .scr::after{content:"";position:absolute;inset:6%;background:linear-gradient(160deg,#efe6d6,#c7b59a 50%,#8d7a62)}
.gx .wm{position:absolute;color:#ECE6DA;font:400 13px var(--font);letter-spacing:.32em;line-height:1.35;white-space:nowrap;text-transform:uppercase}
.gx .wm small{display:block;font-size:7px;letter-spacing:.18em;margin-top:8px;opacity:.85;line-height:1.7}
.gx .wm.ink{color:#2a2723}
.gx .lg{position:absolute}
.gx .slat{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 12px,rgba(0,0,0,.1) 12px 14px)}
.led{position:absolute;left:0;right:0;height:3px;background:#ffe2a8;box-shadow:0 0 12px 4px rgba(255,214,140,.8);opacity:var(--lit,0)}
.cano{transform:translateZ(calc(var(--bz,600)*1px));opacity:var(--cno,0)}
.an{position:absolute;width:2px;height:2px}
.callouts{position:absolute;inset:0;z-index:4;pointer-events:none}
.callouts svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.callouts line{stroke:var(--ink);stroke-width:1}
.callouts circle{fill:var(--white);stroke:var(--red);stroke-width:2}
.co{position:absolute;left:0;top:0;padding:9px 12px 10px;background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:6px;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.06);transition:opacity .35s}
.callouts g{transition:opacity .35s}
.co b{display:block;font-weight:600;font-size:13px;letter-spacing:-.01em}
.co span{display:block;font:400 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--grey);margin-top:3px}
.warm{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(80% 70% at 50% 55%,transparent 30%,rgba(40,30,18,.35));opacity:var(--lit,0)}

/* ── SVG planos (eventos y experiencias) ── */
.tilt{position:absolute;inset:0;perspective:1800px;perspective-origin:50% 20%}
.tilt svg{position:absolute;left:50%;top:50%;width:min(84vw,calc((100vh - var(--bh))*1.22));transform:translate(-50%,-44%) rotateX(var(--tx,0deg)) scale(var(--ts,1));transform-origin:50% 60%;overflow:visible}
.pl .w{fill:none;stroke:var(--ink);stroke-width:7;stroke-dasharray:1;stroke-dashoffset:calc(1 - var(--d,0))}
.pl .o{fill:#fff;stroke:var(--ink);stroke-width:2}
.pl .lb{font:400 13px var(--mono);letter-spacing:.1em;fill:var(--grey)}
.pl .lbr{font:400 13px var(--mono);letter-spacing:.1em;fill:var(--red)}
.pl [data-t]{transform-box:fill-box;transform-origin:center}
.pl .dot{fill:var(--red)}
.cards{position:absolute;inset:0;display:grid;place-items:center;z-index:5;pointer-events:none}
.cards .ct{text-align:center;opacity:var(--co,0);transform:translateY(calc((1 - var(--co,0))*20px))}
.cards .ct .k{display:block}
.cards .ct h4{font-weight:300;font-size:clamp(26px,3vw,48px);letter-spacing:-.04em;margin:14px 0 20px}
.cards .ct .tags{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cards .ct .tags span{padding:10px 18px;border-radius:999px;border:1.5px solid var(--ink);font-weight:500;font-size:15px;background:#fff}
.cards .ct .tags span:nth-child(2){background:var(--red);border-color:var(--red);color:#fff}
.cnt{position:absolute;z-index:5;padding:8px 11px;border-radius:8px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.08),0 0 0 1px var(--line);font:400 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--grey);white-space:nowrap;transition:opacity .4s;left:0;top:0}
.cnt b{display:block;font:800 22px var(--font);letter-spacing:-.04em;color:var(--ink)}

/* ── RENDERS ── */
.rd{position:absolute;inset:0;background:#f4f1ea}
.rd::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.05) 1px,transparent 1px);background-size:5px 5px;opacity:.6}
.rd .lay{position:absolute;inset:0}
.rd .sk{mix-blend-mode:multiply;clip-path:inset(0 calc((1 - var(--w,0))*100%) 0 0);opacity:var(--sko,1)}
.rd .wc{mix-blend-mode:multiply;opacity:var(--wco,0);filter:saturate(.55) contrast(.9) blur(1px)}
.rd .fin{opacity:var(--fo,0)}
.rd svg{position:absolute;inset:0;width:100%;height:100%}
.rd .cn{stroke:rgba(11,11,11,.28);stroke-width:1.2;fill:none;stroke-dasharray:1;stroke-dashoffset:calc(1 - var(--d,0))}
.rd .mn{stroke:#2a2724;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:calc(1 - var(--d,0))}
.rd .veil{position:absolute;inset:0 0 auto 0;height:34%;background:linear-gradient(#f4f1ea,rgba(244,241,234,0));opacity:calc(1 - var(--fo,0))}.rd .pen{position:absolute;top:0;bottom:0;width:2px;left:calc(var(--w,0)*100%);background:var(--red);box-shadow:0 0 0 4px rgba(217,51,51,.12);opacity:var(--po,0)}
.rd .tag{position:absolute;right:var(--pad);bottom:clamp(80px,9vw,100px);z-index:5;padding:6px 12px;border-radius:999px;background:#fff;font:400 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;opacity:var(--fo,0)}

/* ── DISEÑO GRÁFICO ── */
.dg{position:absolute;inset:0;background:var(--paper)}
.dg svg{position:absolute;inset:0;width:100%;height:100%}
.dg .grd{stroke:rgba(11,11,11,.08);stroke-width:1}
.dg .gd{fill:none;stroke:var(--red);stroke-width:1.2;stroke-dasharray:6 6;opacity:.8}
.dg .gl{stroke:rgba(217,51,51,.5);stroke-width:1}
.dg .lo{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-dasharray:1;stroke-dashoffset:calc(1 - var(--d,0))}
.dg .pt{fill:#fff;stroke:var(--red);stroke-width:2}
.dg .wm{font-family:var(--font);font-weight:800;letter-spacing:-.05em;fill:var(--ink)}
.dg .tg{font:400 20px var(--mono);letter-spacing:.18em;fill:var(--red)}
.dg .hx{font:400 13px var(--mono);letter-spacing:.06em;fill:var(--grey)}
.dg .apps{position:absolute;inset:0;pointer-events:none}
.dg .ap{position:absolute;box-shadow:0 30px 60px rgba(0,0,0,.15);opacity:var(--ao,0);transition:none}
.dg .card1{width:22%;aspect-ratio:85/55;left:12%;top:30%;background:#fff;border-radius:6px;transform:translateY(calc((1 - var(--ao,0))*80px)) rotate(-8deg)}
.dg .card2{width:22%;aspect-ratio:85/55;left:17%;top:46%;background:var(--red);border-radius:6px;transform:translateY(calc((1 - var(--ao,0))*120px)) rotate(4deg)}
.dg .tote{width:17%;aspect-ratio:4/5;left:41.5%;top:30%;background:#e6dccb;border-radius:4px 4px 10px 10px;transform:translateY(calc((1 - var(--ao,0))*140px))}
.dg .tote::before{content:"";position:absolute;left:28%;right:28%;top:-18%;height:24%;border:5px solid #d3c6b0;border-bottom:0;border-radius:60px 60px 0 0}
.dg .sign{width:26%;aspect-ratio:16/10;left:63%;top:28%;border-radius:6px;overflow:hidden;transform:translateY(calc((1 - var(--ao,0))*100px)) rotate(3deg)}
.dg .badge{width:10%;aspect-ratio:3/4;left:66%;top:62%;background:#fff;border-radius:6px;transform:translateY(calc((1 - var(--ao,0))*160px)) rotate(-6deg)}
.dg .badge::before{content:"";position:absolute;left:44%;width:12%;top:-60%;height:62%;background:var(--red)}
.dg .ap svg{position:absolute;width:auto;height:auto}
.dg .ap .wmh{position:absolute;font-weight:800;letter-spacing:-.05em;line-height:.9}
.dg .ap .mn{position:absolute;font:400 8px var(--mono);letter-spacing:.12em;text-transform:uppercase}

@media (max-width:820px){
  .stp{left:var(--pad);right:var(--pad);top:auto;bottom:calc(30px + 100px);width:auto;text-align:left}.stp p{display:none}
  .chips button{font-size:0;padding:0;width:34px;height:34px;display:grid;place-items:center}.chips button span{font-size:11px}
  .desc{grid-template-columns:1fr}
  .gal .ph,.gal .ph:nth-child(1){grid-column:span 12;aspect-ratio:4/3}.gal .ph:nth-child(2){aspect-ratio:4/3}
  .co{padding:6px 8px}.co span{display:none}.co b{font-size:11px}
  .tilt svg{width:100vw}
  .chips .pp{font-size:15px;width:38px;height:38px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav class="bar" id="bar" aria-label="Subpáginas"><b>Subpáginas</b>
  <button data-p="stands">Stands</button><button data-p="eventos">Eventos corporativos</button><button data-p="experiencias">Experiencias de marca</button><button data-p="renders">Renders</button><button data-p="grafico">Diseño gráfico</button>
</nav>
<div id="app"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#0b0b0b" stroke-width="1" opacity=".35"/></pattern>
  <radialGradient id="spot"><stop offset="0" stop-color="#fff1d2" stop-opacity=".95"/><stop offset=".55" stop-color="#ffe2a8" stop-opacity=".35"/><stop offset="1" stop-color="#ffe2a8" stop-opacity="0"/></radialGradient>
  <filter id="pencil"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
</defs></svg>

<script>
(function(){
  var R='https://www.launchstudiogroup.com/';
